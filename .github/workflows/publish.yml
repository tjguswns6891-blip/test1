name: Publish video

# Uploads one finished video from the video-files branch to YouTube and/or Instagram
# through the official APIs (publish/upload.py). Run it from the Actions tab or via the API.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "어디에 올릴지"
        type: choice
        options: [both, youtube, instagram, youtube-update, youtube-list, youtube-plan, youtube-playlist, youtube-channel, instagram-comments, instagram-carousel]
        default: both
      video:
        description: "video-files 브랜치 안의 영상 경로 (예: 회로이론_소개/쇼츠_A.mp4), youtube-update면 영상 ID, youtube-playlist면 영상 ID들(쉼표), youtube-plan이면 publish/plans/ 안의 JSON 경로, instagram-carousel이면 카드 JPG가 든 폴더, 그 외 모드는 -"
        required: true
      title:
        description: "유튜브 제목"
        default: ""
      description:
        description: "유튜브 설명 = 인스타 캡션 (줄바꿈은 \\n)"
        default: ""
      caption:
        description: "인스타 캡션 (비우면 위 설명을 씀, 줄바꿈은 \\n)"
        default: ""
      tags:
        description: "유튜브 태그 (쉼표로 구분), youtube-channel이면 채널 키워드 (공백으로 구분)"
        default: ""
      thumbnail:
        description: "video-files 브랜치 안의 썸네일 경로 (유튜브 썸네일 + 인스타 커버)"
        default: ""
      privacy:
        description: "유튜브 공개 범위"
        type: choice
        options: [public, unlisted, private]
        default: public
      publish_at:
        description: "유튜브 예약 공개 시각 (예: 2026-10-20T18:00:00+09:00, 비우면 바로)"
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: publish
      - name: Fetch the video from video-files
        if: inputs.platform == 'both' || inputs.platform == 'youtube' || inputs.platform == 'instagram'
        env:
          VIDEO: ${{ inputs.video }}
          THUMB: ${{ inputs.thumbnail }}
        run: |
          git fetch --quiet --depth 1 origin video-files
          mkdir -p media
          git show "FETCH_HEAD:$VIDEO" > media/video.mp4
          if [ -n "$THUMB" ]; then git show "FETCH_HEAD:$THUMB" > "media/thumb.${THUMB##*.}"; fi
          ls -l media
      - name: YouTube
        if: inputs.platform == 'both' || inputs.platform == 'youtube'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TITLE: ${{ inputs.title }}
          DESC: ${{ inputs.description }}
          TAGS: ${{ inputs.tags }}
          PRIVACY: ${{ inputs.privacy }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          thumb=$(ls media/thumb.* 2>/dev/null || true)
          python3 publish/upload.py youtube media/video.mp4 --title "$TITLE" \
            --description "$(printf '%b' "$DESC")" --tags "$TAGS" --privacy "$PRIVACY" \
            --publish-at "$PUBLISH_AT" ${thumb:+--thumbnail "$thumb"}
      - name: Update a YouTube video
        if: inputs.platform == 'youtube-update'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_ID: ${{ inputs.video }}
          TITLE: ${{ inputs.title }}
          DESC: ${{ inputs.description }}
          TAGS: ${{ inputs.tags }}
        run: |
          python3 publish/upload.py youtube-update "$VIDEO_ID" --title "$TITLE" \
            --description "$(printf '%b' "$DESC")" --tags "$TAGS"
      - name: List YouTube videos
        if: inputs.platform == 'youtube-list'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 publish/upload.py youtube-list
      - name: Apply a YouTube plan
        if: inputs.platform == 'youtube-plan'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PLAN: ${{ inputs.video }}
        run: python3 publish/upload.py youtube-plan "$PLAN"
      - name: Fill a YouTube playlist
        if: inputs.platform == 'youtube-playlist'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IDS: ${{ inputs.video }}
          TITLE: ${{ inputs.title }}
          DESC: ${{ inputs.description }}
        run: |
          python3 publish/upload.py youtube-playlist --title "$TITLE" --description "$(printf '%b' "$DESC")" --video-ids "$IDS"
      - name: Update the YouTube channel
        if: inputs.platform == 'youtube-channel'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DESC: ${{ inputs.description }}
          TAGS: ${{ inputs.tags }}
        run: |
          python3 publish/upload.py youtube-channel --description "$(printf '%b' "$DESC")" --keywords "$TAGS"
      - name: Instagram comments
        if: inputs.platform == 'instagram-comments'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 publish/upload.py instagram-comments
      - name: Instagram
        if: inputs.platform == 'both' || inputs.platform == 'instagram'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CAPTION: ${{ inputs.caption != '' && inputs.caption || inputs.description }}
          VIDEO: ${{ inputs.video }}
          THUMB: ${{ inputs.thumbnail }}
        run: |
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/video-files"
          quote() { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$1"; }
          cover=""
          if [ -n "$THUMB" ]; then cover="$raw/$(quote "$THUMB")"; fi
          python3 publish/upload.py instagram "$raw/$(quote "$VIDEO")" --caption "$(printf '%b' "$CAPTION")" \
            --share-to-feed ${cover:+--cover-url "$cover"}
      - name: Instagram carousel
        if: inputs.platform == 'instagram-carousel'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CAPTION: ${{ inputs.caption != '' && inputs.caption || inputs.description }}
          FOLDER: ${{ inputs.video }}
        run: |
          git fetch --quiet --depth 1 origin video-files
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/video-files"
          mapfile -t urls < <(git -c core.quotePath=false ls-tree --name-only FETCH_HEAD "${FOLDER%/}/" | grep -iE '\.jpe?g$' | sort -V |
            python3 -c 'import sys,urllib.parse;[print(sys.argv[1]+"/"+urllib.parse.quote(l.strip())) for l in sys.stdin]' "$raw")
          printf '%s\n' "${urls[@]}"
          python3 publish/upload.py instagram-carousel "${urls[@]}" --caption "$(printf '%b' "$CAPTION")"
