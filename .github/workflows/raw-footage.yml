name: Raw footage

# (claude/voice-tts 브랜치 전용) 7편 대사를 내 목소리로 합성. file_id = 줄 번호들(쉼표, 비우면 전부는 'all'), name = 결과 폴더 이름
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "줄 번호 (예: 1,2,3 / all)"
        required: true
      name:
        description: "결과 폴더 이름"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get -qq -o DPkg::Lock::Timeout=120 install -y ffmpeg > /dev/null
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts faster-whisper
          pip list 2>/dev/null | grep -i -E "chatterbox|torch|whisper"
      - name: Generate
        env:
          ONLY: ${{ inputs.file_id != 'all' && inputs.file_id || '' }}
        run: python3 tts/gen.py
      - name: Save
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "tts/out/$NAME"; cp out/* "tts/out/$NAME/"
          git add --sparse "tts/out/$NAME"
          git commit -q -m "tts $NAME [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin claude/voice-tts && git push -q origin HEAD:claude/voice-tts && break; sleep 5; done
