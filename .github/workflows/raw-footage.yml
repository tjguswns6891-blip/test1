name: Raw footage

# (claude/narration-audio 브랜치 임시판) video-files 의 음성을 말 덩어리마다 따로 받아쓰기해서 NG 를 찾는다.
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "video-files 안 음성 경로"
        required: true
      name:
        description: "-"
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Chunk transcription
        env:
          SRC: ${{ inputs.file_id }}
        run: |
          git init -q v && cd v && git remote add origin "https://github.com/${GITHUB_REPOSITORY}" && git fetch -q --depth 1 origin video-files
          git show "FETCH_HEAD:$SRC" > ../a.wav && cd ..
          pip install --quiet faster-whisper "av<17" numpy
          python3 - <<'PY'
          import numpy as np, wave, json
          from faster_whisper import WhisperModel
          w=wave.open("a.wav");sr=w.getframerate();x=np.frombuffer(w.readframes(w.getnframes()),np.int16).astype(np.float32)/32768
          hop=int(sr*0.02);n=len(x)//hop
          db=np.array([20*np.log10(np.sqrt(np.mean(x[i*hop:(i+1)*hop]**2))+1e-9) for i in range(n)])
          sp=db>-55
          segs=[];i=0
          while i<n:
              if sp[i]:
                  j=i
                  while j<n and sp[j]: j+=1
                  segs.append([i*0.02,j*0.02]);i=j
              else: i+=1
          m=[segs[0]]
          for a,b in segs[1:]:
              if a-m[-1][1]<0.25: m[-1][1]=b
              else: m.append([a,b])
          m=[s for s in m if s[1]-s[0]>0.12]
          model=WhisperModel("medium",device="cpu",compute_type="int8")
          out=[]
          for a,b in m:
              seg=x[int(max(0,a-0.1)*sr):int((b+0.1)*sr)]
              r,_=model.transcribe(seg,language="ko",beam_size=5,condition_on_previous_text=False)
              t=" ".join(s.text.strip() for s in r)
              out.append({"start":a,"end":b,"text":t}); print(f"[{a:7.2f}~{b:7.2f}] {t}",flush=True)
          json.dump(out,open("chunks.json","w"),ensure_ascii=False)
          PY
