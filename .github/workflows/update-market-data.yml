name: Update market data

# Refreshes invest/data.json (SPY/QQQ/SCHD from Yahoo Finance, rates from FRED) for the /invest/ page.
on:
  schedule:
    - cron: "17 22 * * 1-5" # 22:17 UTC on US trading days, after the close (07:17 KST)
  workflow_dispatch:
  push:
    paths:
      - invest/update_data.py
      - .github/workflows/update-market-data.yml

permissions:
  contents: write

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        run: python3 invest/update_data.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add invest/data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update market data ($(date -u +%F))"
          git push
