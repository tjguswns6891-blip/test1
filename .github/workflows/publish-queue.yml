name: Publish queue

# 하루 3번(한국 시간 10시·13시·18시) video-files 브랜치의 queue.json에서 시간이 된 영상을 올린다.
# GitHub 예약 실행은 보통 20~80분 늦게 시작해서 30분 일찍(9:30·12:30·17:30) 걸어 두고,
# upload.py queue 는 1시간 안에 올릴 항목까지 올린다.
# 항목 형식과 규칙은 publish/README.md '업로드 대기열'.
# 18시 실행(과 수동 실행)에서는 성과 기록(stats/날짜.json)도 남긴다.
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 3 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: publish
      - name: Fetch video-files
        run: git fetch --quiet --depth 1 origin video-files
      - name: Upload due items
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 publish/upload.py queue
      - name: Record stats
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 publish/upload.py stats
