  s:[R_`메시 1: \(2i_1 + 4(i_1 - i_2) = 10\) → \(6i_1 - 4i_2 = 10\)`,R_`메시 2: \(4(i_2 - i_1) + 6i_2 = 0\) → \(-4i_1 + 10i_2 = 0\)`,R_`크라머 공식: \(\Delta = 60 - 16 = 44\), \(i_1 = 100/44 = 2.27\ \mathrm{A}\), \(i_2 = 40/44 = 0.909\ \mathrm{A}\)`],a:'i₁ = 2.27 A, i₂ = 0.909 A, 4 Ω 전류 = 1.36 A'}],
 mis:['초마디를 만들 때 KCL만 쓰고 전압원 조건 \\(v_a - v_b = V_s\\)를 빠뜨립니다.','공유 가지 전류를 \\(i_1 + i_2\\)로 씁니다. 두 메시를 모두 시계 방향으로 잡으면 \\(i_1 - i_2\\)입니다.','메시에 전류원이 있으면 그 메시 전류가 바로 정해진다는 점을 놓치고 식을 하나 더 씁니다.'],
 quiz:[{q:'마디가 N개인 회로에서 필요한 마디 방정식 수는?',o:['N','N − 1','N + 1','2N'],a:1,w:'기준 마디 하나를 뺀 N − 1개입니다.'},
  {q:'메시 저항 행렬의 비대각 성분은?',o:['메시 전체 저항의 합','공유 저항의 음수','0','전원 전압'],a:1,w:R_`예: \(-R_3\). 메시 전류 방향을 모두 같게 잡았을 때입니다.`},
  {q:'두 비기준 마디 사이에 전압원만 있을 때 쓰는 방법은?',o:['초메시','초마디','전원 변환','중첩'],a:1,w:'두 마디를 묶어 초마디로 KCL을 쓰고, 전압원 조건을 추가합니다.'}]},
ch4:{ex:[{t:'테브난 등가와 최대 전력',q:R_`\(V_s = 12\ \mathrm{V}\), \(R_1 = 100\ \Omega\), \(R_2 = 300\ \Omega\)인 분압기 단자에 부하를 연결합니다. 최대 전력은?`,
  s:[R_`\(V_{Th} = \dfrac{300}{400}\times12 = 9\ \mathrm{V}\), \(R_{Th} = 100 \parallel 300 = 75\ \Omega\)`,R_`\(R_L = 75\ \Omega\)일 때 \(P_{max} = \dfrac{9^2}{4\times75} = 0.27\ \mathrm{W}\)`],a:'R_L = 75 Ω에서 270 mW'},
  {t:'중첩의 원리',q:R_`10 V 전원 – 5 Ω – 마디 – 5 Ω – 접지 회로에서, 그 마디로 2 A 전류원이 전류를 넣습니다. 마디 전압은?`,
  s:[R_`전압원만: 전류원 개방 → 분압 \(10 \times 5/10 = 5\ \mathrm{V}\)`,R_`전류원만: 전압원 단락 → \(2 \times (5 \parallel 5) = 2 \times 2.5 = 5\ \mathrm{V}\)`,R_`합: \(5 + 5 = 10\ \mathrm{V}\)`],a:'10 V'}],
 mis:['전원을 끌 때 전류원을 단락시킵니다. 전압원은 단락, 전류원은 <b>개방</b>입니다.','종속 전원까지 끄고 \\(R_{Th}\\)를 구합니다. 종속 전원은 남겨 두고 시험 전원을 넣어야 합니다.','최대 전력 전달을 최대 효율로 오해합니다. 이때 효율은 50%입니다.'],
 quiz:[{q:'중첩에서 독립 전압원을 제거하는 방법은?',o:['개방','단락','그대로 둠','저항으로 대체'],a:1,w:'전압이 0인 전압원은 단락 회로입니다.'},
  {q:'V_Th = 10 V, R_Th = 5 Ω일 때 노턴 전류 I_N은?',o:['50 A','2 A','0.5 A','15 A'],a:1,w:R_`\(I_N = V_{Th}/R_{Th} = 2\ \mathrm{A}\)`},
  {q:'최대 전력이 전달될 때 효율은?',o:['100%','75%','50%','25%'],a:2,w:R_`\(R_L = R_{Th}\)이므로 전력이 반씩 나뉩니다.`}]},
ch5:{ex:[{t:'반전 증폭기',q:R_`\(R_1 = 10\ \mathrm{k\Omega}\), \(R_f = 47\ \mathrm{k\Omega}\), \(v_i = 0.5\ \mathrm{V}\)일 때 출력은?`,s:[R_`\(v_o = -\dfrac{47}{10}\times0.5 = -2.35\ \mathrm{V}\)`],a:'−2.35 V'},
  {t:'비반전 증폭기와 포화',q:R_`\(R_1 = 1\ \mathrm{k\Omega}\), \(R_f = 9\ \mathrm{k\Omega}\), 전원 \(\pm12\ \mathrm{V}\), \(v_i = 2\ \mathrm{V}\)이면?`,s:[R_`이득 \(1 + 9/1 = 10\) → 이상적으로 20 V`,R_`20 V는 12 V를 넘으므로 출력은 \(+12\ \mathrm{V}\)에서 포화합니다.`],a:'+12 V (포화)'},
  {t:'가산기',q:R_`\(R_1 = R_2 = R_f = 10\ \mathrm{k\Omega}\), \(v_1 = 1\ \mathrm{V}\), \(v_2 = 2\ \mathrm{V}\)인 반전 가산기의 출력은?`,s:[R_`\(v_o = -(v_1 + v_2) = -3\ \mathrm{V}\)`],a:'−3 V'}],
 mis:['양되먹임 회로(비교기)에도 \\(v_+ = v_-\\)를 적용합니다. 이 규칙은 음되먹임일 때만 성립합니다.','입력 전류가 0이므로 출력 전류도 0이라고 생각합니다. 출력 단자는 전류를 얼마든지 공급할 수 있습니다.','계산 결과가 전원 전압을 넘는데 그대로 답으로 씁니다.'],
 quiz:[{q:'비반전 증폭기에서 R₁ = 2 kΩ, R_f = 6 kΩ이면 이득은?',o:['3','4','−3','0.33'],a:1,w:'1 + 6/2 = 4'},
  {q:'반전 증폭기의 입력 저항은?',o:['0','무한대','R₁','R_f'],a:2,w:R_`\(v_-\)가 가상 접지이므로 입력에서 본 저항은 \(R_1\)입니다.`},
  {q:'이상 연산 증폭기의 입력 단자로 흐르는 전류는?',o:['0','출력 전류와 같음','R₁에 따라 다름','무한대'],a:0,w:'입력 저항이 무한대이므로 0입니다.'}]},
ch6:{ex:[{t:'정현파 전압과 커패시터 전류',q:R_`\(C = 100\ \mu\mathrm{F}\)에 \(v = 10\sin(100t)\ \mathrm{V}\)를 걸면 전류와 최대 에너지는?`,s:[R_`\(i = C\dfrac{dv}{dt} = 10^{-4}\times10\times100\cos(100t) = 0.1\cos(100t)\ \mathrm{A}\)`,R_`\(w_{max} = \tfrac12 CV_m^2 = \tfrac12\times10^{-4}\times100 = 5\ \mathrm{mJ}\)`],a:'i = 0.1 cos(100t) A, 5 mJ'},
  {t:'인덕터 전압',q:R_`\(L = 50\ \mathrm{mH}\)의 전류가 4 ms 동안 0에서 2 A로 일정하게 늘어납니다. 전압과 저장 에너지는?`,s:[R_`\(di/dt = 2/0.004 = 500\ \mathrm{A/s}\) → \(v = 0.05\times500 = 25\ \mathrm{V}\)`,R_`\(w = \tfrac12\times0.05\times2^2 = 0.1\ \mathrm{J}\)`],a:'25 V, 0.1 J'},
  {t:'커패시터 합성',q:R_`10 µF와 20 µF를 직렬로, 또 병렬로 연결하면?`,s:[R_`직렬: \(\dfrac{10\times20}{30} = 6.67\ \mu\mathrm{F}\)`,R_`병렬: \(10 + 20 = 30\ \mu\mathrm{F}\)`],a:'직렬 6.67 µF, 병렬 30 µF'}],
 mis:['커패시터를 저항처럼 직렬은 더하고 병렬은 역수로 합칩니다. 커패시터는 반대입니다.','직류 정상상태에서 커패시터는 개방, 인덕터는 단락이라는 점을 잊습니다.','커패시터 전류나 인덕터 전압도 연속이라고 생각합니다. 연속인 것은 \\(v_C\\)와 \\(i_L\\)뿐입니다.'],
 quiz:[{q:'직류 정상상태에서 인덕터는?',o:['개방','단락','저항 R','전류원'],a:1,w:'di/dt = 0이므로 v = 0, 단락입니다.'},
  {q:'커패시터 전압이 2배가 되면 저장 에너지는?',o:['같음','2배','4배','1/2'],a:2,w:'w = ½Cv²이므로 4배입니다.'},
  {q:'2 µF 두 개를 직렬로 연결하면?',o:['4 µF','2 µF','1 µF','0.5 µF'],a:2,w:'2·2/(2+2) = 1 µF'}]},
ch7:{sheet:[R_`\tau = RC,\quad \tau = \frac{L}{R}`,R_`x(t) = x(\infty) + [x(0) - x(\infty)]e^{-t/\tau}`],
 ex:[{t:'RC 충전 중간값',q:R_`\(R = 1\ \mathrm{k\Omega}\), \(C = 100\ \mu\mathrm{F}\), \(V_s = 10\ \mathrm{V}\), \(v_C(0) = 0\)일 때 \(t = 0.2\ \mathrm{s}\)의 \(v_C\)와 \(i\)는?`,s:[R_`\(\tau = 10^3\times10^{-4} = 0.1\ \mathrm{s}\), 즉 \(t = 2\tau\)`,R_`\(v_C = 10(1 - e^{-2}) = 8.65\ \mathrm{V}\), \(i = 10\ \mathrm{mA}\times e^{-2} = 1.35\ \mathrm{mA}\)`],a:'8.65 V, 1.35 mA'},
  {t:'RL 방전 시간',q:R_`\(i(0) = 2\ \mathrm{A}\), \(R = 10\ \Omega\), \(L = 0.5\ \mathrm{H}\)인 RL 회로에서 전류가 0.5 A가 되는 시간은?`,s:[R_`\(\tau = 0.5/10 = 0.05\ \mathrm{s}\), \(i = 2e^{-t/0.05}\)`,R_`\(0.5 = 2e^{-t/\tau}\) → \(t = \tau\ln4 = 0.05\times1.386 = 69.3\ \mathrm{ms}\)`],a:'69.3 ms'}],
 mis:['τ를 구할 때 아무 저항이나 씁니다. C나 L 단자에서 본 테브난 등가 저항을 써야 합니다.','저항 전류처럼 연속이 아닌 양을 초기값으로 그대로 옮깁니다.','µF, mH 단위를 SI로 바꾸지 않고 계산합니다.'],
 quiz:[{q:'t = τ일 때 충전 정도는?',o:['50%','63.2%','86.5%','99.3%'],a:1,w:R_`\(1 - e^{-1} = 0.632\)`},
  {q:'L = 2 H, R = 4 Ω인 RL 회로의 시정수는?',o:['8 s','2 s','0.5 s','0.25 s'],a:2,w:'τ = L/R = 0.5 s'},
  {q:'전압 0인 커패시터에 스위치를 넣은 직후, 커패시터는 어떻게 보입니까?',o:['개방','단락','전압원 V_s','전류원'],a:1,w:'전압이 순간적으로 바뀔 수 없으므로 0 V를 유지하는 단락처럼 보입니다.'}]},
ch8:{ex:[{t:'감쇠 유형 판정',q:R_`직렬 RLC에서 \(R = 15\ \Omega\), \(L = 10\ \mathrm{mH}\), \(C = 10\ \mu\mathrm{F}\)이면?`,s:[R_`\(\alpha = \dfrac{15}{0.02} = 750\ \mathrm{s^{-1}}\), \(\omega_0 = \dfrac{1}{\sqrt{10^{-7}}} = 3162\ \mathrm{rad/s}\)`,R_`\(\alpha < \omega_0\)이므로 부족 감쇠. \(\omega_d = \sqrt{3162^2 - 750^2} = 3072\ \mathrm{rad/s}\)`],a:'부족 감쇠, 극점 −750 ± j3072'},
  {t:'임계 감쇠 저항',q:'같은 L, C에서 임계 감쇠가 되는 R은?',s:[R_`\(\alpha = \omega_0\) → \(R = 2\sqrt{L/C} = 2\sqrt{1000} = 63.2\ \Omega\)`],a:'63.2 Ω'},
  {t:'병렬 RLC',q:R_`병렬 RLC에서 \(R = 50\ \Omega\), \(L = 10\ \mathrm{mH}\), \(C = 10\ \mu\mathrm{F}\)이면?`,s:[R_`병렬은 \(\alpha = \dfrac{1}{2RC} = \dfrac{1}{2\times50\times10^{-5}} = 1000\ \mathrm{s^{-1}}\)`,R_`\(\omega_0 = 3162\)로 같으므로 부족 감쇠입니다.`],a:'부족 감쇠 (α = 1000)'}],
 mis:['직렬(\\(\\alpha = R/2L\\))과 병렬(\\(\\alpha = 1/2RC\\))의 α를 바꿔 씁니다. 병렬에서는 R이 클수록 감쇠가 약해집니다.','초기 조건을 하나만 씁니다. 2차 회로는 \\(v(0)\\)와 \\(dv/dt(0) = i_C(0)/C\\) 두 개가 필요합니다.','\\(\\omega_d\\)와 \\(\\omega_0\\)를 혼동합니다. 진동 주파수는 \\(\\omega_d\\)입니다.'],
 quiz:[{q:'α > ω₀이면?',o:['부족 감쇠','임계 감쇠','과감쇠','무감쇠 진동'],a:2,w:'두 극점이 서로 다른 음의 실수입니다.'},
  {q:'부족 감쇠 회로의 극점은?',o:['두 음의 실수','중근','켤레 복소수','0'],a:2,w:R_`\(-\alpha \pm j\omega_d\)`},
  {q:'직렬 RLC에서 R을 키우면 감쇠비 ζ는?',o:['커짐','작아짐','변하지 않음','0이 됨'],a:0,w:R_`\(\zeta = \alpha/\omega_0 = \dfrac{R}{2}\sqrt{C/L}\)`}]},
ch9:{sheet:[R_`v = V_m\cos(\omega t + \phi) \leftrightarrow \mathbf V = V_m\angle\phi`,R_`\mathbf Z_R = R,\quad \mathbf Z_L = j\omega L,\quad \mathbf Z_C = \frac{1}{j\omega C}`,R_`\omega_0 = \frac{1}{\sqrt{LC}}`],
 ex:[{t:'위상차 구하기',q:R_`\(v = 10\cos(100t + 30^\circ)\), \(i = 2\sin(100t + 10^\circ)\)일 때 위상 관계는?`,s:[R_`사인을 코사인으로: \(\sin x = \cos(x - 90^\circ)\) → \(i = 2\cos(100t - 80^\circ)\)`,R_`위상차 \(30^\circ - (-80^\circ) = 110^\circ\)`],a:'전압이 전류보다 110° 앞섭니다.'},
  {t:'직렬 RLC 임피던스',q:R_`\(R = 100\ \Omega\), \(L = 30\ \mathrm{mH}\), \(C = 2\ \mu\mathrm{F}\), \(f = 800\ \mathrm{Hz}\)일 때 \(\mathbf Z\)는?`,s:[R_`\(\omega = 5027\ \mathrm{rad/s}\), \(X_L = 150.8\ \Omega\), \(X_C = 99.5\ \Omega\)`,R_`\(\mathbf Z = 100 + j51.3 = 112.4\angle27.2^\circ\ \Omega\)`],a:'112 Ω ∠ 27.2° (유도성). 시각화 9-2의 기본값과 같습니다.'},
  {t:'페이저 덧셈',q:R_`\(5\cos\omega t + 5\sin\omega t\)를 하나의 코사인으로?`,s:[R_`페이저: \(5\angle0^\circ + 5\angle{-90^\circ} = 5 - j5\)`,R_`\(= 7.07\angle{-45^\circ}\)`],a:R_`\(7.07\cos(\omega t - 45^\circ)\)`}],
 mis:['사인 함수를 코사인으로 바꾸지 않고 페이저 각도를 그대로 씁니다.','계산기를 라디안 모드로 둔 채 도 단위를 넣습니다.','\\(1/(j\\omega C)\\)를 \\(+j/(\\omega C)\\)로 씁니다. \\(1/j = -j\\)입니다.'],
 quiz:[{q:'10 cos(ωt − 60°)의 페이저는?',o:['10∠60°','10∠−60°','10∠30°','7.07∠−60°'],a:1,w:'코사인 기준이므로 크기 10, 위상 −60°'},
  {q:'ω = 1000 rad/s에서 L = 10 mH의 임피던스는?',o:['j10 Ω','−j10 Ω','10 Ω','j0.1 Ω'],a:0,w:'jωL = j1000·0.01 = j10 Ω'},
  {q:'순수 커패시터에서 전류는 전압보다?',o:['90° 앞섬','90° 뒤짐','같은 위상','180° 반대'],a:0,w:'ICE: 커패시터에서는 I가 E보다 먼저'}]},
ch10:{ex:[{t:'교류 마디 해석',q:R_`\(\mathbf V_s = 10\angle0^\circ\), 직렬 \(R = 10\ \Omega\) 뒤 마디에 \(j10\ \Omega\)(L)과 \(-j20\ \Omega\)(C)가 병렬입니다. 마디 전압과 각 전류는?`,
  s:[R_`\(\mathbf Z_p = \dfrac{(j10)(-j20)}{j10 - j20} = \dfrac{200}{-j10} = j20\ \Omega\)`,R_`\(\mathbf V = 10\cdot\dfrac{j20}{10 + j20} = 8 + j4 = 8.94\angle26.6^\circ\ \mathrm V\)`,R_`\(\mathbf I_R = (10 - 8 - j4)/10 = 0.2 - j0.4\), \(\mathbf I_L = \mathbf V/j10 = 0.4 - j0.8\), \(\mathbf I_C = \mathbf V/(-j20) = -0.2 + j0.4\)`,R_`KCL 확인: \(\mathbf I_L + \mathbf I_C = 0.2 - j0.4 = \mathbf I_R\)`],a:'V = 8.94∠26.6° V, I_R = 0.447∠−63.4° A'},
  {t:'교류 테브난 등가와 최대 전력',q:R_`\(10\angle0^\circ\) V 전원 – 3 Ω – 단자, 단자와 접지 사이 \(j4\ \Omega\). 테브난 등가와 최대 전력 부하는?`,
  s:[R_`\(\mathbf V_{Th} = 10\dfrac{j4}{3 + j4} = 6.4 + j4.8 = 8\angle36.9^\circ\)`,R_`\(\mathbf Z_{Th} = 3 \parallel j4 = 1.92 + j1.44\ \Omega\)`,R_`최대 평균 전력 부하: \(\mathbf Z_L = \mathbf Z_{Th}^* = 1.92 - j1.44\ \Omega\)`],a:'Z_L = 1.92 − j1.44 Ω'}],
 mis:['주파수가 다른 두 전원의 페이저를 더합니다. 시간 영역으로 바꾼 뒤 더해야 합니다.','교류 최대 전력 조건을 \\(\\mathbf Z_L = \\mathbf Z_{Th}\\)로 씁니다. 켤레 \\(\\mathbf Z_{Th}^*\\)입니다.','복소수 나눗셈에서 분모의 켤레를 곱하지 않고 실수부끼리, 허수부끼리 나눕니다.'],

 ['페이저','phasor','정현파의 크기와 위상을 나타내는 복소수 V_m∠φ.','ch9'],['임피던스','impedance','페이저 전압과 전류의 비 Z = V/I. 단위 Ω.','ch9'],['리액턴스','reactance','임피던스의 허수부 X. 인덕터 ωL, 커패시터 −1/ωC.','ch9'],['어드미턴스','admittance','임피던스의 역수 Y = 1/Z. 단위 S.','ch9'],['공진','resonance','리액턴스가 상쇄되어 임피던스가 순수 저항이 되는 상태.','ch9'],
 ['실효값','RMS value','같은 평균 전력을 내는 직류값. 정현파는 V_m/√2.','ch11'],['역률','power factor','pf = cos θ = P/|S|.','ch11'],['복소 전력','complex power','S = V_rms I_rms* = P + jQ.','ch11'],['무효 전력','reactive power','L, C와 전원 사이를 오가는 전력 Q. 단위 VAR.','ch11'],
 ['상전압','phase voltage','각 상 소자 양단의 전압.','ch12'],['선간 전압','line voltage','두 선 사이의 전압. Y 결선에서 √3 V_p.','ch12'],['상순','phase sequence','세 상 전압이 최댓값에 이르는 순서(abc 또는 acb).','ch12'],
 ['상호 인덕턴스','mutual inductance','한 코일 전류가 다른 코일에 유도하는 전압의 비례 상수 M.','ch13'],['결합 계수','coupling coefficient','k = M/√(L₁L₂).','ch13'],['권선비','turns ratio','n = N₂/N₁.','ch13'],
 ['전달함수','transfer function','출력 페이저(또는 변환)와 입력의 비 H.','ch14'],['보드 선도','Bode plot','|H|(dB)와 ∠H를 로그 주파수 축에 그린 그림.','ch14'],['차단 주파수','cutoff frequency','|H|가 최댓값의 1/√2(−3 dB)가 되는 주파수.','ch14'],['선택도','quality factor','Q = ω₀/B. 공진의 날카로움.','ch14'],
 ['극점','pole','전달함수 분모가 0이 되는 s. 응답의 지수와 진동을 정함.','ch15'],['영점','zero','전달함수 분자가 0이 되는 s.','ch15'],
 ['고조파','harmonic','기본 주파수의 정수배 주파수 성분.','ch16'],['깁스 현상','Gibbs phenomenon','불연속점 근처에서 부분합이 약 9% 튀어 오르는 현상.','ch16'],
 ['2포트 회로','two-port network','입력과 출력 단자쌍을 하나씩 가진 회로.','ch17'],['상반성','reciprocity','z₁₂ = z₂₁처럼 입력과 출력을 바꿔도 전달 관계가 같은 성질.','ch17']
];

/* 진도 저장 (이 브라우저에만) */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let DONE=store.get('circ-done',[]),QUIZ=store.get('circ-quiz',{});

function extrasHTML(id){const x=EXTRA[id];if(!x)return'';let h='';
  if(x.ex){h+='<h2>예제</h2>';x.ex.forEach((e,i)=>{h+=`<div class="ex"><div class="ex-head"><span class="eyebrow">예제 ${CHAPTERS.find(c=>c.id===id).n}-${i+1}</span><b>${e.t}</b></div><p>${e.q}</p>
    <details><summary>풀이 보기</summary><ol class="steps">${e.s.map(s=>`<li>${s}</li>`).join('')}</ol><p class="ans"><span class="eyebrow">답</span> ${e.a}</p></details></div>`;});}
  if(x.mis){h+='<h2>자주 하는 실수</h2><ul class="mis">'+x.mis.map(m=>`<li>${m}</li>`).join('')+'</ul>';}
  if(x.quiz){h+='<h2>확인 문제</h2><div class="quizbox">';x.quiz.forEach((q,i)=>{const key=id+'-'+i,prev=QUIZ[key];
    h+=`<div class="quiz" data-key="${key}" data-a="${q.a}"><p class="qq"><b>${i+1}.</b> ${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt${prev!==undefined?(j===q.a?' ok':j===prev?' no':''):''}" data-i="${j}" ${prev!==undefined?'disabled':''}>${o}</button>`).join('')}</div><p class="why" ${prev===undefined?'hidden':''}>${q.w}</p></div>`;});
    h+=`</div><p class="qscore" data-ch="${id}"></p>`;}
  const d=DONE.includes(id);h+=`<div class="donebar"><button class="btn ${d?'':'primary'}" data-done="${id}">${d?'✓ 학습 완료 (취소하려면 누르기)':'이 장 학습 완료로 표시'}</button><span class="eyebrow">진도는 이 브라우저에만 저장됩니다</span></div>`;
  return h;}
function quizScore(id){const x=EXTRA[id];if(!x||!x.quiz)return'';let a=0,c=0;x.quiz.forEach((q,i)=>{const v=QUIZ[id+'-'+i];if(v!==undefined){a++;if(v===q.a)c++;}});return a?`확인 문제 ${x.quiz.length}개 중 ${a}개 풀이, ${c}개 정답`:'';}
function wireExtras(el,id){
  el.querySelectorAll('.quiz').forEach(qz=>{const a=+qz.dataset.a,key=qz.dataset.key;qz.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;QUIZ[key]=i;store.set('circ-quiz',QUIZ);
    qz.querySelectorAll('.opt').forEach(o=>{o.disabled=true;const j=+o.dataset.i;if(j===a)o.classList.add('ok');else if(j===i)o.classList.add('no');});qz.querySelector('.why').hidden=false;
    const sc=el.querySelector('.qscore');if(sc)sc.textContent=quizScore(id);typeset(qz);}));});
  const sc=el.querySelector('.qscore');if(sc)sc.textContent=quizScore(id);
  const rb=document.createElement('button');rb.className='btn';rb.textContent='확인 문제 다시 풀기';rb.style.marginLeft='8px';
  if(sc&&EXTRA[id].quiz){sc.after(rb);rb.addEventListener('click',()=>{EXTRA[id].quiz.forEach((q,i)=>delete QUIZ[id+'-'+i]);store.set('circ-quiz',QUIZ);route();});}
  const db=el.querySelector('[data-done]');if(db)db.addEventListener('click',()=>{DONE=DONE.includes(id)?DONE.filter(x=>x!==id):[...DONE,id];store.set('circ-done',DONE);
    const d=DONE.includes(id);db.className='btn '+(d?'':'primary');db.textContent=d?'✓ 학습 완료 (취소하려면 누르기)':'이 장 학습 완료로 표시';buildNav(location.hash.slice(1)||'home');});
}
function formulasHTML(){let h='<div class="wrap"><div class="eyebrow">요약</div><h1>공식 모음</h1><p class="lede">17개 장의 핵심 공식을 한 페이지에 모았습니다. 장 이름을 누르면 해당 장으로 이동합니다.</p>';
  for(const k of Object.keys(PARTS)){h+=`<h2>${PARTS[k]}</h2><div class="fgrid">`;
    for(const ch of CHAPTERS.filter(c=>c.part===k)){const eqs=(EXTRA[ch.id]&&EXTRA[ch.id].sheet)||ch.eqs||[];
      h+=`<div class="fcard"><a href="#${ch.id}"><span class="n">${ch.n}장</span> ${ch.title}</a>${eqs.map(e=>`<div class="math">\\[ ${e} \\]</div>`).join('')}</div>`;}h+='</div>';}
  return h+'</div>';}
function glossaryHTML(){return`<div class="wrap"><div class="eyebrow">찾아보기</div><h1>용어 사전</h1><p class="lede">회로이론의 주요 용어 ${GLOSSARY.length}개입니다. 영어 이름으로도 찾을 수 있습니다.</p>
  <label for="gq" class="eyebrow">용어 검색</label><input id="gq" class="search" type="search" placeholder="예: 임피던스, phasor, 역률">
  <dl class="gloss">${GLOSSARY.map(([k,e,d,c])=>`<div class="gi" data-s="${(k+' '+e+' '+d).toLowerCase()}"><dt>${k} <span class="en">${e}</span></dt><dd>${d} <a href="#${c}">${CHAPTERS.find(x=>x.id===c).n}장 →</a></dd></div>`).join('')}</dl><p id="gnone" hidden>찾는 용어가 없습니다. 다른 표현으로 검색해 보세요.</p></div>`;}

/* ───────── 라우팅 ───────── */
const main=document.getElementById('main'),nav=document.getElementById('nav'),side=document.getElementById('side'),navbtn=document.getElementById('navbtn');
let active=[];
function buildNav(){let h=`<ol class="tools-nav"><li data-s="공식 모음 formula"><a class="ch" href="#formulas" data-id="formulas"><span class="n">∑</span><span>공식 모음</span><span></span></a></li><li data-s="용어 사전 glossary"><a class="ch" href="#glossary" data-id="glossary"><span class="n">Aa</span><span>용어 사전</span><span></span></a></li></ol>`,p='';
  for(const ch of CHAPTERS){if(ch.part!==p){if(p)h+='</ol>';p=ch.part;h+=`<div class="part">${PARTS[p]}</div><ol>`;}
  const sx=(ch.title+' '+ch.sub+' '+(ch.topics||[]).join(' ')+' '+GLOSSARY.filter(g=>g[3]===ch.id).map(g=>g[0]+' '+g[1]).join(' ')).toLowerCase();
  h+=`<li data-s="${sx}"><a class="ch" href="#${ch.id}" data-id="${ch.id}"><span class="n">${String(ch.n).padStart(2,'0')}</span><span>${ch.title}</span>${DONE.includes(ch.id)?'<span class="chk" title="학습 완료">✓</span>':'<span></span>'}</a></li>`;}
  nav.innerHTML=h+'</ol>';markNav();filterNav();}
function markNav(){const id=location.hash.slice(1)||'home';nav.querySelectorAll('a.ch').forEach(a=>a.setAttribute('aria-current',a.dataset.id===id?'page':'false'));}
function filterNav(){const q=(document.getElementById('navq').value||'').trim().toLowerCase();let any=false;
  nav.querySelectorAll('li').forEach(li=>{const ok=!q||li.dataset.s.includes(q);li.hidden=!ok;if(ok)any=true;});
  nav.querySelectorAll('.part').forEach(d=>{const ol=d.nextElementSibling;d.hidden=!!q&&![...ol.children].some(li=>!li.hidden);});
  document.getElementById('navnone').hidden=any;}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function homeHTML(){
  let cards='';for(const k of Object.keys(PARTS)){cards+=`<h2>${PARTS[k]}</h2><div class="chgrid">`;
    for(const ch of CHAPTERS.filter(c=>c.part===k))cards+=`<a class="chcard" href="#${ch.id}"><span class="n">${ch.n}장</span><b>${ch.title}</b><span>${ch.sub}</span><span class="tag">${DONE.includes(ch.id)?'✓ 학습 완료':(EXTRA[ch.id]?.ex?.length||0)+'개 예제 · '+(EXTRA[ch.id]?.quiz?.length||0)+'개 확인 문제'}</span></a>`;cards+='</div>';}
  return`<div class="wrap"><div class="eyebrow">대학 회로이론 · 시각화 교재</div><h1>전압이 도선을 타고 흐르는 모습을 직접 보면서 배우는 회로이론</h1>
  <p class="lede">챕터마다 개념 설명, 핵심 수식, 직접 값을 넣어 보는 회로 애니메이션이 있습니다. 목차는 대표 교재인 Alexander·Sadiku 『Fundamentals of Electric Circuits』의 순서를 따랐고, Hayt『Engineering Circuit Analysis』, Nilsson『Electric Circuits』도 거의 같은 흐름입니다.</p>
  <canvas class="hero-canvas" id="hero" style="height:140px" aria-label="도선을 따라 이동하는 코사인 전압 파형과 전류 입자"></canvas>
  <p style="font-size:14px;color:var(--muted)">모든 그림에서 <b style="color:var(--volt)">파란색은 전압</b>, <b style="color:var(--amp)">주황색은 전류</b>입니다. 17개 장 모두에 값을 바꿔 볼 수 있는 시각화가 들어 있습니다.</p>
  <p class="views" data-views hidden></p>
  <div class="progress"><div class="pbar"><i style="width:${DONE.length/CHAPTERS.length*100}%"></i></div><span>${DONE.length} / ${CHAPTERS.length}장 학습 완료${DONE.length?'':' · 각 장 끝의 버튼으로 표시할 수 있습니다'}</span></div>
  <p style="font-size:14px;color:var(--muted)">요약이 필요하면 <a href="#formulas">공식 모음</a>, 낯선 용어는 <a href="#glossary">용어 사전</a>을 보세요. 키보드 ← → 로 앞뒤 장을 넘길 수 있습니다.</p>
  ${cards}</div>`;}
function chapterHTML(ch){
  return`<div class="wrap"><div class="eyebrow">${ch.n}장 · ${PARTS[ch.part].slice(3)}</div><h1>${ch.title} <span class="status">시각화 준비 중</span></h1><p class="lede">${ch.sub}</p>
  <h2>학습할 내용</h2><ul class="topics">${ch.topics.map(t=>`<li>${t}</li>`).join('')}</ul>
  <h2>핵심 수식</h2>${ch.eqs.map(e=>`<div class="math">\\[ ${esc(e)} \\]</div>`).join('')}
  <h2>계획된 시각화</h2><div class="plan">${ch.viz}</div></div>`;}
function pager(i){const p=CHAPTERS[i-1],n=CHAPTERS[i+1];return`<div class="wrap"><div class="pager">${p?`<a href="#${p.id}"><small>← 이전</small>${p.n}장 ${p.title}</a>`:'<a href="#home"><small>←</small>처음으로</a>'}${n?`<a href="#${n.id}" style="text-align:right;margin-left:auto"><small>다음 →</small>${n.n}장 ${n.title}</a>`:''}</div></div>`;}
function typeset(el){const M=window.MathJax;if(M&&M.typesetPromise&&el){try{M.typesetClear&&M.typesetClear([el]);}catch(e){}M.typesetPromise([el]).catch(()=>{});}}
function route(){
  const id=location.hash.slice(1)||'home',i=CHAPTERS.findIndex(c=>c.id===id),ch=CHAPTERS[i];active=[];
  if(id==='formulas')main.innerHTML=formulasHTML();
  else if(id==='glossary'){main.innerHTML=glossaryHTML();const gq=document.getElementById('gq');gq.addEventListener('input',()=>{const q=gq.value.trim().toLowerCase();let n=0;main.querySelectorAll('.gi').forEach(g=>{const ok=!q||g.dataset.s.includes(q);g.hidden=!ok;if(ok)n++;});document.getElementById('gnone').hidden=n>0;});}
  else if(!ch){main.innerHTML=homeHTML();const hc=document.getElementById('hero');if(hc)active.push(initHero(hc));}
  else{main.innerHTML='';if(ch.ready)main.appendChild(document.getElementById('tpl-'+ch.id).content.cloneNode(true));else main.innerHTML=chapterHTML(ch);
    const wr=main.querySelector('.wrap');wr.insertAdjacentHTML('beforeend',extrasHTML(ch.id));wireExtras(wr,ch.id);main.insertAdjacentHTML('beforeend',pager(i));}
  main.querySelectorAll('[data-demo]').forEach(el=>{try{active.push(DEMOS[el.dataset.demo](el));}catch(e){console.error(e);}});
  markNav();
  side.classList.remove('open');navbtn.setAttribute('aria-expanded','false');window.scrollTo(0,0);renderViews();typeset(main);
}
navbtn.addEventListener('click',()=>{const o=side.classList.toggle('open');navbtn.setAttribute('aria-expanded',String(o));});
document.getElementById('navclose').addEventListener('click',()=>{side.classList.remove('open');navbtn.setAttribute('aria-expanded','false');});
window.addEventListener('hashchange',route);
document.getElementById('navq').addEventListener('input',filterNav);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;const i=CHAPTERS.findIndex(c=>c.id===(location.hash.slice(1)||'home'));
  if(e.key==='ArrowRight'){const n=i<0?CHAPTERS[0]:CHAPTERS[i+1];if(n)location.hash=n.id;}else if(e.key==='ArrowLeft'&&i>=0){location.hash=i>0?CHAPTERS[i-1].id:'home';}});
/* 조회수: 외부 카운터(abacus)를 부를 수 있는 곳(GitHub Pages)에서만 표시. 같은 브라우저 탭 세션에서는 하루 한 번만 셉니다. */
let VIEWS=null;
function renderViews(){if(!VIEWS)return;const f=n=>n.toLocaleString('ko-KR');document.querySelectorAll('[data-views]').forEach(el=>{el.innerHTML=`<span><i class="vdot"></i>오늘 <b>${f(VIEWS.d)}</b></span><span>누적 <b>${f(VIEWS.t)}</b></span>`;el.hidden=false;});}
(function(){const NS='tjguswns6891-test1',base='https://abacus.jasoncameron.dev';
  const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replace(/-/g,'');
  let seen=false;try{seen=sessionStorage.getItem('circ-seen')===day;sessionStorage.setItem('circ-seen',day);}catch(e){}
  const verb=seen?'get':'hit';
  const one=k=>fetch(base+'/'+verb+'/'+NS+'/'+k).then(r=>{if(r.ok)return r.json();if(r.status===404)return{value:0};throw new Error(String(r.status));}).then(j=>Number(j.value)||0);
  try{Promise.all([one('circuit-day-'+day),one('circuit-total')]).then(([d,t])=>{VIEWS={d,t};renderViews();}).catch(()=>{});}catch(e){}
})();
buildNav();readTokens();route();
let prev=performance.now();
function loop(now){const dt=Math.min(0.05,(now-prev)/1000);prev=now;readTokens();for(const d of active){try{d.frame(dt);}catch(e){console.error(e);}}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
