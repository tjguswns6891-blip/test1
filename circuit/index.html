<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보이는 회로이론</title>
<meta name="description" content="대학 회로이론을 챕터별 설명, 수식, 인터랙티브 회로 애니메이션으로 배우는 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* 레이아웃: 왼쪽 고정 목차(교재 목차) + 오른쪽 본문. 본문 안에 실험대처럼 생긴 시각화 패널이 끼어든다. */
:root{
  --bg:#edf0f3; --panel:#ffffff; --ink:#17202b; --muted:#5a6575; --rule:#d3d9e1; --grid:#e4e8ee;
  --volt:#2454c4; --volt-soft:rgba(36,84,196,.13);
  --amp:#c25e14; --amp-soft:rgba(194,94,20,.15);
  --low:#a3adbb; --c-l:#17836a; --c-c:#8443bd; --c-r:#4c5868;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218; --panel:#141b24; --ink:#e3e8ef; --muted:#97a2b1; --rule:#283241; --grid:#1c2530;
    --volt:#6e9bff; --volt-soft:rgba(110,155,255,.17);
    --amp:#f0934b; --amp-soft:rgba(240,147,75,.17);
    --low:#465264; --c-l:#4cc79f; --c-c:#bd8df0; --c-r:#a9b4c3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#141b24; --ink:#e3e8ef; --muted:#97a2b1; --rule:#283241; --grid:#1c2530;
  --volt:#6e9bff; --volt-soft:rgba(110,155,255,.17);
  --amp:#f0934b; --amp-soft:rgba(240,147,75,.17);
  --low:#465264; --c-l:#4cc79f; --c-c:#bd8df0; --c-r:#a9b4c3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0}
a{color:var(--volt)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--rule);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:20px 14px 40px}
.brand{display:block;text-decoration:none;color:var(--ink);padding:4px 8px 16px}
.brand b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.brand .sig{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.sig i{display:inline-block;width:18px;height:3px;border-radius:2px}
.part{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:18px 8px 6px;font-weight:600}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.side a.ch{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:baseline;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.4}
.side a.ch:hover{background:var(--grid)}
.side a.ch[aria-current="page"]{background:var(--volt-soft);color:var(--volt);font-weight:600}
.side a.ch .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amp);align-self:center}
.topbar{display:none}
main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:32px 80px}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:clamp(26px,4vw,34px);line-height:1.25;letter-spacing:-.02em;margin:4px 0 8px;text-wrap:balance}
h2{font-size:21px;line-height:1.35;margin:44px 0 10px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;margin:24px 0 6px}
p,li{max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.lede{color:var(--muted);font-size:17px}
.math{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.note{border-left:3px solid var(--amp);background:var(--amp-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:16px 0;font-size:15px}
.note.v{border-color:var(--volt);background:var(--volt-soft)}
table.t{border-collapse:collapse;font-size:14.5px;margin:10px 0}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:6px 14px 6px 0;text-align:left;vertical-align:middle}
table.t th{font-weight:600;color:var(--muted);font-size:13px}
.tscroll{overflow-x:auto}

/* 실험대 패널 */
.lab{background:var(--panel);border:1px solid var(--rule);border-radius:10px;margin:22px 0 28px;overflow:hidden}
.lab-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--rule)}
.lab-head h3{margin:0;font-size:15px}
.lab-head .eyebrow{display:block;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:7px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--volt);color:#fff;border-color:var(--volt)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{display:block;width:100%;background:var(--panel)}
.stage-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}
.stage-grid>div{min-width:0}
.stage-grid>div+div{border-left:1px solid var(--rule)}
.cap{font-size:12.5px;color:var(--muted);padding:6px 14px 0}
.lab-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);border-top:1px solid var(--rule)}
.lab-body>div{padding:14px 16px;min-width:0}
.lab-body>div+div{border-left:1px solid var(--rule)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;margin-bottom:10px}
.ctl label{font-size:13.5px;grid-column:1/-1}
.ctl input[type=range]{width:100%;accent-color:var(--volt)}
.ctl .num{display:inline-flex;align-items:center;gap:4px}
.ctl input[type=number]{width:84px;font-family:var(--f-mono);font-size:13px;padding:3px 6px;border:1px solid var(--rule);border-radius:5px;background:var(--bg);color:var(--ink)}
.ctl .unit{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:24px}
.readout{font-family:var(--f-mono);font-size:13px;line-height:1.75;font-variant-numeric:tabular-nums}
.readout .row{display:block;overflow-wrap:anywhere}
.readout .k{color:var(--muted)}
.readout b{font-weight:500;color:var(--ink)}
.readout .vv{color:var(--volt)}
.readout .ii{color:var(--amp)}
.pill{display:inline-block;font-family:var(--f-body);font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid currentColor;margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);padding:8px 16px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.balance{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.bal-col{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--muted);text-align:center}
.bal-bar{width:64px;height:130px;display:flex;flex-direction:column;border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.bal-bar .s{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11.5px;color:#fff;min-height:0;overflow:hidden}
.bal-eq{font-family:var(--f-mono);font-size:22px;color:var(--muted);align-self:center;padding-bottom:22px}

/* 홈 */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0 8px}
.chcard{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);text-decoration:none;color:var(--ink)}
.chcard:hover{border-color:var(--volt)}
.chcard .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chcard b{font-size:15.5px}
.chcard span{font-size:13px;color:var(--muted);line-height:1.5}
.chcard .tag{font-size:11.5px;color:var(--amp);font-weight:600}
.hero-canvas{display:block;width:100%;border-radius:10px;border:1px solid var(--rule);background:var(--panel);margin:18px 0 6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;border-top:1px solid var(--rule);padding-top:16px;flex-wrap:wrap}
.pager a{text-decoration:none;font-size:14px;max-width:48%}
.pager small{display:block;color:var(--muted);font-size:12px}
.plan{border:1px dashed var(--rule);border-radius:8px;padding:12px 16px;background:var(--panel)}
ul.topics{padding-left:20px}
.status{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--grid);color:var(--muted);margin-left:4px;vertical-align:middle}

/* 예제·문제·도구 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--bg);color:var(--ink);margin:4px 0 6px}
.side .search{margin:0 0 4px}
.tools-nav{margin-bottom:4px!important}
.chk{color:var(--c-l);font-weight:700;font-size:13px}
.ex{border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:12px 16px;margin:12px 0}
.ex-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ex p{margin:6px 0}
.ex details summary{cursor:pointer;color:var(--volt);font-size:14px;font-weight:600;padding:4px 0}
.steps{padding-left:22px;margin:6px 0}.steps li{margin:4px 0}
.ans{border-top:1px dashed var(--rule);padding-top:8px}
ul.mis{padding-left:20px}ul.mis li{margin:6px 0}ul.mis li::marker{color:var(--amp)}
.quizbox{display:grid;gap:12px}
.quiz{border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:12px 16px}
.qq{margin:0 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.opt{border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:7px 10px;text-align:left;cursor:pointer;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--volt)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--c-l);background:var(--panel);color:var(--c-l);font-weight:600}
.opt.ok::before{content:"✓ "}
.opt.no{border-color:var(--amp);color:var(--amp)}
.opt.no::before{content:"✗ "}
.why{margin:8px 0 0;font-size:14px;color:var(--muted)}
.qscore{font-size:13px;color:var(--muted);display:inline-block;margin:10px 0 0}
.donebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:28px}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0;font-size:13.5px;color:var(--muted)}
.pbar{flex:1 1 200px;max-width:320px;height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c-l)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.fcard{border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:10px 14px;min-width:0}
.fcard a{text-decoration:none;font-weight:600;font-size:14.5px}
.fcard .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.fcard .math{font-size:14px}
.gloss{display:grid;gap:0;margin-top:12px}
.gi{border-bottom:1px solid var(--rule);padding:10px 0}
.gi dt{font-weight:600}.gi .en{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.gi dd{margin:2px 0 0;font-size:14.5px}.gi dd a{font-size:13px;margin-left:4px}
.views{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}
.side .views{padding:0 8px 10px}
.views b{color:var(--ink);font-weight:500}
.vdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c-l);margin-right:6px;vertical-align:middle}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none;position:fixed;inset:0;z-index:20;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{display:block}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 16px}
  .topbar b{font-size:16px}
  .closenav{display:inline-block!important;margin:0 8px 8px}
}
.closenav{display:none}
@media (max-width:680px){
  .lab-body{grid-template-columns:1fr}
  .lab-body>div+div{border-left:0;border-top:1px solid var(--rule)}
  .stage-grid{grid-template-columns:1fr}
  .stage-grid>div+div{border-left:0;border-top:1px solid var(--rule)}
}
</style>

<template id="tpl-ch2">
<div class="wrap">
  <div class="eyebrow">2장 · 직류 회로</div>
  <h1>기본 법칙: 옴의 법칙, KVL, KCL</h1>
  <p class="lede">회로 해석의 모든 방법은 결국 세 가지 법칙에서 나옵니다. 저항에서 전압과 전류의 관계(옴의 법칙), 폐회로를 돌 때 전압의 합(KVL), 마디에 모이는 전류의 합(KCL)입니다.</p>

  <div class="lab" data-demo="ohm" id="lab-ohm">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 2-1</span><h3>직렬 회로와 병렬 회로</h3></div>
      <div class="seg" role="group" aria-label="회로 구성"><button data-mode="series" aria-pressed="true">직렬 (KVL)</button><button data-mode="parallel" aria-pressed="false">병렬 (KCL)</button></div>
    </div>
    <div class="legend"><span><i style="background:var(--volt)"></i>도선 색이 진할수록 전위가 높음</span><span><i style="background:var(--amp)"></i>주황 점의 흐름 = 전류 (점 밀도 × 속도)</span></div>
    <canvas class="stage" style="height:300px"></canvas>
    <div class="lab-body">
      <div class="controls" id="ohm-ctl"></div>
      <div><div class="readout"></div><div class="balance"></div></div>
    </div>
  </div>

  <h2>옴의 법칙</h2>
  <p>저항 \(R\)에 전류 \(i\)가 흐르면 전류가 들어가는 쪽에서 나오는 쪽으로 전압 \(v\)만큼 전위가 떨어집니다. 저항이 클수록 같은 전압에서 전류가 적게 흐릅니다.</p>
  <div class="math">\[ v = iR, \qquad G = \frac{1}{R}\ [\mathrm{S}], \qquad p = vi = i^2R = \frac{v^2}{R} \]</div>
  <p>위 시각화에서 저항을 지나며 도선 색이 옅어지는 것이 바로 이 전압 강하입니다. 저항 슬라이더를 키우면 주황 점이 느려지는 것으로 전류 감소를 볼 수 있습니다.</p>
  <div class="note">점의 이동 방향은 <b>관례 전류</b> 방향(＋ 단자에서 나와 회로를 돌아 － 단자로)입니다. 실제 전자는 반대 방향으로 움직입니다.</div>

  <h2>키르히호프 전압 법칙 (KVL)</h2>
  <p>어떤 폐회로를 한 바퀴 돌아도 전압의 대수합은 0입니다. 전원이 전위를 올린 만큼 저항들이 정확히 그만큼 내립니다. 에너지 보존 법칙을 회로 언어로 쓴 것입니다.</p>
  <div class="math">\[ \sum_{k=1}^{M} v_k = 0 \quad\Longrightarrow\quad V_s = V_1 + V_2 + \cdots \]</div>
  <p>직렬 모드의 오른쪽 막대 그림에서 왼쪽 막대(전원이 올린 전압)와 오른쪽 막대(저항에서 내려간 전압)의 높이가 항상 같은 이유입니다.</p>

  <h2>키르히호프 전류 법칙 (KCL)</h2>
  <p>한 마디로 들어오는 전류의 합은 나가는 전류의 합과 같습니다. 전하는 마디에 쌓이지 않기 때문입니다(전하 보존).</p>
  <div class="math">\[ \sum_{n=1}^{N} i_n = 0 \quad\Longrightarrow\quad I = I_1 + I_2 \]</div>
  <p>병렬 모드로 바꾸면 위쪽 마디에서 주황 점이 두 갈래로 나뉩니다. 저항이 작은 가지에 점이 더 촘촘하게 흐릅니다.</p>

  <h2>직렬·병렬 합성과 분압·분류</h2>
  <div class="tscroll"><table class="t">
    <tr><th></th><th>직렬</th><th>병렬</th></tr>
    <tr><td>등가 저항</td><td>\(R_{eq} = R_1 + R_2\)</td><td>\(R_{eq} = \dfrac{R_1R_2}{R_1+R_2}\)</td></tr>
    <tr><td>공통인 양</td><td>전류 \(i\)</td><td>전압 \(v\)</td></tr>
    <tr><td>나뉘는 양</td><td>분압: \(v_1 = \dfrac{R_1}{R_1+R_2}\,v\)</td><td>분류: \(i_1 = \dfrac{R_2}{R_1+R_2}\,i\)</td></tr>
  </table></div>
  <div class="note v">분류 공식에서 \(i_1\) 분자에 \(R_2\)가 오는 것에 주의하세요. 반대편 저항이 클수록 내 쪽으로 전류가 더 옵니다.</div>
</div>
</template>

<!-- ───────────── 7장 ───────────── -->
<template id="tpl-ch7">
<div class="wrap">
  <div class="eyebrow">7장 · 직류 회로</div>
  <h1>1차 회로: RC와 RL의 과도 응답</h1>
  <p class="lede">커패시터나 인덕터가 하나 있는 회로는 스위치를 넣는 순간 바로 최종값에 가지 않고, 지수 함수로 서서히 다가갑니다. 그 빠르기를 정하는 값이 시정수 \(\tau\)입니다.</p>

  <div class="lab" data-demo="transient" id="lab-tr">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 7-1</span><h3>스위치를 닫은 뒤 무슨 일이 일어나나</h3></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="회로 종류"><button data-kind="RC" aria-pressed="true">RC</button><button data-kind="RL" aria-pressed="false">RL</button></div>
        <button class="btn primary" data-act="restart">스위치 다시 닫기</button>
        <button class="btn" data-act="pause">일시정지</button>
        <div class="seg" role="group" aria-label="재생 속도"><button data-speed="0.5" aria-pressed="false">0.5×</button><button data-speed="1" aria-pressed="true">1×</button><button data-speed="2" aria-pressed="false">2×</button></div>
      </div>
    </div>
    <canvas class="stage" data-role="circuit" style="height:260px"></canvas>
    <div class="legend"><span><i style="background:var(--volt)"></i><span data-role="vlabel">커패시터 전압 v<sub>C</sub>(t)</span></span><span><i style="background:var(--amp)"></i>회로 전류 i(t)</span><span>세로 점선: τ의 배수</span></div>
    <canvas class="stage" data-role="plot" style="height:230px"></canvas>
    <div class="lab-body">
      <div class="controls" id="tr-ctl"></div>
      <div class="readout"></div>
    </div>
  </div>

  <h2>RC 회로의 충전</h2>
  <p>스위치를 닫는 순간 커패시터 전압은 0이므로 전원 전압이 모두 저항에 걸려 전류가 최대 \(V_s/R\)로 흐릅니다. 극판에 전하가 쌓일수록 \(v_C\)가 커지고 저항 양단 전압이 줄어 전류도 줄어듭니다.</p>
  <div class="math">\[ v_C(t) = V_s\left(1 - e^{-t/\tau}\right), \qquad i(t) = \frac{V_s}{R}\,e^{-t/\tau}, \qquad \tau = RC \]</div>
  <p>\(t=\tau\)에서 최종값의 63.2%, \(5\tau\)에서 99.3%에 도달합니다. 그래서 실무에서는 \(5\tau\)가 지나면 정상 상태로 봅니다.</p>
  <div class="tscroll"><table class="t">
    <tr><th>t</th><td>τ</td><td>2τ</td><td>3τ</td><td>4τ</td><td>5τ</td></tr>
    <tr><th>\(1-e^{-t/\tau}\)</th><td>63.2%</td><td>86.5%</td><td>95.0%</td><td>98.2%</td><td>99.3%</td></tr>
  </table></div>

  <h2>RL 회로의 전류 증가</h2>
  <p>인덕터는 전류의 갑작스러운 변화를 막습니다(\(v = L\,di/dt\)). 스위치를 닫은 직후 인덕터가 전원 전압을 모두 받아내며 전류는 0에서 서서히 커집니다. 시각화에서 코일 주위 고리가 점점 진해지는 것이 쌓이는 자기 에너지입니다.</p>
  <div class="math">\[ i(t) = \frac{V_s}{R}\left(1 - e^{-t/\tau}\right), \qquad v_L(t) = V_s\,e^{-t/\tau}, \qquad \tau = \frac{L}{R} \]</div>

  <h2>모든 1차 회로에 통하는 공식</h2>
  <p>초기값 \(x(0)\), 최종값 \(x(\infty)\), 시정수 \(\tau\) 세 가지만 구하면 어떤 1차 회로의 응답도 바로 쓸 수 있습니다.</p>
  <div class="math">\[ x(t) = x(\infty) + \big[x(0) - x(\infty)\big]\,e^{-t/\tau} \]</div>
  <div class="note">커패시터 <b>전압</b>과 인덕터 <b>전류</b>는 순간적으로 바뀔 수 없습니다. 그래서 \(v_C(0^-) = v_C(0^+)\), \(i_L(0^-) = i_L(0^+)\)이 초기값을 구하는 출발점이 됩니다.</div>
</div>
</template>

<!-- ───────────── 9장 ───────────── -->
<template id="tpl-ch9">
<div class="wrap">
  <div class="eyebrow">9장 · 교류 회로</div>
  <h1>정현파, 페이저, 임피던스</h1>
  <p class="lede">교류 전압은 시간에 따라 코사인 모양으로 오르내립니다. 이 움직임을 회전하는 화살표(페이저)로 바꾸면 미분 방정식이 복소수 곱셈으로 바뀌고, 저항·인덕터·커패시터를 모두 임피던스 하나로 다룰 수 있습니다.</p>

  <div class="lab" data-demo="wave" id="lab-wave">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 9-1</span><h3>도선을 타고 가는 코사인파와 회전하는 페이저</h3></div>
      <div class="tools"><button class="btn" data-act="pause">일시정지</button></div>
    </div>
    <canvas class="stage" style="height:300px"></canvas>
    <div class="cap">왼쪽 원은 실수축(Re)을 위로 세워 그렸습니다. 화살표 끝의 높이가 곧 그 순간의 전압 \(v(t)\)이고, 점선을 따라 도선 시작점의 파형 높이와 같아집니다.</div>
    <div class="lab-body">
      <div class="controls" id="wave-ctl"></div>
      <div class="readout"></div>
    </div>
  </div>

  <h2>정현파의 요소</h2>
  <div class="math">\[ v(t) = V_m \cos(\omega t + \phi) \]</div>
  <div class="tscroll"><table class="t">
    <tr><th>기호</th><th>이름</th><th>의미</th></tr>
    <tr><td>\(V_m\)</td><td>진폭</td><td>최댓값. 실효값은 \(V_{rms} = V_m/\sqrt{2}\)</td></tr>
    <tr><td>\(\omega\)</td><td>각주파수</td><td>\(\omega = 2\pi f\) [rad/s], 주기 \(T = 1/f\)</td></tr>
    <tr><td>\(\phi\)</td><td>위상</td><td>\(t=0\)일 때 페이저가 실수축에서 돌아가 있는 각도</td></tr>
  </table></div>

  <h3>도선 위의 파형은 무엇을 뜻하나</h3>
  <p>위 그림의 도선은 전압이 \(v(x,t) = V_m\cos(\omega t - \beta x + \phi)\)처럼 공간을 따라 전파되는 모습입니다. 도선 길이가 파장에 견줄 만큼 길면(송전선, 고주파 회로) 실제로 이렇게 보입니다. 보통의 회로이론은 도선이 파장보다 아주 짧다고 가정하는 <b>집중 정수 회로</b>입니다. "도선 길이 / 파장"을 0 근처로 내리면 도선 전체가 한 몸처럼 오르내리는데, 이것이 교재에서 다루는 상황입니다. 회로이론에서 파형은 한 점의 시간 변화를 그린 것입니다.</p>

  <h2>페이저 변환</h2>
  <p>오일러 공식 \(e^{j\theta} = \cos\theta + j\sin\theta\)에 의해 코사인은 회전하는 복소수의 실수부입니다. 회로 안의 모든 전압·전류가 같은 \(\omega\)로 돌기 때문에 공통인 \(e^{j\omega t}\)를 떼고 크기와 위상만 남긴 것이 페이저입니다.</p>
  <div class="math">\[ v(t) = V_m\cos(\omega t+\phi) = \mathrm{Re}\{V_m e^{j\phi} e^{j\omega t}\} \quad\Longleftrightarrow\quad \mathbf{V} = V_m\angle\phi \]</div>
  <div class="math">\[ \frac{dv}{dt} \;\Longleftrightarrow\; j\omega\mathbf{V}, \qquad \int v\,dt \;\Longleftrightarrow\; \frac{\mathbf{V}}{j\omega} \]</div>

  <h2>임피던스</h2>
  <p>페이저 영역에서 소자의 전압과 전류 비 \(\mathbf{Z} = \mathbf{V}/\mathbf{I}\)를 임피던스라 합니다. 옴의 법칙, KVL, KCL이 모두 그대로 성립합니다.</p>
  <div class="tscroll"><table class="t">
    <tr><th>소자</th><th>임피던스</th><th>전압과 전류의 위상</th></tr>
    <tr><td>저항 R</td><td>\(\mathbf{Z}_R = R\)</td><td>같은 위상</td></tr>
    <tr><td>인덕터 L</td><td>\(\mathbf{Z}_L = j\omega L\)</td><td>전류가 전압보다 90° 뒤짐</td></tr>
    <tr><td>커패시터 C</td><td>\(\mathbf{Z}_C = \dfrac{1}{j\omega C} = -\dfrac{j}{\omega C}\)</td><td>전류가 전압보다 90° 앞섬</td></tr>
  </table></div>
  <div class="note v">외우는 법: <b>ELI the ICE man</b>. L에서는 E(전압)가 I보다 먼저, C에서는 I가 E보다 먼저.</div>

  <div class="lab" data-demo="imp" id="lab-imp">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 9-2</span><h3>직렬 RLC 회로의 임피던스와 위상</h3></div>
      <div class="tools"><button class="btn" data-act="res">공진 주파수로</button><button class="btn" data-act="pause">회전 멈춤</button></div>
    </div>
    <div class="stage-grid">
      <div><div class="cap">임피던스 평면: \(\mathbf{Z} = R + j(X_L - X_C)\)</div><canvas class="stage" data-role="z" style="height:260px"></canvas></div>
      <div><div class="cap">전압 페이저: \(\mathbf{V}_R + \mathbf{V}_L + \mathbf{V}_C = \mathbf{V}_s\) (KVL)</div><canvas class="stage" data-role="v" style="height:260px"></canvas></div>
    </div>
    <div class="legend"><span><i style="background:var(--volt)"></i>전원 전압 v(t)</span><span><i style="background:var(--amp)"></i>전류 i(t) (오른쪽 눈금)</span></div>
    <canvas class="stage" data-role="t" style="height:200px"></canvas>
    <div class="lab-body">
      <div class="controls" id="imp-ctl"></div>
      <div class="readout"></div>
    </div>
  </div>

  <h2>직렬 RLC와 공진</h2>
  <div class="math">\[ \mathbf{Z} = R + j\left(\omega L - \frac{1}{\omega C}\right) = |\mathbf{Z}|\angle\theta, \qquad |\mathbf{Z}| = \sqrt{R^2 + X^2}, \quad \theta = \tan^{-1}\frac{X}{R} \]</div>
  <p>\(X_L > X_C\)이면 유도성(전류가 뒤짐), \(X_L < X_C\)이면 용량성(전류가 앞섬)입니다. 두 리액턴스가 같아지는 주파수에서 허수부가 사라지고 \(|\mathbf{Z}| = R\)로 최소가 되어 전류가 가장 크게 흐릅니다.</p>
  <div class="math">\[ \omega_0 = \frac{1}{\sqrt{LC}}, \qquad f_0 = \frac{1}{2\pi\sqrt{LC}} \]</div>
  <p>"공진 주파수로" 버튼을 누르면 임피던스 평면의 L과 C 화살표가 서로 상쇄되고, 전압 페이저 그림에서는 \(\mathbf{V}_L\)과 \(\mathbf{V}_C\)가 크기는 같고 방향이 반대가 됩니다. 이때 \(|\mathbf{V}_L|\)이 전원 전압보다 훨씬 클 수 있다는 점도 확인해 보세요.</p>
</div>
</template>


<!-- ───────────── 1장 ───────────── -->
<template id="tpl-ch1">
<div class="wrap">
  <div class="eyebrow">1장 · 직류 회로</div>
  <h1>기본 개념: 전하, 전류, 전압, 전력</h1>
  <p class="lede">전류는 단면을 지나가는 전하의 양이 시간에 따라 늘어나는 빠르기이고, 전압은 전하 하나를 옮길 때 드는 에너지입니다. 둘을 곱하면 소자가 받거나 내놓는 전력이 됩니다.</p>

  <div class="lab" data-demo="charge" id="lab-q">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 1-1</span><h3>단면을 지나는 전하 세기</h3></div>
      <div class="tools"><button class="btn" data-act="reset">계수기 초기화</button></div>
    </div>
    <canvas class="stage" data-role="wire" style="height:170px"></canvas>
    <div class="legend"><span><i style="background:var(--amp)"></i>양전하(관례 전류의 방향으로 이동)</span><span><i style="background:var(--volt)"></i>점선 단면 A를 지난 전하를 셉니다</span></div>
    <canvas class="stage" data-role="pw" style="height:210px"></canvas>
    <div class="lab-body"><div class="controls" id="q-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>전하와 전류</h2>
  <p>전하의 단위는 쿨롱(C)이고 전자 하나의 전하는 \(-1.602\times10^{-19}\,\mathrm{C}\)입니다. 전류는 단면을 지나는 전하의 시간 변화율입니다. 위 그래프에서 \(q(t)\) 직선의 기울기가 곧 전류입니다.</p>
  <div class="math">\[ i = \frac{dq}{dt}\ [\mathrm{A} = \mathrm{C/s}], \qquad q(t) = \int_{t_0}^{t} i\,d\tau + q(t_0) \]</div>
  <h2>전압</h2>
  <p>두 점 a, b 사이의 전압은 단위 전하를 a에서 b로 옮기는 데 필요한 에너지입니다.</p>
  <div class="math">\[ v_{ab} = \frac{dw}{dq}\ [\mathrm{V} = \mathrm{J/C}] \]</div>
  <h2>전력과 수동 부호 규약</h2>
  <p>전류가 소자의 ＋ 단자로 들어가도록 방향을 잡으면(수동 부호 규약) \(p = vi\)가 양수일 때 소자가 전력을 <b>흡수</b>하고, 음수일 때 <b>공급</b>합니다. 전류나 전압 슬라이더를 음수로 바꿔 소자의 색이 바뀌는 것을 확인해 보세요.</p>
  <div class="math">\[ p = \frac{dw}{dt} = vi, \qquad w = \int_{t_0}^{t} p\,d\tau, \qquad \sum p = 0 \]</div>
  <div class="note v">회로 전체에서 흡수한 전력의 합과 공급한 전력의 합은 같습니다(에너지 보존).</div>
  <h2>회로 소자</h2>
  <p>전원은 독립 전원(정해진 전압이나 전류를 유지)과 종속 전원(다른 곳의 전압이나 전류에 비례)으로 나뉩니다. 종속 전원은 트랜지스터나 연산 증폭기의 모델에 쓰입니다.</p>
</div>
</template>

<!-- ───────────── 3장 ───────────── -->
<template id="tpl-ch3">
<div class="wrap">
  <div class="eyebrow">3장 · 직류 회로</div>
  <h1>회로 해석 방법: 마디 해석과 메시 해석</h1>
  <p class="lede">마디 해석은 마디 전압을, 메시 해석은 고리를 도는 가상 전류를 미지수로 잡습니다. 같은 회로를 두 방법으로 풀어 보면 결과가 똑같이 나옵니다.</p>

  <div class="lab" data-demo="nodal" id="lab-nodal">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 3-1</span><h3>전원 두 개짜리 회로 풀기</h3></div>
      <div class="seg" role="group" aria-label="해석 방법"><button data-mode="node" aria-pressed="true">마디 해석 (가지 전류)</button><button data-mode="mesh" aria-pressed="false">메시 해석 (메시 전류)</button></div>
    </div>
    <div class="legend"><span><i style="background:var(--volt)"></i>도선 색 = 마디 전위</span><span><i style="background:var(--amp)"></i>점 흐름 = 가지 전류, 회전 화살표 = 메시 전류</span></div>
    <canvas class="stage" style="height:290px"></canvas>
    <div class="lab-body"><div class="controls" id="nodal-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>마디 해석</h2>
  <ol>
    <li>기준 마디(접지)를 하나 고르고 나머지 마디에 전압 \(v_1, v_2, \dots\)를 붙입니다.</li>
    <li>각 마디에서 KCL을 쓰고, 가지 전류를 옴의 법칙으로 마디 전압의 차로 바꿉니다.</li>
    <li>연립 방정식을 풉니다.</li>
  </ol>
  <div class="math">\[ \frac{v_1 - V_{s1}}{R_1} + \frac{v_1}{R_3} + \frac{v_1 - V_{s2}}{R_2} = 0 \;\Longrightarrow\; v_1 = \frac{V_{s1}/R_1 + V_{s2}/R_2}{1/R_1 + 1/R_2 + 1/R_3} \]</div>
  <p>두 마디 사이에 전압원만 있으면 그 둘을 묶어 <b>초마디</b>로 보고 KCL 하나와 전압원 조건 하나를 씁니다.</p>
  <h2>메시 해석</h2>
  <p>평면 회로의 각 창(메시)마다 시계 방향으로 도는 메시 전류를 정하고 KVL을 씁니다. 두 메시가 함께 쓰는 가지에는 두 메시 전류의 차가 흐릅니다.</p>
  <div class="math">\[ \begin{bmatrix} R_1+R_3 & -R_3 \\ -R_3 & R_2+R_3 \end{bmatrix}\begin{bmatrix} i_1 \\ i_2 \end{bmatrix} = \begin{bmatrix} V_{s1} \\ -V_{s2} \end{bmatrix}, \qquad i_{R_3} = i_1 - i_2 \]</div>
  <div class="note v">전류원이 많으면 마디 해석, 전압원이 많으면 메시 해석이 보통 식이 적게 나옵니다. 행렬의 대각 성분은 자기 저항(또는 컨덕턴스)의 합, 비대각 성분은 공유 소자의 음수입니다.</div>
</div>
</template>

<!-- ───────────── 4장 ───────────── -->
<template id="tpl-ch4">
<div class="wrap">
  <div class="eyebrow">4장 · 직류 회로</div>
  <h1>회로 정리: 테브난, 노턴, 최대 전력 전달</h1>
  <p class="lede">부하에서 보기에 복잡한 선형 회로는 전압원 하나와 저항 하나로 바꿀 수 있습니다. 부하 전류와 부하 전압이 전혀 변하지 않습니다.</p>

  <div class="lab" data-demo="thevenin" id="lab-th">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 4-1</span><h3>원래 회로와 테브난 등가 회로</h3></div>
      <div class="seg" role="group" aria-label="회로 보기"><button data-mode="orig" aria-pressed="true">원래 회로</button><button data-mode="th" aria-pressed="false">테브난 등가</button></div>
    </div>
    <canvas class="stage" data-role="c" style="height:250px"></canvas>
    <div class="legend"><span><i style="background:var(--amp)"></i>부하 전력 P<sub>L</sub>(R<sub>L</sub>)</span><span>세로 점선: R<sub>L</sub> = R<sub>Th</sub> (최대 전력)</span></div>
    <canvas class="stage" data-role="p" style="height:200px"></canvas>
    <div class="lab-body"><div class="controls" id="th-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>중첩의 원리</h2>
  <p>선형 회로에서 여러 독립 전원이 만드는 응답은 전원을 하나씩만 남기고(나머지 전압원은 단락, 전류원은 개방) 구한 응답의 합입니다.</p>
  <h2>테브난 정리와 노턴 정리</h2>
  <div class="math">\[ V_{Th} = v_{oc}, \qquad R_{Th} = \frac{v_{oc}}{i_{sc}}, \qquad I_N = i_{sc} = \frac{V_{Th}}{R_{Th}}, \qquad R_N = R_{Th} \]</div>
  <p>위 회로에서 단자 a-b 왼쪽은 분압기입니다. 개방 전압은 분압 공식으로, \(R_{Th}\)는 전압원을 단락한 뒤 단자에서 본 저항으로 구합니다.</p>
  <div class="math">\[ V_{Th} = \frac{R_2}{R_1 + R_2}V_s, \qquad R_{Th} = R_1 \parallel R_2 = \frac{R_1R_2}{R_1+R_2} \]</div>
  <p>"원래 회로"와 "테브난 등가"를 번갈아 눌러도 부하에 흐르는 주황 점의 빠르기가 똑같습니다.</p>
  <h2>최대 전력 전달</h2>
  <div class="math">\[ P_L = \left(\frac{V_{Th}}{R_{Th}+R_L}\right)^2 R_L, \qquad \frac{dP_L}{dR_L} = 0 \;\Rightarrow\; R_L = R_{Th}, \qquad P_{max} = \frac{V_{Th}^2}{4R_{Th}} \]</div>
  <div class="note">최대 전력이 전달될 때 효율은 50%입니다. 전력의 절반은 \(R_{Th}\)에서 열로 사라집니다.</div>
</div>
</template>

<!-- ───────────── 5장 ───────────── -->
<template id="tpl-ch5">
<div class="wrap">
  <div class="eyebrow">5장 · 직류 회로</div>
  <h1>연산 증폭기</h1>
  <p class="lede">이상 연산 증폭기는 두 가지 규칙만 기억하면 됩니다. 입력 단자로 전류가 들어가지 않고, 음되먹임이 걸리면 두 입력 단자의 전압이 같아집니다.</p>

  <div class="lab" data-demo="opamp" id="lab-op">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 5-1</span><h3>증폭기의 입력과 출력 파형</h3></div>
      <div class="seg" role="group" aria-label="증폭기 종류"><button data-mode="inv" aria-pressed="true">반전 증폭기</button><button data-mode="non" aria-pressed="false">비반전 증폭기</button></div>
    </div>
    <canvas class="stage" data-role="c" style="height:230px"></canvas>
    <div class="legend"><span><i style="background:var(--volt)"></i>입력 v<sub>i</sub>(t)</span><span><i style="background:var(--amp)"></i>출력 v<sub>o</sub>(t)</span><span>점선: 전원 전압 ±V<sub>CC</sub> (포화 한계)</span></div>
    <canvas class="stage" data-role="p" style="height:210px"></canvas>
    <div class="lab-body"><div class="controls" id="op-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>이상 연산 증폭기</h2>
  <div class="math">\[ i_+ = i_- = 0, \qquad v_+ = v_- \quad(\text{음되먹임일 때}) \]</div>
  <h2>반전 증폭기</h2>
  <p>\(v_+ = 0\)이므로 \(v_-\)도 0(가상 접지)입니다. \(R_1\)을 지나는 전류가 그대로 \(R_f\)를 지납니다.</p>
  <div class="math">\[ \frac{v_i - 0}{R_1} = \frac{0 - v_o}{R_f} \;\Longrightarrow\; v_o = -\frac{R_f}{R_1}\,v_i \]</div>
  <h2>비반전 증폭기</h2>
  <div class="math">\[ v_- = \frac{R_1}{R_1 + R_f}v_o = v_i \;\Longrightarrow\; v_o = \left(1 + \frac{R_f}{R_1}\right)v_i \]</div>
  <h2>가산기와 차동 증폭기</h2>
  <div class="math">\[ v_o = -R_f\left(\frac{v_1}{R_1} + \frac{v_2}{R_2} + \frac{v_3}{R_3}\right), \qquad v_o = \frac{R_2}{R_1}(v_2 - v_1) \]</div>
  <div class="note">실제 증폭기의 출력은 전원 전압 \(\pm V_{CC}\)를 넘을 수 없습니다. 이득이나 입력을 키우면 파형 꼭대기가 잘리는 포화가 생깁니다.</div>
</div>
</template>

<!-- ───────────── 6장 ───────────── -->
<template id="tpl-ch6">
<div class="wrap">
  <div class="eyebrow">6장 · 직류 회로</div>
  <h1>커패시터와 인덕터</h1>
  <p class="lede">커패시터는 전기장에, 인덕터는 자기장에 에너지를 저장합니다. 커패시터 전류는 전압의 기울기에, 인덕터 전압은 전류의 기울기에 비례합니다.</p>

  <div class="lab" data-demo="storage" id="lab-st">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 6-1</span><h3>기울기가 곧 상대편 양</h3></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="소자"><button data-mode="C" aria-pressed="true">커패시터</button><button data-mode="L" aria-pressed="false">인덕터</button></div>
        <div class="seg" role="group" aria-label="입력 파형"><button data-wave="sin" aria-pressed="true">사인파</button><button data-wave="tri" aria-pressed="false">삼각파</button><button data-wave="trap" aria-pressed="false">사다리꼴</button></div>
      </div>
    </div>
    <canvas class="stage" style="height:280px"></canvas>
    <div class="lab-body"><div class="controls" id="st-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>커패시터</h2>
  <div class="math">\[ q = Cv, \qquad i = C\frac{dv}{dt}, \qquad w_C = \frac12 Cv^2 \]</div>
  <p>삼각파 전압을 넣으면 기울기가 일정한 구간마다 전류가 일정한 값(구형파)이 됩니다. 사다리꼴의 평평한 구간에서는 전압이 변하지 않으므로 전류가 0입니다. 직류에서 커패시터는 개방 회로처럼 동작합니다.</p>
  <h2>인덕터</h2>
  <div class="math">\[ v = L\frac{di}{dt}, \qquad w_L = \frac12 Li^2 \]</div>
  <p>직류에서 인덕터는 단락 회로처럼 동작합니다. 전류가 순간적으로 바뀌면 \(di/dt\)가 무한대가 되므로 인덕터 전류는 연속이어야 합니다.</p>
  <h2>직렬·병렬 합성</h2>
  <div class="tscroll"><table class="t">
    <tr><th></th><th>직렬</th><th>병렬</th></tr>
    <tr><td>커패시터</td><td>\(\dfrac{1}{C_{eq}} = \dfrac{1}{C_1} + \dfrac{1}{C_2}\)</td><td>\(C_{eq} = C_1 + C_2\)</td></tr>
    <tr><td>인덕터</td><td>\(L_{eq} = L_1 + L_2\)</td><td>\(\dfrac{1}{L_{eq}} = \dfrac{1}{L_1} + \dfrac{1}{L_2}\)</td></tr>
  </table></div>
  <div class="note v">커패시터는 저항과 반대로 합성되고, 인덕터는 저항과 같은 방식으로 합성됩니다.</div>
</div>
</template>

<!-- ───────────── 8장 ───────────── -->
<template id="tpl-ch8">
<div class="wrap">
  <div class="eyebrow">8장 · 직류 회로</div>
  <h1>2차 회로: RLC 과도 응답</h1>
  <p class="lede">L과 C가 함께 있으면 에너지가 둘 사이를 오가며 응답이 진동할 수 있습니다. 저항이 얼마나 빨리 에너지를 소모하느냐에 따라 세 가지 모양이 나옵니다.</p>

  <div class="lab" data-demo="rlc2" id="lab-rlc2">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 8-1</span><h3>직렬 RLC 계단 응답과 극점</h3></div>
      <div class="tools"><button class="btn" data-act="crit">임계 감쇠로</button><button class="btn" data-act="pause">일시정지</button></div>
    </div>
    <div class="stage-grid">
      <div><div class="cap">s-평면의 두 극점 (점선 원의 반지름 = ω₀)</div><canvas class="stage" data-role="s" style="height:260px"></canvas></div>
      <div><div class="cap">커패시터 전압 v<sub>C</sub>(t), 점선은 감쇠 포락선</div><canvas class="stage" data-role="t" style="height:260px"></canvas></div>
    </div>
    <div class="lab-body"><div class="controls" id="rlc2-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>특성 방정식</h2>
  <p>직렬 RLC에 KVL을 쓰면 2차 미분 방정식이 나오고, 지수 해 \(e^{st}\)를 넣으면 특성 방정식을 얻습니다.</p>
  <div class="math">\[ \frac{d^2v_C}{dt^2} + \frac{R}{L}\frac{dv_C}{dt} + \frac{1}{LC}v_C = \frac{V_s}{LC} \]</div>
  <div class="math">\[ s^2 + 2\alpha s + \omega_0^2 = 0, \qquad \alpha = \frac{R}{2L}, \quad \omega_0 = \frac{1}{\sqrt{LC}}, \quad s_{1,2} = -\alpha \pm \sqrt{\alpha^2 - \omega_0^2} \]</div>
  <h2>세 가지 감쇠</h2>
  <div class="tscroll"><table class="t">
    <tr><th>조건</th><th>이름</th><th>극점</th><th>응답</th></tr>
    <tr><td>\(\alpha > \omega_0\)</td><td>과감쇠</td><td>서로 다른 두 음의 실수</td><td>\(A_1e^{s_1t} + A_2e^{s_2t}\)</td></tr>
    <tr><td>\(\alpha = \omega_0\)</td><td>임계 감쇠</td><td>중근 \(-\alpha\)</td><td>\((A_1 + A_2t)e^{-\alpha t}\)</td></tr>
    <tr><td>\(\alpha < \omega_0\)</td><td>부족 감쇠</td><td>켤레 복소수 \(-\alpha \pm j\omega_d\)</td><td>\(e^{-\alpha t}(B_1\cos\omega_dt + B_2\sin\omega_dt)\)</td></tr>
  </table></div>
  <p>여기서 \(\omega_d = \sqrt{\omega_0^2 - \alpha^2}\)입니다. R을 줄이면 두 극점이 실수축 위에서 서로 다가가 만난 뒤(임계 감쇠) 점선 원을 따라 위아래로 갈라집니다. 극점이 허수축에 가까울수록 진동이 오래갑니다.</p>
  <div class="note v">임계 감쇠 저항은 \(R = 2\sqrt{L/C}\)입니다. 진동 없이 가장 빨리 최종값에 도달합니다.</div>
</div>
</template>

<!-- ───────────── 10장 ───────────── -->
<template id="tpl-ch10">
<div class="wrap">
  <div class="eyebrow">10장 · 교류 회로</div>
  <h1>정현파 정상상태 해석</h1>
  <p class="lede">페이저와 임피던스를 쓰면 교류 회로도 직류 회로와 똑같이 마디 해석, 메시 해석, 테브난 정리로 풀 수 있습니다. 다른 점은 숫자가 복소수라는 것뿐입니다.</p>

  <div class="lab" data-demo="acnode" id="lab-acn">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 10-1</span><h3>교류 마디 해석: 페이저로 닫히는 KVL과 KCL</h3></div>
      <div class="tools"><button class="btn" data-act="res">병렬 공진으로</button><button class="btn" data-act="pause">회전 멈춤</button></div>
    </div>
    <canvas class="stage" data-role="c" style="height:200px"></canvas>
    <div class="stage-grid" style="border-top:1px solid var(--rule)">
      <div><div class="cap">전압 페이저: \(\mathbf{V} + \mathbf{V}_R = \mathbf{V}_s\)</div><canvas class="stage" data-role="v" style="height:250px"></canvas></div>
      <div><div class="cap">전류 페이저: \(\mathbf{I}_L + \mathbf{I}_C = \mathbf{I}_R\)</div><canvas class="stage" data-role="i" style="height:250px"></canvas></div>
    </div>
    <div class="lab-body"><div class="controls" id="acn-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>페이저 영역의 마디 해석</h2>
  <p>위 회로의 마디 \(\mathbf{V}\)에서 KCL을 쓰면 직류 때와 같은 모양의 식이 나옵니다. 저항 대신 임피던스가 들어갈 뿐입니다.</p>
  <div class="math">\[ \frac{\mathbf{V} - \mathbf{V}_s}{R} + \frac{\mathbf{V}}{j\omega L} + j\omega C\,\mathbf{V} = 0 \;\Longrightarrow\; \mathbf{V} = \frac{\mathbf{Z}_p}{R + \mathbf{Z}_p}\mathbf{V}_s, \quad \mathbf{Z}_p = \frac{1}{\frac{1}{j\omega L} + j\omega C} \]</div>
  <p>오른쪽 전류 그림에서 \(\mathbf{I}_L\)과 \(\mathbf{I}_C\)는 항상 정반대 방향(180°)입니다. 둘의 크기가 같아지는 병렬 공진 주파수에서는 \(\mathbf{I}_R\)이 0에 가까워지고 \(\mathbf{V}\)가 \(\mathbf{V}_s\)와 거의 같아집니다.</p>
  <h2>교류 회로의 다른 해석 도구</h2>
  <ul>
    <li><b>메시 해석</b>: 임피던스 행렬 \(\mathbf{Z}\,\mathbf{I} = \mathbf{V}\)를 풉니다.</li>
    <li><b>중첩</b>: 주파수가 다른 전원은 반드시 따로 풀고 <b>시간 영역에서</b> 더합니다. 페이저는 같은 주파수끼리만 더할 수 있습니다.</li>
    <li><b>테브난·노턴</b>: \(\mathbf{V}_{Th} = \mathbf{V}_{oc}\), \(\mathbf{Z}_{Th} = \mathbf{V}_{oc}/\mathbf{I}_{sc}\)</li>
  </ul>
</div>
</template>

<!-- ───────────── 11장 ───────────── -->
<template id="tpl-ch11">
<div class="wrap">
  <div class="eyebrow">11장 · 교류 회로</div>
  <h1>교류 전력</h1>
  <p class="lede">교류에서 순간 전력은 주파수의 두 배로 출렁입니다. 그 평균이 실제로 일을 하는 전력이고, 전압과 전류의 위상차가 클수록 평균이 작아집니다.</p>

  <div class="lab" data-demo="power" id="lab-pw">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 11-1</span><h3>순시 전력 p(t)와 전력 삼각형</h3></div>
      <div class="tools"><button class="btn" data-act="pause">일시정지</button></div>
    </div>
    <div class="legend"><span><i style="background:var(--volt)"></i>v(t)</span><span><i style="background:var(--amp)"></i>i(t)</span><span><i style="background:var(--c-l)"></i>p(t) = v·i (색칠: 0보다 크면 흡수, 작으면 전원으로 되돌림)</span><span>점선: 평균 전력 P</span></div>
    <canvas class="stage" data-role="t" style="height:250px"></canvas>
    <canvas class="stage" data-role="tri" style="height:210px;border-top:1px solid var(--rule)"></canvas>
    <div class="lab-body"><div class="controls" id="pw-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>순시 전력과 평균 전력</h2>
  <div class="math">\[ p(t) = V_mI_m\cos(\omega t + \theta_v)\cos(\omega t + \theta_i) = \tfrac12 V_mI_m\cos(\theta_v - \theta_i) + \tfrac12 V_mI_m\cos(2\omega t + \theta_v + \theta_i) \]</div>
  <div class="math">\[ P = \frac1T\int_0^T p\,dt = \tfrac12 V_mI_m\cos(\theta_v - \theta_i) \]</div>
  <p>저항만 있으면(\(\theta = 0\)) p(t)가 항상 0 이상입니다. 순수 인덕터나 커패시터(\(\theta = \pm90^\circ\))는 반 주기마다 받은 에너지를 그대로 돌려주므로 평균 전력이 0입니다.</p>
  <h2>실효값</h2>
  <div class="math">\[ V_{rms} = \sqrt{\frac1T\int_0^T v^2\,dt} = \frac{V_m}{\sqrt2}, \qquad P = V_{rms}I_{rms}\cos\theta \]</div>
  <h2>복소 전력과 역률</h2>
  <div class="math">\[ \mathbf{S} = \mathbf{V}_{rms}\mathbf{I}_{rms}^{*} = P + jQ, \qquad |\mathbf{S}| = V_{rms}I_{rms}, \qquad \mathrm{pf} = \cos\theta = \frac{P}{|\mathbf{S}|} \]</div>
  <div class="tscroll"><table class="t">
    <tr><th>양</th><th>단위</th><th>뜻</th></tr>
    <tr><td>\(P\) 유효 전력</td><td>W</td><td>실제로 소비되는 전력</td></tr>
    <tr><td>\(Q\) 무효 전력</td><td>VAR</td><td>L, C와 전원 사이를 오가는 전력 (\(Q>0\): 유도성)</td></tr>
    <tr><td>\(|\mathbf S|\) 피상 전력</td><td>VA</td><td>전압 × 전류, 설비 용량의 기준</td></tr>
  </table></div>
  <div class="note">역률이 낮으면 같은 일을 하는 데 전류가 더 많이 필요해 선로 손실이 커집니다. 유도성 부하에 병렬 커패시터를 달아 \(Q\)를 줄이는 것을 <b>역률 개선</b>이라고 합니다.</div>
</div>
</template>

<!-- ───────────── 12장 ───────────── -->
<template id="tpl-ch12">
<div class="wrap">
  <div class="eyebrow">12장 · 교류 회로</div>
  <h1>3상 회로</h1>
  <p class="lede">발전소는 크기가 같고 120°씩 어긋난 세 전압을 만듭니다. 평형 상태에서 세 전압의 합은 매 순간 0이라서 중성선에 전류가 흐르지 않습니다.</p>

  <div class="lab" data-demo="three" id="lab-3p">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 12-1</span><h3>120°씩 어긋나 도는 세 페이저</h3></div>
      <div class="tools"><button class="btn" data-act="bal">평형으로 되돌리기</button><button class="btn" data-act="pause">회전 멈춤</button></div>
    </div>
    <div class="legend"><span><i style="background:var(--volt)"></i>a상</span><span><i style="background:var(--c-l)"></i>b상</span><span><i style="background:var(--c-c)"></i>c상</span><span><i style="background:var(--amp)"></i>세 상의 합 (중성선 전압)</span><span>회색 점선: 선간 전압 V<sub>ab</sub></span></div>
    <div class="stage-grid">
      <div><canvas class="stage" data-role="p" style="height:280px"></canvas></div>
      <div><canvas class="stage" data-role="t" style="height:280px"></canvas></div>
    </div>
    <div class="lab-body"><div class="controls" id="3p-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>평형 3상 전압 (abc 상순)</h2>
  <div class="math">\[ \mathbf V_{an} = V_p\angle0^\circ, \quad \mathbf V_{bn} = V_p\angle{-120^\circ}, \quad \mathbf V_{cn} = V_p\angle{+120^\circ}, \qquad \mathbf V_{an} + \mathbf V_{bn} + \mathbf V_{cn} = 0 \]</div>
  <p>c상의 크기나 위상을 바꿔 불평형을 만들면 주황색 합 벡터가 0에서 벗어납니다. 이것이 불평형 부하에서 중성선에 전류가 흐르는 이유입니다.</p>
  <h2>선간 전압과 상전압</h2>
  <p>Y 결선에서 선간 전압은 두 상전압의 차입니다. 왼쪽 그림의 회색 점선이 \(\mathbf V_{ab} = \mathbf V_{an} - \mathbf V_{bn}\)이고, 크기가 상전압의 \(\sqrt3\)배이며 30° 앞섭니다.</p>
  <div class="math">\[ \mathbf V_{ab} = \sqrt3\,V_p\angle30^\circ, \qquad V_L = \sqrt3\,V_p \;(\text{Y}), \qquad I_L = \sqrt3\,I_p \;(\Delta) \]</div>
  <h2>3상 전력</h2>
  <div class="math">\[ P = 3V_pI_p\cos\theta = \sqrt3\,V_LI_L\cos\theta \]</div>
  <div class="note v">평형 3상의 순간 전력 합은 시간에 따라 변하지 않는 상수입니다. 그래서 3상 전동기는 진동 없이 부드럽게 돕니다.</div>
</div>
</template>

<!-- ───────────── 13장 ───────────── -->
<template id="tpl-ch13">
<div class="wrap">
  <div class="eyebrow">13장 · 교류 회로</div>
  <h1>자기 결합 회로와 변압기</h1>
  <p class="lede">한 코일의 전류가 만든 자속이 다른 코일을 지나가면 그 코일에도 전압이 유도됩니다. 전선으로 연결되지 않아도 에너지가 건너갑니다.</p>

  <div class="lab" data-demo="xfmr" id="lab-xf">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 13-1</span><h3>이상 변압기의 자속과 전압</h3></div>
      <div class="tools"><button class="btn" data-act="pause">일시정지</button></div>
    </div>
    <canvas class="stage" data-role="c" style="height:290px"></canvas>
    <div class="legend"><span><i style="background:var(--volt)"></i>1차 전압 v<sub>1</sub></span><span><i style="background:var(--amp)"></i>2차 전압 v<sub>2</sub></span><span><i style="background:var(--c-l)"></i>철심 속 자속 Φ</span></div>
    <canvas class="stage" data-role="t" style="height:180px"></canvas>
    <div class="lab-body"><div class="controls" id="xf-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>상호 인덕턴스</h2>
  <div class="math">\[ v_1 = L_1\frac{di_1}{dt} + M\frac{di_2}{dt}, \qquad v_2 = M\frac{di_1}{dt} + L_2\frac{di_2}{dt}, \qquad k = \frac{M}{\sqrt{L_1L_2}} \;(0 \le k \le 1) \]</div>
  <p>점 규약: 두 전류가 모두 점이 찍힌 단자로 들어가면 상호 유도 전압의 부호가 ＋, 하나만 들어가면 －입니다.</p>
  <h2>이상 변압기</h2>
  <p>결합 계수가 1이고 손실이 없으면 두 코일을 지나는 자속이 같으므로 감은 수만큼 전압이 비례합니다. 전력은 그대로 건너가므로 전류는 반대로 나뉩니다.</p>
  <div class="math">\[ n = \frac{N_2}{N_1}, \qquad \frac{\mathbf V_2}{\mathbf V_1} = n, \qquad \frac{\mathbf I_2}{\mathbf I_1} = \frac1n, \qquad \mathbf V_1\mathbf I_1^* = \mathbf V_2\mathbf I_2^* \]</div>
  <h2>임피던스 변환</h2>
  <div class="math">\[ \mathbf Z_{in} = \frac{\mathbf V_1}{\mathbf I_1} = \frac{\mathbf Z_L}{n^2} \]</div>
  <div class="note v">스피커처럼 작은 부하를 증폭기의 출력 임피던스와 맞출 때(최대 전력 전달) 변압기의 이 성질을 씁니다.</div>
</div>
</template>

<!-- ───────────── 14장 ───────────── -->
<template id="tpl-ch14">
<div class="wrap">
  <div class="eyebrow">14장 · 고급 해석</div>
  <h1>주파수 응답과 필터</h1>
  <p class="lede">같은 회로라도 입력 주파수에 따라 출력의 크기와 위상이 달라집니다. 이 변화를 주파수 축에 그린 것이 보드 선도이고, 이를 이용해 원하는 주파수만 통과시키는 회로가 필터입니다.</p>

  <div class="lab" data-demo="bode" id="lab-bode">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 14-1</span><h3>보드 선도와 필터를 통과한 파형</h3></div>
      <div class="seg" role="group" aria-label="필터 종류"><button data-mode="lp" aria-pressed="true">RC 저역 통과</button><button data-mode="hp" aria-pressed="false">RC 고역 통과</button><button data-mode="bp" aria-pressed="false">RLC 대역 통과</button></div>
    </div>
    <canvas class="stage" data-role="b" style="height:320px"></canvas>
    <div class="legend"><span><i style="background:var(--volt)"></i>입력 v<sub>i</sub>(t)</span><span><i style="background:var(--amp)"></i>출력 v<sub>o</sub>(t)</span></div>
    <canvas class="stage" data-role="t" style="height:170px"></canvas>
    <div class="lab-body"><div class="controls" id="bode-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>전달함수와 데시벨</h2>
  <div class="math">\[ \mathbf H(\omega) = \frac{\mathbf V_o(\omega)}{\mathbf V_i(\omega)}, \qquad H_{dB} = 20\log_{10}|\mathbf H(\omega)| \]</div>
  <p>\(-3\,\mathrm{dB}\)는 크기가 \(1/\sqrt2 \approx 0.707\)배, 전력이 절반이 되는 지점입니다. 이 주파수를 차단 주파수라고 합니다.</p>
  <h2>RC 필터</h2>
  <div class="math">\[ \mathbf H_{LP} = \frac{1}{1 + j\omega RC}, \qquad \mathbf H_{HP} = \frac{j\omega RC}{1 + j\omega RC}, \qquad \omega_c = \frac{1}{RC} \]</div>
  <p>차단 주파수보다 높은 곳에서 저역 통과 필터의 크기는 10배 주파수마다 20 dB씩 떨어집니다(−20 dB/decade). 차단 주파수에서 위상은 정확히 −45°(저역) 또는 +45°(고역)입니다.</p>
  <h2>공진과 대역 통과</h2>
  <div class="math">\[ \mathbf H_{BP} = \frac{R}{R + j\left(\omega L - \frac{1}{\omega C}\right)}, \qquad \omega_0 = \frac{1}{\sqrt{LC}}, \qquad Q = \frac{\omega_0L}{R}, \qquad B = \frac{\omega_0}{Q} = \frac RL \]</div>
  <div class="note v">Q가 클수록 통과 대역이 좁고 날카롭습니다. 라디오가 원하는 방송국 하나만 골라내는 원리입니다.</div>
</div>
</template>

<!-- ───────────── 15장 ───────────── -->
<template id="tpl-ch15">
<div class="wrap">
  <div class="eyebrow">15장 · 고급 해석</div>
  <h1>라플라스 변환</h1>
  <p class="lede">라플라스 변환은 시간 함수를 복소 주파수 \(s = \sigma + j\omega\)의 함수로 바꿉니다. 미분은 \(s\)를 곱하는 일로 바뀌고, 회로의 성질은 s-평면의 극점 위치로 요약됩니다.</p>

  <div class="lab" data-demo="laplace" id="lab-lap">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 15-1</span><h3>극점 위치와 시간 응답</h3></div>
      <div class="tools"><span class="eyebrow">s-평면을 누르거나 끌어서 극점을 옮겨 보세요</span></div>
    </div>
    <div class="stage-grid">
      <div><div class="cap">s-평면: 색칠된 왼쪽 반평면이 안정 영역</div><canvas class="stage" data-role="s" style="height:280px;touch-action:none;cursor:crosshair"></canvas></div>
      <div><div class="cap">임펄스 응답 h(t) = e<sup>σt</sup>cos ωt</div><canvas class="stage" data-role="t" style="height:280px"></canvas></div>
    </div>
    <div class="lab-body"><div class="controls" id="lap-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>정의와 주요 변환 쌍</h2>
  <div class="math">\[ F(s) = \mathcal L\{f(t)\} = \int_{0^-}^{\infty} f(t)\,e^{-st}\,dt \]</div>
  <div class="tscroll"><table class="t">
    <tr><th>\(f(t)\)</th><th>\(F(s)\)</th><th>극점</th></tr>
    <tr><td>\(u(t)\)</td><td>\(1/s\)</td><td>\(s = 0\)</td></tr>
    <tr><td>\(e^{-at}\)</td><td>\(1/(s+a)\)</td><td>\(s = -a\)</td></tr>
    <tr><td>\(e^{-at}\cos\omega t\)</td><td>\(\dfrac{s+a}{(s+a)^2 + \omega^2}\)</td><td>\(s = -a \pm j\omega\)</td></tr>
    <tr><td>\(\dfrac{df}{dt}\)</td><td>\(sF(s) - f(0^-)\)</td><td></td></tr>
    <tr><td>\(\int_0^t f\,d\tau\)</td><td>\(F(s)/s\)</td><td></td></tr>
  </table></div>
  <h2>극점이 말해 주는 것</h2>
  <ul>
    <li>극점의 실수부 \(\sigma\)는 감쇠(음수) 또는 발산(양수)의 빠르기입니다.</li>
    <li>극점의 허수부 \(\omega\)는 진동 주파수입니다.</li>
    <li>모든 극점이 왼쪽 반평면에 있으면 시스템이 안정합니다.</li>
  </ul>
  <h2>s-영역 회로</h2>
  <div class="math">\[ \mathbf Z_R = R, \qquad \mathbf Z_L = sL \;(\text{초기 전류 } -Li(0^-)), \qquad \mathbf Z_C = \frac{1}{sC} \;(\text{초기 전압 } v(0^-)/s) \]</div>
  <div class="note v">8장의 2차 회로 특성 방정식은 \(s\)-영역 회로에서 바로 나오는 분모 다항식입니다. 초기 조건이 소스로 들어가므로 과도 응답과 정상 응답을 한 번에 구할 수 있습니다.</div>
</div>
</template>

<!-- ───────────── 16장 ───────────── -->
<template id="tpl-ch16">
<div class="wrap">
  <div class="eyebrow">16장 · 고급 해석</div>
  <h1>푸리에 급수</h1>
  <p class="lede">주기 신호는 기본 주파수와 그 정수배 주파수를 가진 사인파들의 합으로 나타낼 수 있습니다. 회로는 각 사인파를 따로 처리하므로, 앞에서 배운 페이저 해석을 그대로 쓸 수 있습니다.</p>

  <div class="lab" data-demo="fourier" id="lab-fs">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 16-1</span><h3>고조파를 더해 파형 만들기</h3></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="목표 파형"><button data-wave="sq" aria-pressed="true">구형파</button><button data-wave="tri" aria-pressed="false">삼각파</button><button data-wave="saw" aria-pressed="false">톱니파</button></div>
        <button class="btn primary" data-act="build">하나씩 더하기</button>
      </div>
    </div>
    <div class="legend"><span><i style="background:var(--rule)"></i>목표 파형</span><span><i style="background:var(--volt)"></i>부분합</span><span><i style="background:var(--amp)"></i>마지막으로 더한 고조파</span></div>
    <canvas class="stage" data-role="w" style="height:260px"></canvas>
    <canvas class="stage" data-role="sp" style="height:150px;border-top:1px solid var(--rule)"></canvas>
    <div class="lab-body"><div class="controls" id="fs-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>삼각 푸리에 급수</h2>
  <div class="math">\[ f(t) = a_0 + \sum_{n=1}^{\infty}\left(a_n\cos n\omega_0t + b_n\sin n\omega_0t\right), \qquad \omega_0 = \frac{2\pi}{T} \]</div>
  <div class="math">\[ a_0 = \frac1T\int_0^T f\,dt, \qquad a_n = \frac2T\int_0^T f\cos n\omega_0t\,dt, \qquad b_n = \frac2T\int_0^T f\sin n\omega_0t\,dt \]</div>
  <h2>대칭성</h2>
  <ul>
    <li>짝함수 \(f(-t) = f(t)\): \(b_n = 0\), 코사인 항만 남습니다.</li>
    <li>홀함수 \(f(-t) = -f(t)\): \(a_n = 0\), 사인 항만 남습니다.</li>
    <li>반파 대칭 \(f(t - T/2) = -f(t)\): 홀수차 고조파만 남습니다. 구형파와 삼각파가 여기에 해당합니다.</li>
  </ul>
  <div class="math">\[ \text{구형파: } \frac4\pi\sum_{n\,\text{홀수}}\frac{\sin n\omega_0t}{n}, \qquad \text{삼각파: } \frac{8}{\pi^2}\sum_{n\,\text{홀수}}\frac{(-1)^{(n-1)/2}}{n^2}\sin n\omega_0t \]</div>
  <p>구형파 계수는 \(1/n\), 삼각파 계수는 \(1/n^2\)으로 줄어듭니다. 그래서 삼각파는 고조파 몇 개만으로도 거의 똑같아지지만, 구형파는 모서리 근처에 약 9%의 튀어 오름(깁스 현상)이 끝까지 남습니다.</p>
  <h2>회로에 적용하기</h2>
  <p>입력을 고조파로 나누고, 각 주파수 \(n\omega_0\)에서 페이저로 응답을 구한 뒤 시간 영역에서 더합니다. 평균 전력은 각 고조파 전력의 합입니다.</p>
  <div class="math">\[ P = V_{dc}I_{dc} + \sum_{n=1}^{\infty}\tfrac12 V_nI_n\cos(\theta_n - \phi_n) \]</div>
</div>
</template>

<!-- ───────────── 17장 ───────────── -->
<template id="tpl-ch17">
<div class="wrap">
  <div class="eyebrow">17장 · 고급 해석</div>
  <h1>2포트 회로</h1>
  <p class="lede">회로 내부를 몰라도 두 쌍의 단자에서 측정한 전압과 전류의 관계만 알면 그 회로를 쓸 수 있습니다. 그 관계를 나타내는 네 개의 숫자가 2포트 파라미터입니다.</p>

  <div class="lab" data-demo="twoport" id="lab-2p">
    <div class="lab-head">
      <div><span class="eyebrow">시각화 17-1</span><h3>T형 회로의 z 파라미터 측정</h3></div>
      <div class="seg" role="group" aria-label="측정 조건"><button data-mode="p1" aria-pressed="true">포트 1에 전류, 포트 2 개방</button><button data-mode="p2" aria-pressed="false">포트 2에 전류, 포트 1 개방</button></div>
    </div>
    <canvas class="stage" style="height:270px"></canvas>
    <div class="lab-body"><div class="controls" id="tp-ctl"></div><div class="readout"></div></div>
  </div>

  <h2>임피던스(z) 파라미터</h2>
  <div class="math">\[ \begin{bmatrix}V_1\\V_2\end{bmatrix} = \begin{bmatrix}z_{11}&z_{12}\\z_{21}&z_{22}\end{bmatrix}\begin{bmatrix}I_1\\I_2\end{bmatrix}, \qquad z_{11} = \left.\frac{V_1}{I_1}\right|_{I_2=0}, \quad z_{21} = \left.\frac{V_2}{I_1}\right|_{I_2=0} \]</div>
  <p>한쪽 포트를 개방하고(\(I = 0\)) 다른 쪽에 전류를 넣은 뒤 양쪽 전압을 재면 z 파라미터 두 개가 나옵니다. 위 시각화에서 개방된 쪽의 직렬 저항에는 전류가 흐르지 않으므로 그 포트의 전압은 가운데 저항 \(R_c\)의 전압과 같습니다.</p>
  <div class="math">\[ \text{T형 회로: } \mathbf z = \begin{bmatrix} R_a + R_c & R_c \\ R_c & R_b + R_c \end{bmatrix} \]</div>
  <h2>다른 파라미터</h2>
  <div class="tscroll"><table class="t">
    <tr><th>이름</th><th>식</th><th>측정 조건</th></tr>
    <tr><td>어드미턴스 y</td><td>\(\mathbf I = \mathbf y\,\mathbf V\), \(\mathbf y = \mathbf z^{-1}\)</td><td>반대 포트 단락</td></tr>
    <tr><td>하이브리드 h</td><td>\(V_1 = h_{11}I_1 + h_{12}V_2\), \(I_2 = h_{21}I_1 + h_{22}V_2\)</td><td>트랜지스터 모델</td></tr>
    <tr><td>전송 ABCD</td><td>\(V_1 = AV_2 - BI_2\), \(I_1 = CV_2 - DI_2\)</td><td>종속 연결 시 행렬 곱</td></tr>
  </table></div>
  <div class="note v">수동 소자만 있는 회로는 상반성을 가집니다: \(z_{12} = z_{21}\), \(y_{12} = y_{21}\), \(AD - BC = 1\).</div>
  <h2>연결</h2>
  <p>직렬 연결은 z 행렬을 더하고, 병렬 연결은 y 행렬을 더하고, 종속 연결은 ABCD 행렬을 곱합니다.</p>

const TAU=Math.PI*2;

function hexRgb(h){h=(h||'').trim();if(h[0]!=='#')return[128,128,128];if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));const A=hexRgb(a),B=hexRgb(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
function si(x,unit,d=3){
  if(!isFinite(x))return'∞ '+unit;if(Math.abs(x)<1e-15)return'0 '+unit;
  const P=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  const a=Math.abs(x);let m=1,p='';for(const[q,s]of P){if(a>=q*0.9995){m=q;p=s;break;}m=q;p=s;}
  let s=(x/m).toPrecision(d);if(s.includes('e'))s=String(+s);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s+' '+p+unit;
}
function fit(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;const W=Math.round(w*dpr),H=Math.round(h*dpr);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return{ctx,w,h};}
function polyPath(pts){const segs=[];let L=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,l,s0:L});L+=l;}
  return{L,at(s){s=((s%L)+L)%L;for(const g of segs){if(s<=g.s0+g.l){const u=g.l?(s-g.s0)/g.l:0;return[g.a[0]+(g.b[0]-g.a[0])*u,g.a[1]+(g.b[1]-g.a[1])*u];}}return pts[0];}};}
function line(ctx,pts,color,w=3,dash){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();}
function text(ctx,s,x,y,color,align='center',size=12,base='middle'){ctx.save();ctx.fillStyle=color;ctx.font=size+'px '+T.mono;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y);ctx.restore();}
function arrow(ctx,x1,y1,x2,y2,color,w=2,head=8){const a=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1);ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
  const hh=Math.min(head,len*0.45);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*hh*0.8,y2-Math.sin(a)*hh*0.8);ctx.stroke();
  if(len>2){ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hh*Math.cos(a-0.4),y2-hh*Math.sin(a-0.4));ctx.lineTo(x2-hh*Math.cos(a+0.4),y2-hh*Math.sin(a+0.4));ctx.closePath();ctx.fill();}ctx.restore();}
function at(ctx,cx,cy,vertical,fn){ctx.save();ctx.translate(cx,cy);if(vertical)ctx.rotate(Math.PI/2);fn(ctx);ctx.restore();}
function resistor(ctx,len,c1,c2){ctx.fillStyle=T.panel;ctx.fillRect(-len/2,-12,len,24);const n=6,a=8,x0=-len/2+8,x1=len/2-8;
  const g=ctx.createLinearGradient(-len/2,0,len/2,0);g.addColorStop(0,c1);g.addColorStop(1,c2||c1);ctx.strokeStyle=g;ctx.lineWidth=2.5;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-len/2,0);ctx.lineTo(x0,0);for(let i=0;i<n;i++)ctx.lineTo(x0+(x1-x0)*(i+0.5)/n,i%2?a:-a);ctx.lineTo(x1,0);ctx.lineTo(len/2,0);ctx.stroke();}
function inductor(ctx,len,color){ctx.fillStyle=T.panel;ctx.fillRect(-len/2,-14,len,28);const n=4,r=(len-8)/(2*n);ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-len/2,0);ctx.lineTo(-len/2+4,0);
  for(let i=0;i<n;i++){const x=-len/2+4+r+i*2*r;ctx.arc(x,0,r,Math.PI,0,false);}ctx.lineTo(len/2,0);ctx.stroke();}
function source(ctx,cx,cy,r,kind,color){ctx.save();ctx.fillStyle=T.panel;ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();ctx.stroke();
  if(kind==='ac'){ctx.beginPath();for(let i=0;i<=24;i++){const x=cx-r*0.6+i*(r*1.2/24),y=cy-Math.sin(i/24*TAU)*r*0.35;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
  else{text(ctx,'+',cx,cy-r*0.42,color,'center',15);text(ctx,'−',cx,cy+r*0.42,color,'center',15);}ctx.restore();}
function dots(ctx,path,phase,N,color,r=2.6){ctx.fillStyle=color;if(N<1)return;for(let i=0;i<N;i++){const p=path.at(phase+i*path.L/N);ctx.beginPath();ctx.arc(p[0],p[1],r,0,TAU);ctx.fill();}}

/* 슬라이더 + 숫자 입력 */
function makeControls(box,specs,onChange){
  const v={},set={},rows={};
  for(const sp of specs){
    const id=box.id+'-'+sp.key,row=document.createElement('div');row.className='ctl';rows[sp.key]=row;
    row.innerHTML=`<label for="${id}">${sp.label}</label><input type="range" id="${id}" min="0" max="1000" step="1"><span class="num"><input type="number" id="${id}-n" step="any" aria-label="${sp.key} 값 입력"><span class="unit">${sp.unit}</span></span>`;
    box.appendChild(row);
    const r=row.querySelector('input[type=range]'),n=row.querySelector('input[type=number]'),sc=sp.scale||1;
    const toPos=x=>sp.log?1000*Math.log(x/sp.min)/Math.log(sp.max/sp.min):1000*(x-sp.min)/(sp.max-sp.min);
    const fromPos=p=>sp.log?sp.min*Math.pow(sp.max/sp.min,p/1000):sp.min+(sp.max-sp.min)*p/1000;
    const s=(x,src)=>{x=Math.min(sp.max,Math.max(sp.min,x));v[sp.key]=x;if(src!=='r')r.value=toPos(x);if(src!=='n')n.value=+(x/sc).toPrecision(3);onChange&&onChange();};
    r.addEventListener('input',()=>{let x=fromPos(+r.value);x=sp.step?Math.round(x/sp.step)*sp.step:+x.toPrecision(2);s(x,'r');});
    n.addEventListener('change',()=>{const x=parseFloat(n.value)*sc;if(isFinite(x))s(x,'n');else n.value=+(v[sp.key]/sc).toPrecision(3);});
    set[sp.key]=x=>s(x);v[sp.key]=sp.value;r.value=toPos(sp.value);n.value=+(sp.value/sc).toPrecision(3);
  }
  return{v,set,rows};
}

    {key:'R2',label:'저항 R<sub>2</sub>',min:10,max:1000,log:true,value:220,unit:'Ω'}],update);
  pressGroup(root,'data-mode',m=>{mode=m;update();});
  function update(){
    const{V,R1,R2}=c.v;
    if(mode==='series'){const I=V/(R1+R2);st={I,V1:I*R1,V2:I*R2};
      out.innerHTML=`<span class="row"><span class="k">전류</span> I = V<sub>s</sub>/(R<sub>1</sub>+R<sub>2</sub>) = ${si(V,'V')} / ${si(R1+R2,'Ω')} = <b class="ii">${si(I,'A')}</b></span>
      <span class="row"><span class="k">전압 강하</span> V<sub>1</sub> = I·R<sub>1</sub> = <b class="vv">${si(st.V1,'V')}</b></span>
      <span class="row"><span class="k">전압 강하</span> V<sub>2</sub> = I·R<sub>2</sub> = <b class="vv">${si(st.V2,'V')}</b></span>
      <span class="row"><span class="k">KVL</span> −${si(V,'V')} + ${si(st.V1,'V')} + ${si(st.V2,'V')} = <b>0</b></span>
      <span class="row"><span class="k">전력</span> P = V<sub>s</sub>·I = ${si(V*I,'W')} = P<sub>1</sub> + P<sub>2</sub></span>`;
      const f=V>0?st.V1/V:R1/(R1+R2);
      bal.innerHTML=`<div class="bal-col"><div class="bal-bar"><div class="s" style="flex:1;background:var(--volt)">V<sub>s</sub></div></div>전원이<br>올린 전압</div><div class="bal-eq">=</div>
      <div class="bal-col"><div class="bal-bar"><div class="s" style="flex:${f};background:var(--c-r)">V<sub>1</sub></div><div class="s" style="flex:${1-f};background:var(--muted)">V<sub>2</sub></div></div>저항에서<br>내려간 전압</div>`;
    }else{const I1=V/R1,I2=V/R2;st={I1,I2,I:I1+I2,Req:R1*R2/(R1+R2)};
      out.innerHTML=`<span class="row"><span class="k">가지 전류</span> I<sub>1</sub> = V<sub>s</sub>/R<sub>1</sub> = <b class="ii">${si(I1,'A')}</b></span>
      <span class="row"><span class="k">가지 전류</span> I<sub>2</sub> = V<sub>s</sub>/R<sub>2</sub> = <b class="ii">${si(I2,'A')}</b></span>
      <span class="row"><span class="k">KCL</span> I = I<sub>1</sub> + I<sub>2</sub> = <b class="ii">${si(st.I,'A')}</b></span>
      <span class="row"><span class="k">등가 저항</span> R<sub>eq</sub> = R<sub>1</sub>R<sub>2</sub>/(R<sub>1</sub>+R<sub>2</sub>) = <b>${si(st.Req,'Ω')}</b></span>
      <span class="row"><span class="k">확인</span> V<sub>s</sub>/R<sub>eq</sub> = ${si(V/st.Req,'A')}</span>`;
      const f=(1/R1)/(1/R1+1/R2);
      bal.innerHTML=`<div class="bal-col"><div class="bal-bar"><div class="s" style="flex:1;background:var(--amp)">I</div></div>마디로<br>들어온 전류</div><div class="bal-eq">=</div>
      <div class="bal-col"><div class="bal-bar"><div class="s" style="flex:${f};background:var(--c-r)">I<sub>1</sub></div><div class="s" style="flex:${1-f};background:var(--muted)">I<sub>2</sub></div></div>마디에서<br>나간 전류</div>`;
    }
  }
  update();
  return{frame(dt){
    const{ctx,w,h}=fit(cv);const{V,R1,R2}=c.v;
    const a=Math.max(70,w*0.12),b=w-Math.max(80,w*0.14),t=48,bt=h-44,my=(t+bt)/2,r=22,len=Math.min(84,(bt-t)*0.42);
    const pot=x=>mix(T.low,T.volt,V>0?0.1+0.9*x/V:0.1);
    const I=mode==='series'?st.I:st.I,speed=Math.min(380,1500*I);
    if(!reduceMotion)phase+=speed*dt;
    if(mode==='series'){
      const xR=(a+b)/2,cA=pot(V),cB=pot(V-st.V1),c0=pot(0);
      line(ctx,[[a,my-r],[a,t],[xR-len/2,t]],cA,4);line(ctx,[[xR+len/2,t],[b,t],[b,my-len/2]],cB,4);line(ctx,[[b,my+len/2],[b,bt],[a,bt],[a,my+r]],c0,4);
      const P=polyPath([[a,my],[a,t],[b,t],[b,bt],[a,bt]]);dots(ctx,P,phase,Math.floor(P.L/24),T.amp);
      at(ctx,xR,t,false,k=>resistor(k,len,cA,cB));at(ctx,b,my,true,k=>resistor(k,len,cB,c0));source(ctx,a,my,r,'dc',T.ink);
      text(ctx,'R₁ = '+si(R1,'Ω'),xR,t-20,T.ink);text(ctx,'V₁ = '+si(st.V1,'V'),xR,t+26,T.volt);
      text(ctx,'R₂ = '+si(R2,'Ω'),b+14,my-10,T.ink,'left',12);text(ctx,'V₂ = '+si(st.V2,'V'),b-16,my,T.volt,'right');
      text(ctx,'Vs',a-r-10,my-8,T.ink,'right');text(ctx,si(V,'V'),a-r-10,my+9,T.ink,'right');
      text(ctx,'● '+si(V,'V'),a+6,t-14,cA,'left',11);text(ctx,'● '+si(V-st.V1,'V'),b-6,t-14,cB,'right',11);text(ctx,'● 0 V (기준)',(a+b)/2,bt+16,T.muted,'center',11);
      const ax=a+(xR-len/2-a)*0.35;arrow(ctx,ax,t+16,ax+30,t+16,T.amp,2);text(ctx,'I = '+si(I,'A'),ax,t+32,T.amp,'left',12);
    }else{
      const x1=a+(b-a)*0.52,cA=pot(V),c0=pot(0);
      line(ctx,[[a,my-r],[a,t],[b,t],[b,my-len/2]],cA,4);line(ctx,[[x1,t],[x1,my-len/2]],cA,4);
      line(ctx,[[b,my+len/2],[b,bt],[a,bt],[a,my+r]],c0,4);line(ctx,[[x1,my+len/2],[x1,bt]],c0,4);
      const P1=polyPath([[a,my],[a,t],[x1,t],[x1,bt],[a,bt]]),P2=polyPath([[a,my],[a,t],[b,t],[b,bt],[a,bt]]);
      const g1=1/R1,g2=1/R2,f1=g1/(g1+g2);
      dots(ctx,P1,phase,Math.max(1,Math.round(P1.L/22*f1)),T.amp);dots(ctx,P2,phase+11,Math.max(1,Math.round(P2.L/22*(1-f1))),T.amp);
      at(ctx,x1,my,true,k=>resistor(k,len,cA,c0));at(ctx,b,my,true,k=>resistor(k,len,cA,c0));source(ctx,a,my,r,'dc',T.ink);
      ctx.fillStyle=T.ink;ctx.beginPath();ctx.arc(x1,t,4.5,0,TAU);ctx.arc(x1,bt,4.5,0,TAU);ctx.fill();
      text(ctx,'R₁',x1+14,my-8,T.ink,'left');text(ctx,si(R1,'Ω'),x1+14,my+8,T.muted,'left',11);
      text(ctx,'R₂',b+14,my-8,T.ink,'left');text(ctx,si(R2,'Ω'),b+14,my+8,T.muted,'left',11);
      text(ctx,'Vs',a-r-10,my-8,T.ink,'right');text(ctx,si(V,'V'),a-r-10,my+9,T.ink,'right');
      arrow(ctx,x1-14,my-len/2-26,x1-14,my-len/2-4,T.amp,2);text(ctx,'I₁ '+si(st.I1,'A'),x1-18,my-len/2-16,T.amp,'right',11);
      arrow(ctx,b-14,my-len/2-26,b-14,my-len/2-4,T.amp,2);text(ctx,'I₂ '+si(st.I2,'A'),b-18,my-len/2-16,T.amp,'right',11);
      arrow(ctx,a+12,t+16,a+40,t+16,T.amp,2);text(ctx,'I = '+si(st.I,'A'),a+12,t+32,T.amp,'left',11);
      text(ctx,'마디: I = I₁ + I₂',x1,t-18,T.ink,'center',12);
      text(ctx,'● '+si(V,'V'),b,t-18,cA,'right',11);text(ctx,'● 0 V (기준)',(a+x1)/2,bt+16,T.muted,'center',11);
    }
  }};
}

/* ───────── 시각화 7-1: RC/RL 과도 응답 ───────── */
function initTransient(root){
  const cvC=root.querySelector('[data-role=circuit]'),cvP=root.querySelector('[data-role=plot]'),out=root.querySelector('.readout');
  let kind='RC',tn=-0.8,playing=!reduceMotion,speed=1,phase=0,cur={};
  const c=makeControls(root.querySelector('.controls'),[
    {key:'V',label:'전원 전압 V<sub>s</sub>',min:1,max:24,step:0.5,value:10,unit:'V'},
    {key:'R',label:'저항 R',min:10,max:100000,log:true,value:1000,unit:'Ω'},
    {key:'C',label:'커패시턴스 C',min:1e-7,max:1e-3,log:true,value:1e-4,scale:1e-6,unit:'µF'},
    {key:'L',label:'인덕턴스 L',min:1e-3,max:10,log:true,value:0.5,scale:1e-3,unit:'mH'}],()=>{});
  const setKind=k=>{kind=k;c.rows.C.hidden=k!=='RC';c.rows.L.hidden=k!=='RL';root.querySelector('[data-role=vlabel]').innerHTML=k==='RC'?'커패시터 전압 v<sub>C</sub>(t)':'인덕터 전압 v<sub>L</sub>(t)';tn=-0.8;};
  setKind('RC');
  pressGroup(root,'data-kind',setKind);
  pressGroup(root,'data-speed',s=>speed=+s);
  const pb=root.querySelector('[data-act=pause]');pb.textContent=playing?'일시정지':'재생';
  pb.addEventListener('click',()=>{playing=!playing;pb.textContent=playing?'일시정지':'재생';});
  root.querySelector('[data-act=restart]').addEventListener('click',()=>{tn=-0.8;playing=true;pb.textContent='일시정지';});
  if(reduceMotion)tn=1;
  function vals(x){const{V,R}=c.v,I0=V/R;if(x<0)return{v:0,i:0,fv:0,fi:0};const e=Math.exp(-x);
    return kind==='RC'?{v:V*(1-e),i:I0*e,fv:1-e,fi:e}:{v:V*e,i:I0*(1-e),fv:e,fi:1-e};}
  return{frame(dt){
    if(playing){tn+=dt*speed;if(tn>6){tn=6;}}
    const{V,R,C,L}=c.v,I0=V/R,tau=kind==='RC'?R*C:L/R,s=vals(tn);
    /* 회로 */
    let{ctx,w,h}=fit(cvC);
    const a=Math.max(64,w*0.11),b=w-Math.max(90,w*0.16),t=44,bt=h-40,my=(t+bt)/2,r=22,xs=a+(b-a)*0.26,xR=a+(b-a)*0.64,len=Math.min(80,(b-a)*0.26),closed=tn>=0;
    const pot=x=>mix(T.low,T.volt,0.1+0.9*x/V);
    const nodeTop=pot(V),nodeMid=closed?pot(V):T.low,nodeOut=kind==='RC'?pot(s.v):pot(s.v),c0=pot(0);
    line(ctx,[[a,my-r],[a,t],[xs-20,t]],nodeTop,4);line(ctx,[[xs+20,t],[xR-len/2,t]],nodeMid,4);line(ctx,[[xR+len/2,t],[b,t],[b,my-30]],nodeOut,4);line(ctx,[[b,my+30],[b,bt],[a,bt],[a,my+r]],c0,4);
    if(!reduceMotion)phase+=Math.min(300,220*(I0>0?s.i/I0:0))*dt;
    if(closed){const P=polyPath([[a,my],[a,t],[b,t],[b,bt],[a,bt]]);dots(ctx,P,phase,Math.floor(P.L/24),T.amp);}
    // 스위치
    ctx.fillStyle=T.panel;ctx.fillRect(xs-22,t-30,44,40);ctx.fillStyle=T.ink;ctx.beginPath();ctx.arc(xs-18,t,3.5,0,TAU);ctx.arc(xs+18,t,3.5,0,TAU);ctx.fill();
    line(ctx,[[xs-18,t],closed?[xs+18,t]:[xs+14,t-20]],T.ink,2.5);text(ctx,closed?'t ≥ 0 닫힘':'t < 0 열림',xs,t-26,T.muted,'center',11);
    at(ctx,xR,t,false,k=>resistor(k,len,nodeMid,nodeOut));text(ctx,'R = '+si(R,'Ω'),xR,t-22,T.ink);
    source(ctx,a,my,r,'dc',T.ink);text(ctx,'Vs',a-r-10,my-8,T.ink,'right');text(ctx,si(V,'V'),a-r-10,my+9,T.ink,'right');
    if(kind==='RC'){
      ctx.fillStyle=T.panel;ctx.fillRect(b-24,my-30,48,60);
      line(ctx,[[b,my-30],[b,my-6]],nodeOut,4);line(ctx,[[b,my+6],[b,my+30]],c0,4);
      line(ctx,[[b-20,my-6],[b+20,my-6]],T.ink,3);line(ctx,[[b-20,my+6],[b+20,my+6]],T.ink,3);
      const n=Math.round(6*s.v/Math.max(V,1e-9));
      for(let i=0;i<n;i++){const x=b-17+i*(34/5);text(ctx,'+',x,my-15,T.volt,'center',12);text(ctx,'−',x,my+16,T.muted,'center',12);}
      ctx.save();ctx.globalAlpha=Math.min(1,s.v/Math.max(V,1e-9));for(let i=0;i<4;i++)line(ctx,[[b-13+i*8.7,my-3],[b-13+i*8.7,my+3]],T.volt,1.2);ctx.restore();
      text(ctx,'C = '+si(C,'F'),b+30,my-10,T.ink,'left');text(ctx,'v꜀ = '+si(s.v,'V'),b+30,my+8,T.volt,'left');
    }else{
      const f=I0>0?s.i/I0:0;ctx.save();for(let k=0;k<3;k++){ctx.globalAlpha=f*(0.75-k*0.2);ctx.strokeStyle=T['c-l'];ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(b,my,16+k*9,36+k*8,0,0,TAU);ctx.stroke();}ctx.restore();
      at(ctx,b,my,true,k=>inductor(k,60,T.ink));
      text(ctx,'L = '+si(L,'H'),b+44,my-10,T.ink,'left');text(ctx,'v_L = '+si(s.v,'V'),b+44,my+8,T.volt,'left');
    }
    text(ctx,'i = '+si(s.i,'A'),a+10,bt-14,T.amp,'left',12);
    /* 그래프 */
    ({ctx,w,h}=fit(cvP));
    const L0=52,R0=w-58,T0=16,B0=h-30,X=x=>L0+(R0-L0)*x/6,Y=f=>B0-(B0-T0)*f;
    ctx.strokeStyle=T.grid;ctx.lineWidth=1;
    for(let k=0;k<=6;k++){ctx.beginPath();ctx.setLineDash(k?[3,4]:[]);ctx.moveTo(X(k),T0);ctx.lineTo(X(k),B0);ctx.stroke();text(ctx,k?k+'τ':'0',X(k),B0+14,T.muted,'center',11);}
    ctx.setLineDash([]);line(ctx,[[L0,B0],[R0,B0]],T.rule,1);line(ctx,[[L0,T0],[R0,T0]],T.grid,1);
    text(ctx,si(V,'V'),L0-6,Y(1),T.volt,'right',11);text(ctx,'0',L0-6,Y(0),T.volt,'right',11);
    text(ctx,si(I0,'A'),R0+6,Y(1),T.amp,'left',11);text(ctx,'0',R0+6,Y(0),T.amp,'left',11);
    const rising=kind==='RC'?'fv':'fi';line(ctx,[[X(0),Y(0.632)],[X(1),Y(0.632)],[X(1),B0]],T.muted,1,[4,3]);text(ctx,'63.2%',X(1)+4,Y(0.632)-9,T.muted,'left',11);
    for(const[key,col]of[['fv',T.volt],['fi',T.amp]]){
      const pts=[];for(let k=0;k<=240;k++){const x=6*k/240;pts.push([X(x),Y(vals(x)[key])]);}
      ctx.save();ctx.globalAlpha=0.22;line(ctx,pts,col,2);ctx.restore();
      if(tn>0){const p2=[];const m=Math.ceil(240*tn/6);for(let k=0;k<=m;k++){const x=Math.min(tn,6*k/240);p2.push([X(x),Y(vals(x)[key])]);}line(ctx,p2,col,2.6);}
    }
    if(tn>=0){line(ctx,[[X(tn),T0],[X(tn),B0]],T.ink,1);for(const[key,col]of[['fv',T.volt],['fi',T.amp]]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(tn),Y(s[key]),4.5,0,TAU);ctx.fill();}}
    /* 수치 */
    const tt=Math.max(0,tn),key=kind==='RC'?['v<sub>C</sub>','충전 정도',s.fv]:['i<sub>L</sub>','전류 도달',s.fi];
    const k2=tt.toFixed(2)+'τ';
    if(cur.k!==k2+kind+V+R+C+L){cur.k=k2+kind+V+R+C+L;
      out.innerHTML=`<span class="row"><span class="k">시정수</span> τ = ${kind==='RC'?'RC = '+si(R,'Ω')+' × '+si(C,'F'):'L/R = '+si(L,'H')+' / '+si(R,'Ω')} = <b>${si(tau,'s')}</b></span>
      <span class="row"><span class="k">경과 시간</span> t = ${k2} = <b>${si(tt*tau,'s')}</b></span>
      <span class="row"><span class="k">전압</span> ${kind==='RC'?'v<sub>C</sub>':'v<sub>L</sub>'}(t) = <b class="vv">${si(s.v,'V')}</b></span>
      <span class="row"><span class="k">전류</span> i(t) = <b class="ii">${si(s.i,'A')}</b> <span class="k">(최대 ${si(I0,'A')})</span></span>
      <span class="row"><span class="k">${key[1]}</span> <b>${(key[2]*100).toFixed(1)}%</b> <span class="k">of 최종값</span></span>
      <span class="row"><span class="k">화면 1초 = 1τ = ${si(tau,'s')} (×${speed})</span></span>`;}
  }};
}

/* ───────── 시각화 9-1: 도선 위 코사인파 + 페이저 ───────── */
function initWave(root){
  const cv=root.querySelector('canvas'),out=root.querySelector('.readout');
  let t=0,playing=!reduceMotion,last='';
  const c=makeControls(root.querySelector('.controls'),[
    {key:'Vm',label:'진폭 V<sub>m</sub>',min:1,max:10,step:0.5,value:6,unit:'V'},
    {key:'f',label:'주파수 f (화면에서 보기 좋게 느리게)',min:0.05,max:1.5,step:0.05,value:0.3,unit:'Hz'},
    {key:'ph',label:'위상 φ',min:-180,max:180,step:5,value:0,unit:'°'},
    {key:'ratio',label:'도선 길이 / 파장 (0이면 집중 정수 회로)',min:0,max:3,step:0.05,value:1.5,unit:'λ'}],()=>{});
  const pb=root.querySelector('[data-act=pause]');pb.textContent=playing?'일시정지':'재생';
  pb.addEventListener('click',()=>{playing=!playing;pb.textContent=playing?'일시정지':'재생';});
  return{frame(dt){
    if(playing)t+=dt;
    const{Vm,f,ph,ratio}=c.v,phi=ph*Math.PI/180,th=TAU*f*t+phi,val=Vm*Math.cos(th);
    const{ctx,w,h}=fit(cv);
    const maxR=Math.min(h/2-34,w*0.17),cx=maxR+38,cy=h/2,x0=cx+maxR+34,x1=w-22,A=Vm/10*maxR,k=TAU*ratio/Math.max(1,x1-x0);
    // 회전된 복소평면: Re 위, Im 왼쪽
    arrow(ctx,cx,cy+maxR+10,cx,cy-maxR-14,T.rule,1.2,7);arrow(ctx,cx+maxR+10,cy,cx-maxR-14,cy,T.rule,1.2,7);
    text(ctx,'Re',cx+12,cy-maxR-12,T.muted,'left',11);text(ctx,'Im',cx-maxR-12,cy-12,T.muted,'center',11);
    ctx.strokeStyle=T.grid;ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,maxR,0,TAU);ctx.stroke();
    ctx.strokeStyle=T['volt-soft'];ctx.lineWidth=6;ctx.beginPath();ctx.arc(cx,cy,A,0,TAU);ctx.stroke();
    const tx=cx-A*Math.sin(th),ty=cy-A*Math.cos(th);
    // 각도 호
    ctx.strokeStyle=T.muted;ctx.lineWidth=1;ctx.beginPath();const ang=((th%TAU)+TAU)%TAU;ctx.arc(cx,cy,16,-Math.PI/2,-Math.PI/2-ang,true);ctx.stroke();
    line(ctx,[[tx,ty],[x0,ty]],T.muted,1,[4,4]);
    ctx.fillStyle=T.volt;ctx.beginPath();ctx.arc(cx,ty,3.5,0,TAU);ctx.fill();
    arrow(ctx,cx,cy,tx,ty,T.volt,3,11);
    text(ctx,'V = '+Vm+'∠'+ph+'°',cx,cy+maxR+24,T.volt,'center',11);
    // 도선 위 파형
    const pts=[];for(let x=x0;x<=x1;x+=2)pts.push([x,cy-A*Math.cos(th-k*(x-x0))]);
    ctx.save();ctx.fillStyle=T['volt-soft'];ctx.beginPath();ctx.moveTo(x0,cy);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(x1,cy);ctx.closePath();ctx.fill();ctx.restore();
    line(ctx,[[x0,cy],[x1,cy]],T.ink,3);
    // 몇 지점의 막대(그 자리의 순간 전압)
    for(let i=1;i<=5;i++){const x=x0+(x1-x0)*i/6,y=cy-A*Math.cos(th-k*(x-x0));line(ctx,[[x,cy],[x,y]],T.volt,1.2);ctx.fillStyle=T.volt;ctx.beginPath();ctx.arc(x,y,2.6,0,TAU);ctx.fill();}
    line(ctx,pts,T.volt,2.6);
    ctx.fillStyle=T.ink;ctx.beginPath();ctx.arc(x0,cy,5,0,TAU);ctx.fill();

function openPath(pts){const segs=[];let L=0;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,l,s0:L});L+=l;}
  return{L,at(s){for(const g of segs){if(s<=g.s0+g.l){const u=g.l?(s-g.s0)/g.l:0;return[g.a[0]+(g.b[0]-g.a[0])*u,g.a[1]+(g.b[1]-g.a[1])*u];}}return pts[pts.length-1];}};}
function flow(ctx,pts,ph,color,sp=22){const P=openPath(pts),s0=((ph%sp)+sp)%sp;ctx.fillStyle=color;for(let s=s0;s<=P.L;s+=sp){const p=P.at(s);ctx.beginPath();ctx.arc(p[0],p[1],2.6,0,TAU);ctx.fill();}}

const C_={mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],div:(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return[(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];},add:(a,b)=>[a[0]+b[0],a[1]+b[1]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],abs:a=>Math.hypot(a[0],a[1]),arg:a=>Math.atan2(a[1],a[0]),rot:(a,t)=>[a[0]*Math.cos(t)-a[1]*Math.sin(t),a[0]*Math.sin(t)+a[1]*Math.cos(t)]};

/* ───────── 16장: 푸리에 급수 ───────── */
function initFourier(root){
  const cw=root.querySelector('[data-role=w]'),csp=root.querySelector('[data-role=sp]'),out=root.querySelector('.readout');let wave='sq',u=0,build=false,acc=0,last='';
  const c=makeControls(root.querySelector('.controls'),[{key:'N',label:'최고 고조파 차수 N',min:1,max:49,step:1,value:5,unit:'차'}],()=>{});
  pressGroup(root,'data-wave',x=>wave=x);
  const bb=root.querySelector('[data-act=build]');bb.addEventListener('click',()=>{build=!build;if(build){c.set.N(1);acc=0;}bb.textContent=build?'멈춤':'하나씩 더하기';});
  const coef=n=>wave==='sq'?(n%2?4/(n*Math.PI):0):wave==='tri'?(n%2?8/(Math.PI*Math.PI*n*n)*((n-1)/2%2?-1:1):0):2/Math.PI*(n%2?1:-1)/n;
  const target=x=>{x=((x%TAU)+TAU)%TAU;return wave==='sq'?(x<Math.PI?1:-1):wave==='tri'?(2/Math.PI)*Math.asin(Math.sin(x)):(x<Math.PI?x/Math.PI:x/Math.PI-2);};
  return{frame(dt){
    if(!reduceMotion)u+=dt*0.6;
    if(build){acc+=dt;if(acc>0.6){acc=0;let n=c.v.N+1;while(n<=49&&coef(n)===0)n++;if(n>49){build=false;bb.textContent='하나씩 더하기';}else c.set.N(n);}}
    const N=Math.round(c.v.N),S=x=>{let s=0;for(let n=1;n<=N;n++){const b=coef(n);if(b)s+=b*Math.sin(n*x);}return s;};let top=N;while(top>1&&coef(top)===0)top--;
    let{ctx,w,h}=fit(cw);
    {const L0=30,R0=w-12,T0=12,B0=h-14,mid=(T0+B0)/2,A=(B0-T0)/2/1.25,X=x=>L0+(R0-L0)*x/(2*TAU),Y=y=>mid-A*y,o=u;
     line(ctx,[[L0,mid],[R0,mid]],T.rule,1);text(ctx,'1',L0-4,Y(1),T.muted,'right',10);text(ctx,'−1',L0-4,Y(-1),T.muted,'right',10);
     line(ctx,[[L0,Y(1)],[R0,Y(1)]],T.grid,1);line(ctx,[[L0,Y(-1)],[R0,Y(-1)]],T.grid,1);
     plotFn(ctx,X,Y,x=>target(x+o),0,2*TAU,T.rule,3,800);plotFn(ctx,X,Y,x=>coef(top)*Math.sin(top*(x+o)),0,2*TAU,T.amp,1.4,800);plotFn(ctx,X,Y,x=>S(x+o),0,2*TAU,T.volt,2.4,800);}
    ({ctx,w,h}=fit(csp));
    {const L0=30,R0=w-12,T0=16,B0=h-22,bw=(R0-L0)/49,mx=Math.abs(coef(1));
     line(ctx,[[L0,B0],[R0,B0]],T.rule,1);text(ctx,'|bₙ|',L0,T0-6,T.muted,'left',10);
     for(let n=1;n<=49;n++){const b=Math.abs(coef(n));if(!b)continue;const hh=(B0-T0)*b/mx;ctx.fillStyle=n<=N?(n===top?T.amp:T.volt):T.rule;ctx.fillRect(L0+(n-1)*bw+bw*0.15,B0-hh,bw*0.7,hh);}
     for(const n of[1,5,10,20,30,40,49])text(ctx,String(n),L0+(n-0.5)*bw,B0+12,T.muted,'center',9);}
    const key=[wave,N].join();
    if(key!==last){last=key;let mx=0;for(let k=0;k<=2000;k++)mx=Math.max(mx,S(TAU*k/2000));let terms=0;for(let n=1;n<=N;n++)if(coef(n))terms++;
      out.innerHTML=`<span class="row"><span class="k">사용한 항</span> ${terms}개 (n = 1 … ${N})</span>
      <span class="row"><span class="k">계수</span> ${wave==='sq'?'bₙ = 4/(nπ), 홀수 n만':wave==='tri'?'bₙ = ±8/(π²n²), 홀수 n만':'bₙ = (−1)ⁿ⁺¹·2/(nπ), 모든 n'}</span>
      <span class="row"><span class="k">마지막 고조파</span> n = ${top}, 크기 <b class="ii">${Math.abs(coef(top)).toFixed(4)}</b> (기본파의 ${(100*Math.abs(coef(top)/coef(1))).toFixed(1)}%)</span>
      <span class="row"><span class="k">최댓값</span> 부분합의 최대 ${mx.toFixed(3)} ${wave!=='tri'&&N>=5?'(목표 1보다 튀어 오름: 깁스 현상)':''}</span>`;}
  }};
}

/* ───────── 17장: 2포트 ───────── */
function initTwoport(root){
  const cv=root.querySelector('canvas'),out=root.querySelector('.readout');let mode='p1',ph=0,last='';
  const c=makeControls(root.querySelector('.controls'),[
    {key:'Ra',label:'R<sub>a</sub> (포트 1 쪽 직렬)',min:10,max:1000,log:true,value:100,unit:'Ω'},
    {key:'Rb',label:'R<sub>b</sub> (포트 2 쪽 직렬)',min:10,max:1000,log:true,value:220,unit:'Ω'},
    {key:'Rc',label:'R<sub>c</sub> (가운데 병렬)',min:10,max:1000,log:true,value:330,unit:'Ω'},
    {key:'I',label:'넣는 전류',min:1e-3,max:0.1,step:1e-3,value:0.01,scale:1e-3,unit:'mA'}],()=>{});
  pressGroup(root,'data-mode',m=>mode=m);
  const mat=(m,u)=>`[${m[0].map(x=>si(x,u)).join(', ')}; ${m[1].map(x=>si(x,u)).join(', ')}]`;
  return{frame(dt){
    const{Ra,Rb,Rc,I}=c.v,p1=mode==='p1',V1=p1?I*(Ra+Rc):I*Rc,V2=p1?I*Rc:I*(Rb+Rc);
    if(!reduceMotion)ph+=spd(I*8)*dt;
    const{ctx,w,h}=fit(cv);const a=Math.max(46,w*0.08),b=w-Math.max(46,w*0.08),x1=a+Math.max(60,w*0.14),x2=b-Math.max(60,w*0.14),xc=(x1+x2)/2,t=52,bt=h-40,my=(t+bt)/2,len=Math.min(70,(xc-x1)*0.6);
    ctx.save();ctx.strokeStyle=T.muted;ctx.setLineDash([6,4]);ctx.strokeRect(x1+12,t-30,x2-x1-24,bt-t+50);ctx.restore();text(ctx,'2포트 회로',xc,t-20,T.muted,'center',11);
    line(ctx,[[x1,t],[x2,t]],T.ink,3);line(ctx,[[x1,bt],[x2,bt]],T.ink,3);line(ctx,[[xc,t],[xc,bt]],T.ink,3);
    if(p1){line(ctx,[[a,t],[x1,t]],T.ink,3);line(ctx,[[a,bt],[x1,bt]],T.ink,3);line(ctx,[[a,t],[a,bt]],T.ink,3);
      const P=polyPath([[a,bt],[a,t],[xc,t],[xc,bt]]);dots(ctx,P,ph,Math.floor(P.L/22),T.amp);isrc(ctx,a,my,20,true,T.amp);}
    else{line(ctx,[[x2,t],[b,t]],T.ink,3);line(ctx,[[x2,bt],[b,bt]],T.ink,3);line(ctx,[[b,t],[b,bt]],T.ink,3);
      const P=polyPath([[b,bt],[b,t],[xc,t],[xc,bt]]);dots(ctx,P,ph,Math.floor(P.L/22),T.amp);isrc(ctx,b,my,20,true,T.amp);}
    at(ctx,(x1+xc)/2,t,false,k=>resistor(k,len,T.ink));at(ctx,(xc+x2)/2,t,false,k=>resistor(k,len,T.ink));at(ctx,xc,my,true,k=>resistor(k,len,T.ink));
    text(ctx,'Ra '+si(Ra,'Ω'),(x1+xc)/2,t-16,T.ink,'center',11);text(ctx,'Rb '+si(Rb,'Ω'),(xc+x2)/2,t-16,T.ink,'center',11);text(ctx,'Rc',xc+14,my-8,T.ink,'left',11);text(ctx,si(Rc,'Ω'),xc+14,my+8,T.muted,'left',11);
    for(const x of[x1,x2])for(const y of[t,bt]){ctx.fillStyle=T.panel;ctx.strokeStyle=T.ink;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();ctx.stroke();}
    text(ctx,'+',x1-12,t+16,T.volt,'center',13);text(ctx,'−',x1-12,bt-16,T.volt,'center',13);text(ctx,'+',x2+12,t+16,T.volt,'center',13);text(ctx,'−',x2+12,bt-16,T.volt,'center',13);
    text(ctx,'V₁ = '+si(V1,'V'),p1?x1+10:x1-14,p1?my+42:my,T.volt,p1?'left':'right',12);text(ctx,'V₂ = '+si(V2,'V'),p1?x2+14:x2-10,p1?my:my+42,T.volt,p1?'left':'right',12);
    text(ctx,(p1?'I₁':'I₂')+' = '+si(I,'A'),p1?a:b,bt+18,T.amp,'center',11);text(ctx,p1?'포트 2 개방 (I₂ = 0)':'포트 1 개방 (I₁ = 0)',p1?x2:x1,bt+18,T.muted,'center',10);
    const key=[mode,Ra,Rb,Rc,I].join();
    if(key!==last){last=key;const z=[[Ra+Rc,Rc],[Rc,Rb+Rc]],d=z[0][0]*z[1][1]-z[0][1]*z[1][0],y=[[z[1][1]/d,-z[0][1]/d],[-z[1][0]/d,z[0][0]/d]],A=z[0][0]/z[1][0],B=d/z[1][0],Cc=1/z[1][0],D=z[1][1]/z[1][0];
      out.innerHTML=`<span class="row"><span class="k">이번 측정</span> ${p1?`z₁₁ = V₁/I₁ = <b class="vv">${si(V1/I,'Ω')}</b>, z₂₁ = V₂/I₁ = <b class="vv">${si(V2/I,'Ω')}</b>`:`z₁₂ = V₁/I₂ = <b class="vv">${si(V1/I,'Ω')}</b>, z₂₂ = V₂/I₂ = <b class="vv">${si(V2/I,'Ω')}</b>`}</span>
      <span class="row"><span class="k">z</span> ${mat(z,'Ω')}</span>
      <span class="row"><span class="k">y = z⁻¹</span> ${mat(y,'S')}</span>
      <span class="row"><span class="k">ABCD</span> A = ${A.toFixed(3)}, B = ${si(B,'Ω')}, C = ${si(Cc,'S')}, D = ${D.toFixed(3)}</span>
      <span class="row"><span class="k">상반성</span> z₁₂ = z₂₁ = ${si(Rc,'Ω')}, AD − BC = ${(A*D-B*Cc).toFixed(3)}</span>`;}
  }};

function initHero(cv){let t=0;return{frame(dt){if(!reduceMotion)t+=dt;const{ctx,w,h}=fit(cv),cy=h/2,A=h*0.3,x0=24,x1=w-24;
  const pts=[];for(let x=x0;x<=x1;x+=2)pts.push([x,cy-A*Math.cos(TAU*0.35*t-TAU*1.4*(x-x0)/(x1-x0))]);

  line(ctx,[[x0,cy],[x1,cy]],T.ink,3);line(ctx,pts,T.volt,2.6);
  const P=polyPath([[x0,cy],[x1,cy]]);ctx.fillStyle=T.amp;for(let i=0;i<14;i++){const x=x0+(((i/14)*(x1-x0)+t*40)%(x1-x0));ctx.beginPath();ctx.arc(x,cy,3,0,TAU);ctx.fill();}
  text(ctx,'v(x,t) = Vₘ cos(ωt − βx)',x0,16,T.muted,'left',12);}};}
