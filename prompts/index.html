<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markov Prompt Library · 실무용 AI 프롬프트</title>
<meta name="description" content="릴스에서 소개한 AI 프롬프트의 전문가 버전. 변수만 채워서 ChatGPT·Claude·Gemini에 바로 붙여 넣으세요.">
<meta name="theme-color" content="#0a0c10">
<meta property="og:type" content="website">
<meta property="og:title" content="Markov Prompt Library · 실무용 AI 프롬프트">
<meta property="og:description" content="릴스에서 소개한 AI 프롬프트의 전문가 버전, 변수만 채워서 바로 쓰기">
<meta property="og:url" content="https://tjguswns6891-blip.github.io/test1/prompts/">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* 프롬프트 추가: 아래 PROMPTS 배열에 객체 하나. id는 주소(#id)가 되어 DM 링크로 쓴다. 변수는 {{이름}}. */
:root{
  color-scheme:dark;
  --bg:#0a0c10; --bg2:#0f1218; --panel:#13171e; --panel2:#181d26; --line:#232a35; --line2:#2e3643;
  --ink:#e8ecf2; --soft:#9ba5b4; --faint:#5f6977;
  --acc:#7c8cff; --acc2:#b18cff; --acc-soft:rgba(124,140,255,.12);
  --grad:linear-gradient(110deg,#8fa0ff 0%,#b18cff 55%,#f08cc8 100%);
  --h:#7ee0c3; --var:#ffcf6b; --var-bg:rgba(255,207,107,.12); --fill:#8fd3ff; --fill-bg:rgba(143,211,255,.12);
  --num:#b18cff; --str:#9ba5b4; --ok:#4fd49a; --bad:#ff8a80;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Pretendard Variable",Pretendard,ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(124,140,255,.13),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(177,140,255,.08),transparent 60%);background-repeat:no-repeat}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 상단 바 */
.top{position:sticky;top:0;z-index:10;background:rgba(10,12,16,.72);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#0a0c10;font:700 14px var(--mono)}
.brand small{font:500 11px var(--mono);color:var(--faint);letter-spacing:.08em;margin-left:2px}
.ig{font-size:14px;color:var(--soft);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:6px 14px;white-space:nowrap}
.ig:hover{color:var(--ink);border-color:var(--acc)}

/* 히어로 */
.hero{padding:64px 0 36px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:600 12.5px var(--sans);letter-spacing:.02em;color:var(--soft);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;background:var(--bg2)}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hero h1{font-size:clamp(32px,5.6vw,54px);line-height:1.15;letter-spacing:-.035em;margin:18px 0 14px;font-weight:800}
.hero p{color:var(--soft);font-size:17px;max-width:620px;margin:0}
.stats{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.stat b{display:block;font:700 24px var(--mono);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--faint)}

/* 도구 */
.tools{position:sticky;top:58px;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:14px 0 18px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 42px}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.chips{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;font-size:14px;font-weight:500;color:var(--soft);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{color:#0a0c10;background:var(--ink);border-color:var(--ink)}
.chip em{font-style:normal;font:500 12px var(--mono);opacity:.6;margin-left:4px}

/* 카드 목록 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:56px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;text-decoration:none;transition:border-color .15s,transform .15s,background .15s}
.card:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-2px)}
.card .no{font:500 12px var(--mono);color:var(--faint)}
.card .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font:700 12.5px var(--sans);color:var(--acc)}
.reel{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#f6a6d6;background:rgba(240,140,200,.1);border-radius:6px;padding:2px 8px}
.card h3{margin:12px 0 6px;font-size:19px;line-height:1.4;letter-spacing:-.02em}
.card p{margin:0;color:var(--soft);font-size:14.5px;flex:1}
.peek{margin-top:16px;font:13px/1.6 var(--sans);color:var(--str);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:76px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent);white-space:pre-wrap}
.peek .h{color:var(--h)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--faint)}
.models{display:flex;gap:5px}
.models span{border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font:500 11px var(--mono)}
.open{color:var(--soft);font-weight:600;white-space:nowrap}
.card:hover .open{color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--faint);padding:60px 0}

/* 상세 */
.detail{padding:28px 0 72px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--soft);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:22px}
.back:hover{color:var(--ink)}
.d-head .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.d-head h1{font-size:clamp(28px,4.4vw,40px);line-height:1.2;letter-spacing:-.03em;margin:12px 0 10px;font-weight:800}
.d-head .sum{color:var(--soft);font-size:17px;max-width:720px;margin:0}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:26px 0}
.spec div{background:var(--panel);padding:14px 16px}
.spec dt{font:500 12px var(--sans);color:var(--faint);text-transform:uppercase}
.spec dd{margin:4px 0 0;font-weight:600;font-size:15px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

/* 편집기 */
.editor{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:#3a414d}
.tabs{display:flex;gap:4px;margin-right:auto;margin-left:14px}
.tab{background:none;border:0;border-radius:7px;padding:5px 10px;font:600 13px var(--sans);color:var(--faint);cursor:pointer}
.tab[aria-selected=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.copy{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px;background:var(--ink);color:#0a0c10;cursor:pointer;white-space:nowrap}
.copy:hover{background:#fff}
.copy.done{background:var(--ok)}
.code{font:15px/1.8 var(--sans);padding:16px 0}
.code .l{display:grid;grid-template-columns:44px 1fr;align-items:baseline}
.ln{padding-right:12px;font-family:var(--mono);font-size:12px;color:var(--faint);text-align:right;user-select:none;border-right:1px solid var(--line)}
.src{padding:0 18px;white-space:pre-wrap;min-width:0;min-height:1.8em}
.src .h{color:var(--h);font-weight:600}
.src .n{color:var(--num)}
.src .q{color:var(--faint)}
.src .v{color:var(--var);background:var(--var-bg);border-radius:4px;padding:0 3px}
.src .f{color:var(--fill);background:var(--fill-bg);border-radius:4px;padding:0 3px}
.hint{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.hint b{font-weight:500}
.hint .v{color:var(--var)}.hint .f{color:var(--fill)}

/* 사이드: 변수 채우기 */
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.box h2{font-size:15px;margin:0 0 4px;letter-spacing:-.01em}
.box .sub{font-size:13px;color:var(--faint);margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font:600 13px var(--sans);color:var(--var);margin-bottom:5px}
.field textarea{width:100%;font:14px/1.5 var(--sans);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;resize:vertical;min-height:40px}
.field textarea:focus{outline:none;border-color:var(--acc)}
.reset{background:none;border:0;color:var(--faint);font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
.side .box+.box{margin-top:14px}
.share{display:flex;gap:8px}
.share input{flex:1;min-width:0;font:12.5px var(--mono);color:var(--soft);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.share button{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}

/* 본문 섹션 */
.sec{margin-top:40px}
.sec h2{font-size:22px;letter-spacing:-.02em;margin:0 0 16px}
.sec h2 small{font:500 12px var(--mono);color:var(--faint);letter-spacing:.08em;display:block;margin-bottom:4px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--soft)}
.steps li::before{content:counter(s,decimal-leading-zero);font:600 13px var(--mono);color:var(--acc);padding-top:2px}
.steps b{color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.vs{grid-template-columns:1fr}}
.vs > div{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel)}
.vs .lab{display:inline-block;font:600 12px var(--mono);letter-spacing:.06em;border-radius:6px;padding:2px 8px;margin-bottom:10px}
.vs .bad .lab{color:var(--bad);background:rgba(255,138,128,.1)}
.vs .good{border-color:rgba(79,212,154,.35);background:linear-gradient(180deg,rgba(79,212,154,.05),transparent 60%),var(--panel)}
.vs .good .lab{color:var(--ok);background:rgba(79,212,154,.1)}
.vs .ask{font-size:13px;color:var(--faint);margin-bottom:8px}
.vs .ans{white-space:pre-wrap;font-size:14.5px;color:var(--soft);line-height:1.7}
.why{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.why div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.why b{display:block;font-size:15px;margin-bottom:4px}
.why span{font-size:14px;color:var(--soft)}
.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

footer{border-top:1px solid var(--line);padding:28px 0 56px;color:var(--faint);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#0a0c10;font-weight:600;font-size:14px;border-radius:999px;padding:10px 18px;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .hero{padding:44px 0 24px}
  .stats{gap:20px}
  .code{font-size:14px}
  .code .l{grid-template-columns:34px 1fr}
  .ln{padding-right:8px}
  .src{padding:0 12px}
  .tabs{margin-left:8px}
  .dots{display:none}
  .brand small{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><span class="logo">M</span>Markov Prompts <small>LIBRARY</small></a>
    <a class="ig" href="https://www.instagram.com/markovspace/" target="_blank" rel="noopener">@markovspace</a>
  </div>
</header>

<div id="home">
  <section class="hero wrap">
    <span class="kicker"><i></i>릴스 프롬프트 전문 공개</span>
    <h1>한 줄 팁 말고,<br><span class="gt">실무에서 쓰는 프롬프트</span></h1>
    <p>릴스에서 소개한 팁을 역할·규칙·출력 형식까지 갖춘 전문가 버전으로 정리했어요. 노란 변수만 채우면 ChatGPT, Claude, Gemini 어디서든 그대로 작동해요.</p>
    <div class="stats">
      <div class="stat"><b id="sCount">0</b><span>검증된 프롬프트</span></div>
      <div class="stat"><b>3</b><span>지원 AI (GPT·Claude·Gemini)</span></div>
      <div class="stat"><b>₩0</b><span>가입 없이 무료</span></div>
    </div>
  </section>
  <div class="wrap">
    <div class="tools">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="거짓말, 요약, 공부, 자소서…" aria-label="프롬프트 검색">
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="list"></div>
  </div>
</div>

<main id="detail" class="detail wrap" hidden></main>

<footer>
  <div class="wrap">
    <span>새 프롬프트는 인스타그램 <a href="https://www.instagram.com/markovspace/" target="_blank" rel="noopener">@markovspace</a> 릴스와 함께 올라와요.</span>
    <a href="../circuit/">공대생이라면: 보이는 회로이론 →</a>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script>
const PROMPTS = [
  {
    id: "lie", cat: "정확도", reel: "GPT 거짓말 줄이는 한 문장",
    title: "AI가 지어내는 답 막는 ‘사실 검증 모드’",
    summary: "모르는 건 모른다고 하고, 주장마다 확신도와 근거를 붙이게 만들어요. 과제·리포트·정보 검색 전에 켜 두는 안전장치예요.",
    level: "입문", time: "30초", models: ["GPT", "Claude", "Gemini"],
    uses: ["과제·리포트 자료 조사", "건강·법률·돈 관련 질문", "숫자·날짜가 중요한 질문"],
    prompt:
`# 역할
너는 사실 확인을 담당하는 꼼꼼한 리서처야.

# 질문
{{질문}}

# 답변 규칙
1. 확실하지 않은 내용은 지어내지 말고 "모름"이라고 써.
2. 모든 주장 끝에 [확신도 %]를 붙여.
3. 확신도 70% 미만인 주장은 왜 불확실한지 한 줄로 설명해.
4. 숫자·날짜·고유명사·인용은 확실할 때만 쓰고, 아니면 "확인 필요"로 표시해.
5. 질문의 전제가 틀렸다면 답하기 전에 먼저 바로잡아.

# 출력 형식
## 핵심 답변
(3~5문장)
## 주장별 확신도
| 주장 | 확신도 | 근거 |
## 직접 확인할 것
- 검색으로 꼭 확인해야 할 항목`,
    short: `확실하지 않은 내용은 지어내지 말고 '모름'이라고 해 줘. 각 주장마다 근거와 확신도(%)를 붙여 줘.`,
    steps: [
      "<b>{{질문}}</b> 칸에 원래 하려던 질문을 그대로 넣어요.",
      "답이 오면 <b>‘직접 확인할 것’</b>과 확신도 70% 미만 항목만 검색해서 확인해요.",
      "대화를 이어 갈 땐 “앞의 규칙 계속 지켜 줘”라고 한 줄만 덧붙이면 돼요."
    ],
    example: {
      ask: "아인슈타인은 상대성이론으로 노벨상 받은 거 맞지?",
      before: "네, 아인슈타인은 1921년 상대성이론으로 노벨 물리학상을 받았습니다.",
      after: "먼저 전제를 바로잡을게요.\n\n아인슈타인은 1921년 노벨 물리학상을 받았어요 [확신도 95%]. 하지만 수상 사유는 상대성이론이 아니라 광전효과 연구예요 [확신도 90%]."
    },
    why: [
      ["‘모름’을 허락", "AI는 빈칸을 그럴듯한 말로 채우려 해요. 모른다고 해도 된다고 명시하면 지어내기가 줄어요."],
      ["확신도 수치화", "어디를 의심해야 할지 한눈에 보여서, 전체를 다 검증할 필요가 없어져요."],
      ["전제 점검", "질문 자체가 틀린 경우 AI는 맞장구치기 쉬워요. 5번 규칙이 이걸 막아요."]
    ]

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const varsOf = t => [...new Set([...t.matchAll(/\{\{([^}]+)\}\}/g)].map(m => m[1]))];

function hiLine(line, vals){
  let s = esc(line);
  if (/^#{1,3} /.test(line)) s = `<span class="h">${s}</span>`;
  else if (/^"""$/.test(line)) s = `<span class="q">${s}</span>`;
  else s = s.replace(/^(\d+(단계)?\.?|[-|])/, '<span class="n">$1</span>');
  return s.replace(/\{\{([^}]+)\}\}/g, (m, k) => vals && vals[k] ? `<span class="f">${esc(vals[k])}</span>` : `<span class="v">{{${k}}}</span>`);
}
function fillText(t, vals){ return t.replace(/\{\{([^}]+)\}\}/g, (m, k) => vals && vals[k] ? vals[k] : m); }

  const n = c === "전체" ? PROMPTS.length : PROMPTS.filter(p => p.cat === c).length;
  return `<button class="chip" aria-pressed="${c === cat}" data-cat="${c}">${c}<em>${n}</em></button>`;
}).join("");
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.dataset.cat;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  renderList();
});
$("#q").addEventListener("input", renderList);

function cardHTML(p){
  const i = PROMPTS.indexOf(p) + 1;
  const peek = p.prompt.split("\n").slice(0, 4).map(l => /^# /.test(l) ? `<span class="h">${esc(l)}</span>` : esc(l)).join("\n");
  return `<a class="card" href="#${p.id}">
    <div class="row1"><span class="cat">${esc(p.cat)}</span><span class="no">#${pad(i)}</span></div>
    <h3>${esc(p.title)}</h3>
    <p>${esc(p.summary)}</p>
    ${p.reel ? `<div style="margin-top:12px"><span class="reel">▶ 릴스 · ${esc(p.reel)}</span></div>` : ""}
    <div class="peek">${peek}</div>
    <div class="foot"><span class="models">${p.models.map(m => `<span>${m}</span>`).join("")}</span><span class="open">프롬프트 보기 →</span></div>
  </a>`;
}
function renderList(){
  const q = $("#q").value.trim().toLowerCase();
  const items = PROMPTS.filter(p => (cat === "전체" || p.cat === cat) &&
    (!q || [p.title, p.summary, p.prompt, p.reel || "", p.uses.join(" ")].join(" ").toLowerCase().includes(q)));
  $("#list").innerHTML = items.length ? items.map(cardHTML).join("") : `<p class="empty">찾는 프롬프트가 없어요. 다른 단어로 검색해 보세요.</p>`;
}

            <span class="tabs" role="tablist">
              <button class="tab" role="tab" data-mode="full" aria-selected="${mode === "full" || !p.short}">전문가 버전</button>
              ${p.short ? `<button class="tab" role="tab" data-mode="short" aria-selected="${mode === "short"}">한 줄 버전</button>` : ""}
            </span>
            <button class="copy" id="copyBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              <span>복사</span>
            </button>
          </div>
          <div class="code" id="code"></div>
          <div class="hint"><span><b class="v">노란색</b> 채울 곳</span><span><b class="f">파란색</b> 내가 채운 값</span><span>‘변수 채우기’에 입력하면 바로 반영돼요</span></div>
        </div>
      </div>
      <aside class="side">
        ${vars.length ? `<div class="box">
          <h2>변수 채우기</h2>
          <p class="sub">채운 값이 프롬프트에 들어간 채로 복사돼요.</p>
          ${vars.map(v => `<div class="field"><label for="f-${esc(v)}">{{${esc(v)}}}</label><textarea id="f-${esc(v)}" rows="1" data-var="${esc(v)}" placeholder="${esc(v)} 입력">${esc(vals[v] || "")}</textarea></div>`).join("")}
          <button class="reset" id="resetBtn">입력 지우기</button>
        </div>` : ""}
        <div class="box">
          <h2>이 프롬프트 공유</h2>
          <p class="sub">DM이나 단톡방에 이 주소를 보내면 이 화면이 바로 열려요.</p>
          <div class="share"><input readonly value="${esc(url)}" aria-label="공유 주소"><button id="linkBtn">복사</button></div>
        </div>
      </aside>
    </div>

    <section class="sec">
      <h2><small>HOW TO USE</small>사용법</h2>
      <ol class="steps">${p.steps.map(s => `<li><span>${s.replace(/\{\{([^}]+)\}\}/g, "{{$1}}")}</span></li>`).join("")}</ol>
    </section>

    ${p.example ? `<section class="sec">
      <h2><small>BEFORE / AFTER</small>적용 전후 비교</h2>
      <div class="vs">
        <div class="bad"><span class="lab">그냥 물어봤을 때</span><div class="ask">Q. ${esc(p.example.ask)}</div><div class="ans">${esc(p.example.before)}</div></div>
        <div class="good"><span class="lab">이 프롬프트를 썼을 때</span><div class="ask">Q. ${esc(p.example.ask)}</div><div class="ans">${esc(p.example.after)}</div></div>
      </div>
    </section>` : ""}

    ${p.why ? `<section class="sec">
      <h2><small>WHY IT WORKS</small>왜 잘 작동하나요</h2>
      <div class="why">${p.why.map(([t, d]) => `<div><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}</div>
    </section>` : ""}

    <section class="sec">
      <h2><small>MORE</small>다른 프롬프트</h2>
      <div class="next">${others.map(cardHTML).join("")}</div>
    </section>`;

  const draw = () => {
    const t = mode === "short" && p.short ? p.short : p.prompt;
    const lines = t.split("\n");
    $("#code").innerHTML = lines.map((l, k) => `<div class="l"><span class="ln">${k + 1}</span><span class="src">${hiLine(l, vals)}</span></div>`).join("");
  };
  draw();

  $("#detail").querySelectorAll(".tab").forEach(t => t.onclick = () => {
    mode = t.dataset.mode;
    $("#detail").querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
    draw();
  });
  $("#detail").querySelectorAll("textarea[data-var]").forEach(ta => {
    const grow = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
    grow();
    ta.oninput = () => { vals[ta.dataset.var] = ta.value.trim(); grow(); draw(); };
  });
  const rb = $("#resetBtn");
  if (rb) rb.onclick = () => { for (const k in vals) delete vals[k]; renderDetail(p); };
  $("#copyBtn").onclick = e => {
    const t = mode === "short" && p.short ? p.short : fillText(p.prompt, vals);
    copy(t, "프롬프트를 복사했어요. AI 채팅창에 붙여 넣으세요");
    const b = e.currentTarget; b.classList.add("done"); b.lastElementChild.textContent = "복사됨";
    setTimeout(() => { b.classList.remove("done"); b.lastElementChild.textContent = "복사"; }, 1600);
  };
  $("#linkBtn").onclick = () => copy(url, "주소를 복사했어요");
}

async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(copy.t); copy.t = setTimeout(() => el.classList.remove("on"), 1800);
}

/* ── 주소(#id)로 화면 전환 ── */
function route(){
  const p = PROMPTS.find(x => x.id === decodeURIComponent(location.hash.slice(1)));
  $("#home").hidden = !!p;
  $("#detail").hidden = !p;
  if (p) { mode = "full"; renderDetail(p); document.title = p.title + " · Markov Prompts"; }
  else document.title = "Markov Prompt Library · 실무용 AI 프롬프트";
  window.scrollTo({ top: 0, behavior: "instant" });
}
window.addEventListener("hashchange", route);
renderList();
route();
</script>
</body>
</html>
