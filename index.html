.video .thumb i { position: relative; z-index: 2; width: 64px; height: 64px; border-radius: 18px; background: var(--mint-grad); display: grid; place-items: center; box-shadow: 0 8px 28px rgba(79, 200, 180, .35); }

  window.addEventListener("hashchange", function () { if (location.hash === "#edit" && !editing) openEditor(); });

  renderPage();
  fetch(GH.path, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (j && !dirty) { SAVED = j; state = JSON.parse(JSON.stringify(j)); renderPage(); if (editing) renderEditor(); }
  }).catch(function () {}).then(function () { if (location.hash === "#edit") openEditor(); });
})();
</script>
