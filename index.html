:root {

}
@media (prefers-color-scheme: dark) {

    --paper: #121a1f; --surface: #19242a; --ink: #e7eeea; --ink-soft: #a3b3ad; --grid: #1f2c31;
    --accent: #5cc4ab; --accent-ink: #0c1a17; --mark: #d9b847; --mark-ink: #121a1f; --line: #2e3e44; --danger: #f2877e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121a1f; --surface: #19242a; --ink: #e7eeea; --ink-soft: #a3b3ad; --grid: #1f2c31;
  --accent: #5cc4ab; --accent-ink: #0c1a17; --mark: #d9b847; --mark-ink: #121a1f; --line: #2e3e44; --danger: #f2877e;
}
* { box-sizing: border-box; }
body {

  background-size: 24px 24px;
  color: var(--ink); font: 16px/1.75 var(--sans); word-break: keep-all; overflow-wrap: break-word;
}
body.editing { padding-right: 440px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 700; line-height: 1.3; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hl { background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 2px; }
.btn {

  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px;
  font: 600 15px/1 var(--sans); text-decoration: none; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.brand { font-family: var(--serif); font-weight: 700; font-size: 18px; }
.brand small { font: 400 12px var(--mono); color: var(--ink-soft); margin-left: 6px; }
nav.links { display: flex; gap: 18px; font-size: 14px; }
nav.links a { color: var(--ink-soft); text-decoration: none; }
nav.links a:hover { color: var(--ink); }

.hero .wrap { display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: center; padding-block: 56px 48px; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); margin-top: 14px; }
.hero .lead { margin-top: 18px; color: var(--ink-soft); font-size: 17px; max-width: 34em; white-space: pre-line; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 12px; margin: 0; }
.figure svg { display: block; width: 100%; height: auto; }

.scores { border-block: 1px solid var(--line); background: var(--surface); }
.scores .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.score { padding: 26px 20px; display: flex; flex-direction: column; gap: 4px; border-left: 1px solid var(--line); }
.score:first-child { border-left: 0; }
.score b { font: 700 34px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.score span { color: var(--ink-soft); font-size: 14px; }

section.block { padding-block: 64px; }
.head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.head h2 { font-size: clamp(24px, 3.4vw, 32px); }
.head p { color: var(--ink-soft); max-width: 40em; white-space: pre-line; }

.profile { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
.panel h3 { font-size: 19px; margin-bottom: 14px; }
dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; }
dl.facts dt { font: 500 13px/1.75 var(--mono); color: var(--ink-soft); white-space: nowrap; }
dl.facts dd { margin: 0; }
ol.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
ol.timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; }
ol.timeline li::before { content: ""; width: 10px; height: 10px; margin-top: 9px; border: 2px solid var(--accent); border-radius: 50%; }
ol.timeline li:first-child::before { background: var(--accent); }
ol.timeline small { display: block; color: var(--ink-soft); font-size: 14px; }

.levels { display: flex; flex-direction: column; gap: 36px; }
.level > .lv { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.level > .lv h3 { font-size: 22px; }
.level > .lv span { font: 500 12px var(--mono); color: var(--ink-soft); }

.unit .eq { font: 500 14px var(--mono); color: var(--accent); }
.unit h4 { font: 700 19px/1.35 var(--serif); margin: 0; }
.unit p { color: var(--ink-soft); font-size: 15px; white-space: pre-line; }

.videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.video { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.video .frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #0f1418; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video .thumb { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; cursor: pointer; background: #0f1418; display: grid; place-items: center; }
.video .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.video .thumb:hover img { transform: scale(1.03); }
.video .thumb i { position: relative; width: 68px; height: 48px; border-radius: 12px; background: #e62117; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.video .thumb i::after { content: ""; border-left: 18px solid #fff; border-block: 11px solid transparent; margin-left: 5px; }
.foot { display: flex; justify-content: space-between; gap: 12px; }
.foot a { color: var(--ink-soft); font-size: 13px; }
.video .meta { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.video h4 { font: 700 17px/1.4 var(--serif); margin: 0; }
.video p { color: var(--ink-soft); font-size: 14px; white-space: pre-line; }

aside.editor {

.ed-body { overflow-y: auto; padding: 8px 18px 40px; flex: 1; }
.ed-body details { border-bottom: 1px solid var(--line); padding-block: 12px; }
.ed-body summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: 16px; padding: 6px 2px; min-height: 44px;
}
.ed-body summary::-webkit-details-marker { display: none; }
.ed-body summary small { font-weight: 400; font-size: 13px; color: var(--ink-soft); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-body summary::after {
  content: "열기"; flex: none; font: 500 12px var(--sans); color: var(--accent);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
}
.ed-body details[open] > summary::after { content: "접기"; color: var(--ink-soft); }
.ed-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.ed-fields label { font-size: 13px; }
.ed-fields input, .ed-fields textarea { font-size: 14px; padding: 8px 10px; }
.ed-fields textarea { min-height: 72px; }
.ed-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.ed-item .bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; font: 500 12px var(--mono); color: var(--ink-soft); }
.ed-item .bar div { display: flex; gap: 4px; }
.mini { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 5px; padding: 3px 8px; font: 500 12px var(--sans); cursor: pointer; }
.mini.del { color: var(--danger); }
.hint { font-size: 12px; color: var(--ink-soft); font-weight: 400; }
.hint.bad { color: var(--danger); }
.empty-note { border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--ink-soft); }

@media (max-width: 1100px) { body.editing { padding-right: 0; } aside.editor { width: 100%; } }
@media (max-width: 860px) {
  .hero .wrap, .profile, .contact { grid-template-columns: 1fr; }

  .row { grid-template-columns: 1fr; }

@media (prefers-reduced-motion: no-preference) {
  #proj-line { stroke-dasharray: 4 4; animation: dash 1.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -16; } }
}

  function b64(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  function gh(method, body) {
    var url = "https://api.github.com/repos/" + GH.owner + "/" + GH.repo + "/contents/" + GH.path + (method === "GET" ? "?ref=" + encodeURIComponent(GH.branch) : "");
    return fetch(url, {
      method: method, cache: "no-store",
      headers: { "Authorization": "Bearer " + getToken(), "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
      body: body ? JSON.stringify(body) : undefined
    });
  }

  var saving = false;
  function save() {
    if (saving) return;
    if (!dirty) { setStatus("바뀐 내용이 없어요."); return; }
    if (!getToken()) { openSecs["GitHub 연결"] = true; renderEditor(); setStatus("먼저 ‘GitHub 연결’에 토큰을 넣어 주세요.", true); return; }
    saving = true; setStatus("저장하는 중이에요…");
    var clean = JSON.parse(JSON.stringify(state));
    clean.videos = clean.videos.filter(function (v) { return v.url && v.url.trim(); });
    gh("GET").then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw r.status;
      return r.json().then(function (j) { return j.sha; });
    }).then(function (sha) {
      return gh("PUT", { message: "사이트 내용 수정", content: b64(JSON.stringify(clean, null, 2) + "\n"), sha: sha || undefined, branch: GH.branch });
    }).then(function (r) {
      if (!r.ok) throw r.status;
      SAVED = clean; dirty = false;
      setStatus("저장했어요. 1~2분 뒤 방문자 화면에 반영돼요.");
    }).catch(function (code) {
      var msg = {
        401: "토큰이 맞지 않거나 만료됐어요. ‘GitHub 연결’에서 새 토큰을 넣어 주세요.",
        403: "토큰에 이 저장소 쓰기 권한(Contents: Read and write)이 없어요.",
        404: "저장소를 찾지 못했어요. 토큰이 이 저장소에 접근할 수 있는지 확인해 주세요.",
        409: "다른 곳에서 동시에 저장했어요. 한 번 더 눌러 주세요.",
        422: "저장 형식이 맞지 않아요. 한 번 더 눌러 주세요."
      }[code] || "저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요." + (typeof code === "number" ? " (" + code + ")" : "");
      setStatus(msg, true);
    }).then(function () { saving = false; });
  }

  function openEditor() { editing = true; renderPage(); renderEditor(); }

  window.addEventListener("beforeunload", function (e) { if (dirty && !saving) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("hashchange", function () { if (location.hash === "#edit" && !editing) openEditor(); });

  renderPage();
  fetch(GH.path, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (j && !dirty) { SAVED = j; state = JSON.parse(JSON.stringify(j)); renderPage(); if (editing) renderEditor(); }
  }).catch(function () {}).then(function () { if (location.hash === "#edit") openEditor(); });
})();
</script>
