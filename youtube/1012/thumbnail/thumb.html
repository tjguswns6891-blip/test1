<!doctype html>
<meta charset="utf-8">
<title>10/12 썸네일</title>
<!-- 10/9 v3 와 같은 문법: 집중선 · 큰 노란 글씨 · 원형 로고 · 흰 테두리 얼굴 · 굵은 화살표. node render.js 로 thumbnail_A/B.png (1280×720) -->
<style>
:root{--yel:#ffe02e;--red:#ff2e4d;--blue:#3d8bff;--lblue:#8fbcff;font-family:'Noto Sans CJK KR',sans-serif}
*{box-sizing:border-box;margin:0}
body{background:#000}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;margin-bottom:10px}
.burst{position:absolute;inset:-400px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.10) 0 6deg,rgba(255,255,255,0) 6deg 14deg)}
.t{position:absolute;font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff;white-space:nowrap;
   -webkit-text-stroke:16px #000;paint-order:stroke fill;filter:drop-shadow(0 12px 0 rgba(0,0,0,.35))}
.y{color:var(--yel)} .b{color:var(--lblue)}
.person{position:absolute;filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 24px 30px rgba(0,0,0,.6))}
.coin{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 0 12px #000,0 24px 40px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.tag{position:absolute;font-weight:900;color:#000;background:var(--yel);border:6px solid #000;border-radius:16px;padding:6px 22px;box-shadow:0 8px 0 #000;white-space:nowrap}
</style>

<!-- A: 외국인 2조 · 코스피 −3.65% -->
<section class="thumb" id="A" style="background:radial-gradient(900px 700px at 30% 50%,#2a49d6,#0a1660 75%)">
  <div class="burst" style="left:-900px;top:-300px"></div>
  <img class="person" src="person_A.png" style="right:-150px;bottom:-40px;height:640px">
  <div class="tag" style="left:40px;top:30px;font-size:44px;transform:rotate(-3deg)">수출은 역대 최대인데?</div>
  <div class="t" style="left:36px;top:140px;font-size:150px">외국인</div>
  <div class="t" style="left:36px;top:300px;font-size:170px"><span class="y">2조</span> 던졌다</div>
  <svg style="position:absolute;left:40px;top:500px" width="120" height="190" viewBox="0 0 200 300">
    <path d="M65 0h70v180h65L100 300 0 180h65z" fill="#3d8bff" stroke="#000" stroke-width="16" stroke-linejoin="round"/>
  </svg>
  <div class="t" style="left:180px;top:520px;font-size:150px" ><span style="font-size:76px">코스피</span> <span class="b">−3.65%</span></div>
</section>

<!-- B: 아이폰 하나에 LG이노텍 −16% -->
<section class="thumb" id="B" style="background:radial-gradient(900px 700px at 30% 50%,#1b2a4a,#05070d 75%)">
  <div class="burst" style="left:-900px;top:-300px"></div>
  <img class="person" src="person_B.png" style="right:-160px;bottom:-40px;height:620px">
  <div class="coin" style="left:40px;top:40px;width:250px;height:250px"><img src="../../logos/apple.png" style="width:120px;filter:brightness(0)"></div>
  <div class="coin" style="left:250px;top:170px;width:200px;height:200px;background:#a50034;box-shadow:0 0 0 12px #000,0 24px 40px rgba(0,0,0,.55)"><img src="../../logos/lg_white.png" style="width:130px"></div>
  <div class="t" style="left:480px;top:60px;font-size:110px">아이폰</div>
  <div class="t" style="left:480px;top:185px;font-size:110px"><span class="y">하나</span>에</div>
  <div class="t" style="left:40px;top:400px;font-size:90px">LG이노텍</div>
  <div class="t" style="left:40px;top:510px;font-size:190px;color:var(--lblue)">−16%</div>
</section>
