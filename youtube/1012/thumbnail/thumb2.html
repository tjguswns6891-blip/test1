<!doctype html>
<meta charset="utf-8">
<title>10/12 썸네일 v2</title>
<!-- 클릭 유도용 3종 (1280×720). 원칙: 글씨 3~6자 · 숫자 대비 하나 · 시선은 얼굴→글씨 · 휴대폰 작은 화면(168px 폭)에서도 읽히게.
     배경은 블렌더 3D 장면(b01·b03) 그대로 써서 다른 경제 채널과 다르게. node render2.js -->
<style>
:root{--yel:#ffe02e;--red:#ff2e4d;--blue:#2f7bff;--lblue:#9cc4ff;--ink:#fff;font-family:'Noto Sans CJK KR',sans-serif}
*{box-sizing:border-box;margin:0}
body{background:#000}
.thumb{width:1280px;height:720px;position:relative;overflow:hidden;margin-bottom:10px;background:#05070d}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0}
.t{position:absolute;font-weight:900;line-height:.98;letter-spacing:-.045em;color:var(--ink);white-space:nowrap;
   -webkit-text-stroke:18px #000;paint-order:stroke fill;filter:drop-shadow(0 10px 0 rgba(0,0,0,.45))}
.y{color:var(--yel)} .r{color:var(--red)} .b{color:var(--lblue)}
.person{position:absolute;filter:drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff) drop-shadow(0 26px 34px rgba(0,0,0,.7))}
.tag{position:absolute;font-weight:900;color:#000;background:var(--yel);border:7px solid #000;border-radius:14px;padding:4px 22px 8px;box-shadow:0 8px 0 #000;white-space:nowrap;line-height:1.1}
.alert{position:absolute;font-weight:900;color:#fff;background:var(--red);border:7px solid #000;border-radius:14px;padding:4px 24px 8px;box-shadow:0 8px 0 #000;white-space:nowrap;line-height:1.1}
.coin{position:absolute;border-radius:50%;box-shadow:0 0 0 10px #000,0 18px 30px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;overflow:hidden}
.burst{position:absolute;left:-900px;top:-500px;width:2600px;height:2600px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.08) 0 5deg,rgba(255,255,255,0) 5deg 12deg)}
</style>

<!-- C: 역대 최대인데 왜 폭락? — 3D 하락 그래프 배경, 숫자 대비 -->
<section class="thumb" id="C">
  <img class="bg" src="../img/b01_kospi.png" style="filter:brightness(.75) saturate(1.3);transform:scale(1.15);transform-origin:70% 60%">
  <div class="shade" style="background:linear-gradient(90deg,rgba(3,6,20,.97) 0%,rgba(3,6,20,.9) 50%,rgba(3,6,20,.2) 78%)"></div>
  <img class="person" src="person_A.png" style="right:-170px;bottom:-70px;height:720px">
  <div class="tag" style="left:38px;top:34px;font-size:52px;transform:rotate(-3deg)">수출 <span style="color:#d4002a">+170%</span> 역대 최대</div>
  <div class="t" style="left:34px;top:168px;font-size:150px">근데 왜</div>
  <div class="t r" style="left:30px;top:330px;font-size:200px">폭락?</div>
  <div class="t" style="left:40px;top:575px;font-size:88px">코스피 <span class="b">−3.65%</span></div>
</section>

<!-- D: 외국인 2조 탈출 · 6,400 붕괴 — 경보 느낌 -->
<section class="thumb" id="D" style="background:radial-gradient(900px 700px at 25% 55%,#8a0a1c,#1a0206 78%)">
  <div class="burst"></div>
  <img class="person" src="person_B.png" style="right:-150px;bottom:-60px;height:700px">
  <div class="alert" style="left:36px;top:30px;font-size:56px;transform:rotate(-3deg)">6,400 붕괴</div>
  <div class="t" style="left:34px;top:150px;font-size:170px">외국인</div>
  <div class="t" style="left:30px;top:335px;font-size:205px"><span class="y">2조</span> 탈출</div>
  <!-- 삼성(실제 로고) · SK하이닉스(로고 파일이 없어 글자 칩) -->
  <div class="coin" style="left:36px;top:560px;width:140px;height:140px;background:#fff">
    <svg width="132" height="132" viewBox="0 0 400 400" style="position:absolute"><ellipse cx="200" cy="200" rx="190" ry="96" transform="rotate(-14 200 200)" fill="#1428A0"/></svg>
    <img src="../../logos/samsung_white.png" style="position:relative;width:96px">
  </div>
  <div class="coin" style="left:196px;top:560px;width:140px;height:140px;background:#fff;flex-direction:column;line-height:.95">
    <span style="font-weight:900;font-size:50px;color:#ea002c;letter-spacing:-.02em">SK</span>
    <span style="font-weight:900;font-size:30px;color:#f47725;letter-spacing:-.02em">hynix</span>
  </div>
  <div class="t" style="left:362px;top:585px;font-size:92px"><span class="b">4일 −9~13%</span></div>
</section>

<!-- E: 아이폰이 LG이노텍을 — 3D 아이폰 장면 배경 -->
<section class="thumb" id="E">
  <img class="bg" src="../img/b03_iphone.png" style="filter:brightness(.8) saturate(1.2);transform:scale(1.25);transform-origin:20% 45%">
  <div class="shade" style="background:linear-gradient(270deg,rgba(3,6,20,.95) 0%,rgba(3,6,20,.75) 48%,rgba(3,6,20,0) 80%)"></div>
  <img class="person" src="person_B.png" style="left:-120px;bottom:-60px;height:640px;transform:scaleX(-1)">
  <div class="tag" style="right:40px;top:36px;font-size:50px;transform:rotate(3deg)">아이폰 주문 15%↓</div>
  <div class="t" style="right:40px;top:170px;font-size:120px;text-align:right">LG이노텍</div>
  <div class="t b" style="right:34px;top:310px;font-size:230px;text-align:right">−16%</div>
  <div class="t" style="right:44px;top:575px;font-size:84px;text-align:right">범인은 <span class="y">메모리 값</span></div>
</section>
