<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}body{background:#000;font-family:"Noto Sans CJK KR";display:flex;gap:20px;flex-wrap:wrap}
.cv{width:1080px;height:1920px;position:relative;overflow:hidden;background:#111318;color:#eef0f3}
.cv:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 30%,var(--tint),transparent 70%)}
.cv:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:60px 60px}
.in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center}
.chip{margin-top:330px;background:var(--c);color:#111318;font-weight:900;font-size:50px;padding:12px 40px;border-radius:60px}
.l1{font-weight:900;font-size:112px;margin-top:44px;letter-spacing:-2px;line-height:1.1;text-align:center}
.big{font-weight:900;font-size:200px;color:var(--c);line-height:1.08;letter-spacing:-4px;text-shadow:0 0 50px var(--glow)}
.l3{font-weight:900;font-size:84px;color:#ffc53d;margin-top:8px;text-align:center;letter-spacing:-1px}
.fr{margin-top:56px;width:960px;height:747px;border-radius:36px;border:4px solid #2a2e37;overflow:hidden;box-shadow:0 30px 80px #000a}
.fr img{width:100%;height:100%;display:block}
.dt{position:absolute;top:230px;font-size:34px;color:#8d94a1;font-weight:700}
</style>
