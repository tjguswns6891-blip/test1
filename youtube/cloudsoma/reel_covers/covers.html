<!doctype html>
<meta charset="utf-8">
<title>파프 릴스 커버</title>
<!-- 1080×1920, 프로필 격자에 보이는 가운데 y 240~1680 안에 핵심 -->
<style>
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:'Noto Sans CJK KR',sans-serif}
.r{width:1080px;height:1920px;position:relative;overflow:hidden;margin-bottom:10px;
   background:radial-gradient(900px 900px at 50% 42%,#3a3127,#14110e 75%)}
.badge{position:absolute;left:50%;top:262px;transform:translateX(-50%);font-weight:900;font-size:46px;color:#efe7a6;border:4px solid #efe7a6;border-radius:999px;padding:10px 34px;white-space:nowrap;letter-spacing:.02em}
.t{position:absolute;left:30px;right:30px;text-align:center;font-weight:900;letter-spacing:-.045em;line-height:1.05;color:#fff;-webkit-text-stroke:12px #0d0b09;paint-order:stroke fill}
.y{color:#efe7a6}
.shoe{position:absolute;left:46%;transform:translateX(-50%) rotate(-6deg);width:1060px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.person{position:absolute;right:-60px;bottom:0;height:560px;filter:drop-shadow(8px 0 0 #efe7a6) drop-shadow(-8px 0 0 #efe7a6) drop-shadow(0 -8px 0 #efe7a6) drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.tag{position:absolute;left:70px;font-weight:900;color:#14110e;background:#efe7a6;border-radius:18px;padding:12px 26px;font-size:50px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.price{position:absolute;left:70px;top:1380px;font-weight:900;font-size:52px;color:#fff;line-height:1.25}
.price s{color:#9b917f;text-decoration-thickness:6px}
.price b{color:#efe7a6;font-size:84px}
</style>

 <img class="shoe" src="shoe.png" style="top:800px">

 <img class="person" src="person_c.png">
</section>

  <path d="M30 200 C120 40 200 40 260 130 C320 220 400 220 470 110 L560 60" fill="none" stroke="#5fbf6a" stroke-width="18" stroke-linecap="round" stroke-dasharray="2 34"/>
 </svg>
