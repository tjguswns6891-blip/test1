<!doctype html>
<meta charset="utf-8">
<title>회로이론 3분 정리 썸네일·커버</title>
<!-- 롱폼 1280×720 3종(테스트 및 비교) + 릴스 커버 1080×1920 3종 -->
<style>
*{box-sizing:border-box;margin:0}
body{background:#000;font-family:'Noto Sans CJK KR',sans-serif}
.th{width:1280px;height:720px;position:relative;overflow:hidden;margin-bottom:12px;background:#0b0c10}
.t{position:absolute;font-weight:900;letter-spacing:-.05em;line-height:.98;-webkit-text-stroke:13px #000;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.45)}
.badge{position:absolute;font-weight:900;color:#fff;background:#e5322d;border-radius:14px;padding:8px 24px;transform:rotate(-3deg);box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:44px}
.person{position:absolute;bottom:0;filter:drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(0 20px 40px rgba(0,0,0,.7))}
.img{position:absolute;background-size:cover;background-position:center;border-radius:22px;border:5px solid rgba(255,255,255,.9);box-shadow:0 0 0 8px rgba(0,0,0,.4)}
/* V1 복잡한 회로 → 저항 하나 */
#V1{background:radial-gradient(800px 500px at 75% 45%,#1d2a4a,#0b0c10)}
#V1 .img{right:40px;top:110px;width:600px;height:338px;background-image:url(g_circ.png)}
#V1 .img2{position:absolute;right:200px;top:470px;width:380px;height:214px;background-size:cover;background-position:center;border-radius:18px;border:5px solid #ffd23d;background-image:url(g_hook.png)}
#V1 .arr{position:absolute;right:600px;top:470px;font-size:120px;color:#ffd23d;font-weight:900}
#V1 .a{left:40px;top:140px;font-size:104px;color:#fff}
#V1 .b{left:40px;top:262px;font-size:120px;color:#ffd23d}
#V1 .c{left:40px;top:440px;font-size:88px;color:#3ddc97}
#V1 .badge{left:40px;top:40px}
/* V2 3분 정리 */
#V2{background:linear-gradient(135deg,#1a1033,#0b0c10 60%)}
#V2 .img{right:40px;top:150px;width:600px;height:338px;background-image:url(g_thev.png)}
#V2 .a{left:40px;top:130px;font-size:110px;color:#fff}
#V2 .b{left:40px;top:260px;font-size:150px;color:#ffd23d}
#V2 .c{left:44px;top:450px;font-size:76px;color:#6ea8ff}
#V2 .badge{left:40px;top:40px;background:#5b63ff}
#V2 .person{right:-50px;height:300px}
/* 릴스 커버 */
.r{width:1080px;height:1920px;position:relative;overflow:hidden;margin-bottom:10px;background:#0d0f14}
.r .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(18px) brightness(.45) saturate(1.3);transform:scale(1.15)}
.r .badge{left:50%;top:262px;transform:translateX(-50%) rotate(-2.5deg);font-size:56px;white-space:nowrap;padding:12px 38px}
.r .t{left:30px;right:30px;text-align:center;-webkit-text-stroke:14px #000}
.r .card{position:absolute;left:60px;right:60px;top:760px;height:747px;border-radius:34px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#111318;border:6px solid rgba(255,255,255,.9);box-shadow:0 0 0 10px rgba(0,0,0,.35)}
.r .tag{position:absolute;left:70px;top:1530px;font-weight:900;font-size:48px;color:#fff;background:rgba(0,0,0,.6);border:4px solid #ffd23d;border-radius:18px;padding:12px 26px}
.r .person{right:-70px;height:430px}
</style>
<section class="th" id="V1"><div class="img"></div><div class="arr">→</div><div class="img2"></div><div class="badge">전기전자 주목</div>
 <div class="t a">이 복잡한 회로</div><div class="t b">저항 하나로</div><div class="t c">테브난·노턴·중첩</div></section>
<section class="th" id="V2"><div class="img"></div><div class="badge">시험 전 필수</div>
 <div class="t a">회로이론</div><div class="t b">3분 정리</div><div class="t c">테브난·노턴·중첩</div><img class="person" src="person.png"></section>
<script>
const R = [
 ['A','전기전자 주목!','복잡한 회로','저항 하나로','g_thev.png','테브난 정리','#ffd23d'],
 ['B','전기전자 주목!','노턴은','테브난 쌍둥이','g_norton.png','노턴 정리','#6ea8ff'],
 ['C','전기전자 주목!','전원 두 개?','하나씩 끄기','g_sup.png','중첩의 원리','#3ddc97'],
 ['D','전기전자 주목!','전원 끄기','떼면 틀려요','g_kill.png','전압원 단락 · 전류원 개방','#ff5d73'],
 ['E','전기전자 주목!','최대 전력','답은 하나','g_max.png','최대 전력 전달','#ffd23d'],
];
document.write(R.map(([id,b,l1,l2,g,tag,c]) => `<section class="r" id="${id}">
 <div class="bg" style="background-image:url(${g})"></div>
 <div class="badge">${b}</div>
 <div class="t" style="top:370px;font-size:124px;color:#fff">${l1}</div>
 <div class="t" style="top:520px;font-size:140px;color:${c}">${l2}</div>
 <div class="card" style="background-image:url(${g})"></div>
 <div class="tag">${tag}</div>
 <img class="person" src="person.png">
</section>`).join(''));
</script>
