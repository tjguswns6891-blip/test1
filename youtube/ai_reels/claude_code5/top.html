<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff}
  canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="880"></canvas>
<script>
// 위쪽 화면(1080×880): 흰 배경 위 둥근 카드, 카드 안은 어두운 방 픽셀아트.
// render(scene, t): scene 0=훅, 1~5=팁, t=장면 안 시간(초).
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 880, P = 10;            // P = 픽셀 한 칸 크기
const OR = '#ff7a1a', OR2 = '#ffb066', BG = '#16131f', BG2 = '#221d30', WH = '#f4f1ea', GR = '#3a3448';
const CARD = {x: 40, y: 30, w: 1000, h: 820, r: 40};
const TIPS = ['/compact', 'ESC ×2', 'CLAUDE.md', 'Shift+Tab ×2', '서브에이전트'];

function px(x, y, w, h, c) { X.fillStyle = c; X.fillRect(Math.round(x), Math.round(y), w, h); }
// 문자열 격자 → 픽셀 그림. 각 문자는 pal 의 색.
function sprite(rows, x, y, pal, s = P) {
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (pal[ch]) px(x + i * s, y + j * s, s, s, pal[ch]); }));
}
function text(s, x, y, size, c, align = 'center', weight = 900) {
  X.font = `${weight} ${size}px "Noto Sans CJK KR"`; X.fillStyle = c; X.textAlign = align; X.textBaseline = 'middle';
  X.fillText(s, x, y);
}
function rrect(x, y, w, h, r) {
  X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r);
  X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath();
}
const ease = v => 1 - Math.pow(1 - Math.min(Math.max(v, 0), 1), 3);

// 우리 마스코트: 주황 안테나 달린 작은 로봇
const BOT = [
  '....o....',
  '....o....',
  '.wwwwwww.',
  'wwwwwwwww',
  'wwbwwwbww',
  'wwwwwwwww',
  'ww.ooo.ww',
  '.wwwwwww.',
  '..w...w..',
];
const botPal = {w: WH, o: OR, b: BG};
function bot(x, y, s = P, bob = 0) { sprite(BOT, x, y + bob, botPal, s); }

function room() {
  px(CARD.x, CARD.y, CARD.w, CARD.h, BG);
  // 바닥과 주황 조명
  px(CARD.x, CARD.y + 640, CARD.w, 180, BG2);
  const g = X.createRadialGradient(540, 120, 10, 540, 120, 520);
  g.addColorStop(0, 'rgba(255,122,26,0.22)'); g.addColorStop(1, 'rgba(255,122,26,0)');
  X.fillStyle = g; X.fillRect(CARD.x, CARD.y, CARD.w, CARD.h);
}

// 카드 맨 위 진행 표시: 1~5 칸, 현재까지 켜짐
function progress(n, t) {
  const y = CARD.y + 34, w = 150, gap = 26, x0 = 540 - (5 * w + 4 * gap) / 2;
  for (let i = 0; i < 5; i++) {
    const on = i < n, cur = i === n - 1;
    const pop = cur ? 1 + 0.12 * Math.max(0, 1 - t * 3) : 1;
    const x = x0 + i * (w + gap), cx = x + w / 2;
    X.save(); X.translate(cx, y + 26); X.scale(pop, pop); X.translate(-cx, -(y + 26));
    rrect(x, y, w, 52, 14); X.fillStyle = on ? OR : GR; X.fill();
    text(String(i + 1), cx, y + 27, 30, on ? BG : '#8a8399');
    X.restore();
  }
}
function title(s, t) {
  const a = ease(t * 4);
  X.globalAlpha = a; text(s, 540, CARD.y + 150 - 20 * (1 - a), 64, WH); X.globalAlpha = 1;
}
function caption(s, t, y = 760) {
  const a = ease((t - 0.3) * 4);
  X.globalAlpha = a; text(s, 540, y, 38, OR2, 'center', 700); X.globalAlpha = 1;
}

// ── 장면 ──────────────────────────────────────────
// 0. 훅: 토큰 동전이 쓰레기통으로 빠지고 카운터가 올라감
function s0(t) {
  progress(0, t);
  text('토큰 그냥 버리는 중', 540, CARD.y + 150, 64, WH);
  const n = Math.floor(ease(t / 3.5) * 98000);
  text(n.toLocaleString() + ' 토큰', 540, CARD.y + 250, 80, OR);
  // 쓰레기통
  const tx = 470, ty = 480;
  sprite(['tttttttttttttt', '.t.t.t.t.t.t..', '.tttttttttttt.', '.t.t.t.t.t.t..', '.t.t.t.t.t.t..', '.t.t.t.t.t.t..', '..tttttttttt..'],
         tx, ty, {t: '#8a8399'}, 10);
  // 떨어지는 동전
  for (let k = 0; k < 6; k++) {
    const ph = (t * 1.3 + k / 6) % 1;
    const cx = tx + 20 + (k * 17) % 100, cy = 300 + ph * 190;
    if (cy < ty) sprite(['.oo.', 'oyyo', 'oyyo', '.oo.'], cx, cy, {o: OR, y: '#ffd27a'}, 9);
  }
  bot(250, 470, 12, Math.sin(t * 6) * 4);
  text('?', 330, 440, 70, OR);
}

// 1. /compact: 긴 대화 막대들이 짧게 압축되고 토큰 게이지가 줄어듦
function s1(t) {
  progress(1, t); title('/compact', t);
  const k = ease((t - 1) / 1.5);         // 0→1 압축
  const n = 12, full = 26, x = 180;
  for (let i = 0; i < n; i++) {
    const y = 230 + i * (full + 8) * (1 - k * 0.8);
    const w = 300 + ((i * 97) % 200);
    if (y < 680 && k < 0.95) px(x, y, w * (1 - k * 0.3), full * (1 - k * 0.6), i % 2 ? '#4b4460' : '#5d5577');
  }
  if (k > 0.95) { rrect(x - 10, 220, 500, 70, 12); X.fillStyle = OR; X.fill(); text('요약 1줄', x + 240, 256, 36, BG); }
  // 토큰 게이지
  const gx = 760, gy = 250, gh = 380, lvl = 1 - 0.7 * k;
  px(gx, gy, 90, gh, GR); px(gx, gy + gh * (1 - lvl), 90, gh * lvl, lvl > 0.5 ? '#e5484d' : OR);
  text('토큰', gx + 45, gy - 30, 32, WH, 'center', 700);
  text(Math.round(lvl * 100) + '%', gx + 45, gy + gh + 40, 40, WH);
  caption('긴 대화 → 압축 → 토큰 절약', t);
}

// 2. ESC ×2: ESC 키가 두 번 눌리고 망가진 블록이 되감김
function s2(t) {
  progress(2, t); title('ESC 두 번', t);
  const press = i => { const d = t - (0.8 + i * 0.5); return d > 0 && d < 0.2; };
  for (let i = 0; i < 2; i++) {
    const x = 200 + i * 200, y = 260 + (press(i) ? 10 : 0);
    rrect(x, y, 160, 110, 16); X.fillStyle = press(i) ? OR : '#e8e3d8'; X.fill();
    px(x, y + 100, 160, 14, press(i) ? '#c25a10' : '#a39d90');
    text('ESC', x + 80, y + 55, 44, BG);
  }
  // 되감기: 블록 탑이 무너졌다가 원래대로
  const r = ease((t - 2) / 1.2);
  const cols = ['#5d5577', OR, '#5d5577', OR2, '#5d5577'];
  for (let i = 0; i < 5; i++) {
    const fx = 680 + (i % 2 ? 90 : -60) + i * 10, fy = 640 - 40 - (i % 3) * 20;   // 무너진 자리
    const ox = 700, oy = 640 - (i + 1) * 60;                                        // 원래 자리
    px(fx + (ox - fx) * r, fy + (oy - fy) * r, 120, 50, cols[i]);
  }
  if (t > 1.9) text('↺', 560, 520, 120, OR);
  caption('망친 작업 → 이전 상태로 되감기', t);
}

// 3. CLAUDE.md: 펼친 책을 로봇이 읽음
function s3(t) {
  progress(3, t); title('CLAUDE.md', t);
  const bx = 300, by = 300;
  px(bx, by, 480, 320, '#e8e3d8'); px(bx + 236, by, 8, 320, '#a39d90');
  for (let i = 0; i < 7; i++) {
    const shown = ease((t - 0.8 - i * 0.25) * 3);
    px(bx + 30, by + 40 + i * 38, 180 * shown, 14, i === 0 ? OR : '#8a8399');
    px(bx + 270, by + 40 + i * 38, 170 * shown, 14, '#8a8399');
  }
  text('# 우리 프로젝트 규칙', bx + 120, by - 30, 30, OR2, 'center', 700);
  bot(140, 470, 11, Math.sin(t * 5) * 3);
  caption('매번 하는 설명 → 한 번만 적어 두기', t);
}

// 4. Shift+Tab ×2: 키 두 번 → 설계도 위에 체크리스트가 하나씩
function s4(t) {
  progress(4, t); title('Shift + Tab 두 번', t);
  const press = i => { const d = t - (0.7 + i * 0.5); return d > 0 && d < 0.2; };
  const keys = [['Shift', 210], ['Tab', 170]];
  let x = 150;
  for (const [k, w] of keys) {
    const p = press(0) || press(1);
    rrect(x, 240 + (p ? 8 : 0), w, 90, 14); X.fillStyle = p ? OR : '#e8e3d8'; X.fill();
    text(k, x + w / 2, 285 + (p ? 8 : 0), 38, BG); x += w + 30;
  }
  // 설계도
  const gx = 560, gy = 230;
  px(gx, gy, 380, 420, '#1f4b7a');
  for (let i = 0; i < 9; i++) { px(gx, gy + i * 47, 380, 2, '#3d6fa3'); px(gx + i * 47, gy, 2, 420, '#3d6fa3'); }
  text('PLAN', gx + 190, gy + 50, 48, WH);
  ['조사', '설계', '구현', '확인'].forEach((s, i) => {
    const on = t > 1.8 + i * 0.4;
    text(on ? '✓' : '□', gx + 60, gy + 130 + i * 70, 40, on ? OR : WH);
    text(s, gx + 110, gy + 130 + i * 70, 40, WH, 'left', 700);
  });
  bot(250, 470, 11, Math.sin(t * 5) * 3);
  caption('바로 코딩 X → 계획부터 확인', t);
}

// 5. 서브에이전트: 큰 로봇 + 작은 로봇 셋이 동시에 일함
function s5(t) {
  progress(5, t); title('서브에이전트', t);
  bot(460, 220, 18, Math.sin(t * 4) * 4);
  ['조사', '코딩', '검토'].forEach((s, i) => {
    const x = 170 + i * 270, y = 470, a = ease((t - 0.6 - i * 0.25) * 3);
    X.globalAlpha = a;
    bot(x + 30, y, 9, Math.sin(t * 9 + i) * 4);
    rrect(x, y + 110, 160, 60, 12); X.fillStyle = OR; X.fill();
    text(s, x + 80, y + 140, 34, BG);
    // 작업 진행 막대
    px(x, y + 190, 160, 14, GR); px(x, y + 190, 160 * ease((t - 1 - i * 0.2) / 2), 14, OR2);
    X.globalAlpha = 1;
  });
  caption('조사 · 코딩 · 검토를 동시에', t, 800);
}

const SCENES = [s0, s1, s2, s3, s4, s5];
window.render = function (scene, t) {
  X.clearRect(0, 0, W, H); px(0, 0, W, H, '#fff');
  X.save(); rrect(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r); X.clip();
  room(); SCENES[scene](t);
  X.restore();
};
render(0, 0);
</script>
</body></html>
