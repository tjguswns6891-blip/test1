<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>card</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111318; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; color: #eef0f3; }
  .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; }
  .k { font-size: 44px; font-weight: 700; color: #8d94a1; letter-spacing: 2px; }
  .row { display: flex; align-items: center; gap: 40px; }
  .box { min-width: 330px; padding: 28px 40px; border-radius: 28px; background: #181b21; border: 3px solid #2a2e37; text-align: center; }
  .box .n { font-size: 150px; font-weight: 800; line-height: 1; }
  .box .t { font-size: 40px; font-weight: 700; color: #8d94a1; margin-top: 12px; }
  .op { font-size: 120px; font-weight: 800; color: #ffc53d; }
  .res { font-size: 76px; font-weight: 800; padding: 18px 54px; border-radius: 24px; border: 4px solid #ff6b9a; color: #ff6b9a; background: #181b21; }
  .flow { display: flex; align-items: center; gap: 22px; font-size: 46px; font-weight: 700; }
  .flow span.s { padding: 18px 26px; border-radius: 18px; background: #181b21; border: 3px solid #2a2e37; }
  .flow span.a { color: #ffc53d; font-size: 54px; }
  .big { font-size: 120px; font-weight: 800; letter-spacing: -2px; }
  .big b { color: #ffc53d; }
  .sub { font-size: 46px; font-weight: 700; color: #8d94a1; }
  .sub b { color: #3fd5bd; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="5">
  <section id="card" class="clip" data-start="0" data-duration="5" data-track-index="0">
    <div class="big" id="eq">[T]<sub style="font-size:.5em">B</sub> = <b>P⁻¹ A P</b></div>
    <div class="flow" id="flow">
      <span class="s" id="s1">B 좌표</span><span class="a" id="a1">→ P →</span>
      <span class="s" id="s2">표준 좌표</span><span class="a" id="a2">→ A →</span>
      <span class="s" id="s3">변환</span><span class="a" id="a3">→ P⁻¹ →</span>
      <span class="s" id="s4">B 좌표</span>
    </div>
    <div class="sub" id="sub">고유벡터로 자를 잡으면 → <b>대각행렬</b></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#eq', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: .5 }, 0);
  ['#s1','#a1','#s2','#a2','#s3','#a3','#s4'].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .3 }, .6 + i * .22));
  tl.fromTo('#sub', { opacity: 0 }, { opacity: 1, duration: .5 }, 2.6);
  window.__timelines['main'] = tl;
</script>
</body>
</html>
